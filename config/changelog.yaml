# 公告栏：版本更新说明。终端首页右上角「公告」只读展示，按版本号从大到小排（代码负责排序）。
# 每合并一个 PR，就在 releases 里按版本号的位置加一条（放最上面也行，显示时会自动排好），写给不懂代码的人看（大白话，不写文件名和函数名）。
#
# 字段：
#   version  版本号，1.<PR 编号>（同一个 PR 再改就写 1.<PR 编号>.1）；不能重复
#   date     合并那天（YYYY-MM-DD）
#   title    一句话标题（40 字以内）
#   pr       对应的 PR 编号（可多个，可不写）
#   added    新增了什么；fixed 修好了什么（两项至少写一条）
#   howto    怎么用（可不写）
# 已读状态只存在这台电脑的浏览器里。

releases:
  - version: "1.116"
    date: 2026-10-30
    title: 表情包刷白：很接近白的浅灰底也能刷干净
    pr: [116]
    fixed:
      - 上一版只刷白了颜色较深的灰底，接近白色的浅灰反而漏掉了；现在都能刷成纯白
  - version: "1.117"
    date: 2026-10-30
    title: 成员会睡觉、会想你、会主动找你，开心难过各有各的样子
    pr: [117]
    added:
      - 半夜她们在睡觉：你发的私聊多数醒了才回（「刚醒才看到」）；连着发、点名、关系近有时会把她吵醒，心情不好会嘟囔两句；你说出让人担心的话，睡着也马上回
      - 会主动找你：心情很低想找人说说、心情很好想分享、有新鲜事、惦记你说过的事、好几天没聊想你了；你没回不追，隔几天才找一次，你的深夜不找，全体每天最多 2 次
      - 开心、难过、想念、生气各有各的理解：从她自己的人物卡起步，真有过的情绪会记下来，说话时带着「上回是为了什么」；每周反思可以用自己的话改写某种情绪的理解（要有真实经历，不能照抄别人）
      - 不串味：发消息前，把混进来的别人的口头禅、颜文字、自称换回她自己的
      - 会养成习惯：同一个钟点老去同一个地方做同一件事，慢慢就成了习惯；闷了会破例，久不去会淡
  - version: "1.115"
    date: 2026-10-30
