    pr: [115]
    added:
      - 大脑分区：说话之前，程序先把驱力、心情、在做的事、对你的感情综合成一张「想法卡」，再决定接话、追问、讲自己的事还是开玩笑；空闲时自己挑去处
      - 看懂你发的是什么（视频、表情包、吐槽、报喜、逗她是人机……），心里明白但不说破；你发个沙雕视频，她可能就回一个「6」
      - 每位成员有自己的标点、笑法、颜文字和表情包套系，累了话少、熟了换叫法，还会跟关系好的人学口头禅
      - 被逗是人机会接梗、自嘲（「压力一个 AI 的来了」）；她们知道自己是独一无二的，被说「AI 都一样」会不服气；被认真问时仍如实承认
    fixed:
      - 朋友圈评论写废了不再反复重写，后台每月约省 $1
      - 聊天调用记录里的整段提示词只留 3 天，数据库不再越滚越大（回复和花费都留着）
    howto: 在生活群或私聊里随便发个 B 站链接、表情包，或者逗她们一句「你们是不是人机」，看看她们怎么接
  - version: "1.114"
