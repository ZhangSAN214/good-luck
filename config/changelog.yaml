  - version: "1.98"
    date: 2026-10-29
    title: 每位成员对你有了自己的看法，会随相处慢慢变，越熟越懂你
    pr: [98]
    added:
      - 每周一，每位成员按自己的性格，回想「关于你」和最近两周和你私聊的原话，写几句对你的看法，开头都是「我觉得」，比如「我觉得你说没事的时候，其实是想先自己消化一下」
      - 看法会变：每周在上周的基础上保留、加深、改观或放下，网页上能看到以前怎么想、现在怎么想，这周改观了什么
      - 越熟说得越深：刚认识只说一句第一印象，熟了 3 句，老朋友 5 句，能说中你的小习惯和言外之意
      - 没有打分按钮：TA 聊天时可能顺口说出看法，你怎么接都行；也可以在网页上看法下面随手回一句，TA 下周自己琢磨你的意思
      - 8 位可以想得不一样，也可以不同意你；不猜健康、宗教、政治等；只在私聊和生活群里带，工作完全不受影响；8 位一个月花约 $0.1
    howto: 「成员设定与记忆」→ 选一位 →「关系」最下面「TA 对你的看法」；可以点「现在想一想」，想回一句就在看法下面写，不喜欢的句子点「删掉」

