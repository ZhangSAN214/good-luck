# 公告栏：版本更新说明。终端首页右上角「公告」只读展示，最新的在最上面。
# 每合并一个 PR，就在 releases 最上面追加一条，写给不懂代码的人看（大白话，不写文件名和函数名）。
#
# 字段：
#   version  版本号，1.<PR 编号>（同一个 PR 再改就写 1.<PR 编号>.1）；不能重复
#   date     合并那天（YYYY-MM-DD）
#   title    一句话标题（40 字以内）
#   pr       对应的 PR 编号（可多个，可不写）
#   added    新增了什么；fixed 修好了什么（两项至少写一条）
#   howto    怎么用（可不写）
# 已读状态只存在这台电脑的浏览器里。

releases:
  - version: "1.57"
    date: 2026-10-29
    title: 工作和生活彻底分开；成员的经历一直留在你电脑上
    pr: [57]
    added:
      - 工作（讨论、协同、办公室、个人作答、头脑风暴）完全不读成员的档案和经历，效率和结果不受成员状态影响
      - 生活里成员可以「回想」自己在办公室办过哪些活（只读，不会反过来改工作）；匿名且还没揭晓的场次不读
      - 成员的经历记录默认一直保留，只存在你电脑上，以后可能用来训练本地小模型；随时可以一键清空
    howto: 不用操作，聊天和工作的表现都不变。

  - version: "1.55"
    date: 2026-10-29
    title: 成员有了自己的「自我档案」，人物卡读进来了
    pr: [55]
    added:
      - 「成员设定与记忆」里多了「自我档案」：导入人物卡（.md）后，每位成员的身份、性格、三观、说话方式、喜好、日常都分好类存在你电脑上
      - 每位成员有一张「随身卡」（约 400 字的精简版），私聊、群聊、朋友圈和生活里都带着它说话；你可以直接改随身卡，也能改回自动生成
      - 档案里每一项都能改、删、加、锁定；每次改动都是新的一版，修改记录里可以撤回到任意旧版本
      - 成员把 AI 身份当成普通身份：平时不刻意提，被认真问到时如实承认，不否认
    howto: 打开「成员设定与记忆」→ 自我档案 → 导入人物卡，选好每张卡对应哪位成员，点导入。工作和办公室不受影响。

  - version: "1.55.1"
    date: 2026-10-29
    title: 给成员搭好了「成员引擎」骨架（还看不出变化）
    pr: [55]
    added:
      - 每位成员有了一份「自我档案」，每次修改都留版本和修改记录，改错了可以撤回到任意旧版本，也能一键清空
      - 你可以锁住档案里的某一项，之后只有你能改
      - 成员的花钱有了优先级：你直接找她最优先，其次是主动找你、群聊、生活；快到额度时低优先级的只记一行
      - 准备好了一套 20 道情境题，用来检查成员会不会一味附和、编造回忆、否认自己是 AI
    howto: 这一步只搭骨架，聊天和生活的表现不变；档案的网页界面会在下一步（自我认知）做。

  - version: "1.54"
    date: 2026-10-29
    title: 成员之间的聊天「收得住」了，还有每周自检
    pr: [54]
    added:
      - 成员互相聊天时，说的话和前面重复、没有新内容，就自动收尾，不再硬聊下去；每句最多 200 字
      - 成员之间每天最多聊 40 句（含分享），到了就只记一行，不再花钱
      - 连续出错 3 次，或者生活 / 聊天的钱快花完（到 90%），当天的生活自动停掉，第二天恢复
      - 每周一自动写一份上周的自检：花了多少、谁说得多、有没有重复、出了几次错
    howto: 聊天页左边点「生活自检」查看；左下角能看到今天互聊了几句、是否已停。

  - version: "1.52"
    date: 2026-10-28
    title: 导出成果可以选字号、配色，也能直接存到指定文件夹
    pr: [52]
    added:
      - 结束行多了「更多选项…」：选格式、配色（简洁蓝 / 商务黑 / 清新绿 / 学术宋体）、字号大中小、PPT 16:9 或 4:3
      - 可以选择开头附题目、文末附上各人的初稿和修改过程
      - 保存位置：浏览器下载、每次自己选位置，或直接存进电脑上的固定文件夹（只在电脑上能用）
      - 记住上次的选择，快捷按钮也按这个样式导出
    howto: 题目做完后点结束行的「更多选项…」，选好后点「导出」。

  - version: "1.51"
    date: 2026-10-28
    title: 办公室加了「资料」内置浏览器：搜网页、看正文、存下来交给成员
    pr: [51]
    added:
      - 办公室提问区「添加附件」旁边多了「资料」按钮：输入网址打开网页，或输入关键词搜索
      - 网页只显示干净的正文（没有广告和菜单），正文里的链接可以接着点开
      - 整篇有用点「存全文」，只要一段就选中后点「存选中」，存进「资料夹」（只存在这台电脑上）
      - 资料夹里点「附上」，资料就作为附件放进提问区，讨论、头脑风暴、协同都能用
    howto: 打开网页不花钱；搜索每次约 1 美分。要登录才能看的页面读不到；为了安全，家里局域网的地址打不开。

  - version: "1.50"
    date: 2026-10-28
    title: 讨论和工作的成果可以导出成 Word、PPT、PDF
    pr: [50]
    added:
      - 一场完成后，结束那一行旁边有「导出」按钮：Word、PPT、PDF、Markdown、网页
      - PPT 自动排好：第一页是标题和题目，之后每个小标题一页，内容太多自动续页
      - 导出是电脑本地转换，不再找 AI，不花钱
    howto: 题目做完后，点结束行旁边的「Word」「PPT」或「PDF」就会下载文件。

  - version: "1.48"
    date: 2026-10-28
    title: 离开家也能用手机、平板连圆桌（Tailscale），手机和平板排版更合身
    pr: [48]
    added:
      - 「平板」面板单独列出 Tailscale 地址，也能生成二维码；在学校、外面用手机流量也能连回家里电脑上的圆桌
      - 可以只对 Tailscale 里的设备开放（家里 Wi-Fi 的其他设备连不上）
    fixed:
      - iPhone 添加到主屏幕后，顶部刘海和底部横条不再压住内容
      - 平板竖着拿时，首页卡片占满宽度，不再一个字一行；办公室的模式按钮不再折成两行，输入框在第一屏
      - 办公室的「新题目」说明从头显示，不再一打开就滚到底
    howto: 电脑、手机、平板都装 Tailscale、登录同一个账号，再用「圆桌（平板可连）」打开圆桌，在「平板」里扫标着 Tailscale 的二维码。

  - version: "1.47"
    date: 2026-10-28
    title: 音乐卡片跟着窗口自动调大小，换了封面马上显示新图
    pr: [47]
    fixed:
      - 成员封面换成新图后，卡片不再继续显示浏览器里缓存的旧图；之前选好的封面也照样选中
      - 音乐卡片跟着窗口大小自动调节：宽度随窗口变，封面按剩下的高度缩放，整张卡片不会被窗口底部切掉

  - version: "1.46"
    date: 2026-10-28
    title: 音乐卡片和首页同一种玻璃、跟时钟对齐，封面还会动
    pr: [46]
    fixed:
      - 音乐小卡和播放器卡片换成跟时钟、右边卡片同一种墨蓝玻璃（新的默认配色「墨蓝」）
      - 时钟条、音乐小卡、播放器卡片三块一样宽，左右边对齐
    added:
      - 封面会动：头发轻轻飘，画面上飘细雨、雪、落叶、花瓣、星屑或气泡，每位成员一种
    howto: 播放器右上角调色盘 →「动态」里可以换特效或选「不要动」；电脑开了「减少动态」时自动静止。

  - version: "1.45"
    date: 2026-10-28
    title: 圆桌有了电脑和手机 App
    pr: [45]
    added:
      - Windows 和 Mac 上可以像普通软件一样双击「圆桌」图标打开：自带窗口，不再有黑色窗口，关掉窗口就停止
      - 「圆桌（平板可连）」图标：同时让家里 Wi-Fi 下的平板 / 手机连进来，不用再双击 start_lan.bat
      - 安卓手机 / 平板可以装圆桌 App：记住电脑地址，打开就自动连上；离家地址（Tailscale）也能预先填好
      - iPhone / iPad 继续用 Safari「添加到主屏幕」，说明写进了文档
    howto: 关掉黑色窗口，双击一次 install_desktop.bat（Mac 上是 install_desktop.command），之后用桌面上的「圆桌」图标。安卓 App 的安装步骤见 docs/MOBILE.md。

  - version: "1.44"
    date: 2026-10-28
    title: 音乐换成竖版播放器卡片，还能跟着电脑上的 QQ 音乐
    pr: [44]
    added:
      - 终端首页时钟下面多了一张音乐小卡（封面、歌名、播放键），可以收起成小按钮；点开是竖版播放器卡片：画框封面、粗进度条、大按钮
      - 卡片的底色、主色、文字颜色、透明度和封面下那行小字都能自己改，有四套现成配色
      - 封面可以用歌曲自带的、成员的侧脸封面、自己上传的图，或者终端立绘
      - 切到「QQ 音乐」后，卡片显示电脑上 QQ 音乐正在放的歌和封面，按钮直接控制它；不登录、不碰账号、不下载音频
    howto: 点右上角「音乐」→ 上面切「本地音乐 / QQ 音乐」；右上角调色盘图标改外观和封面。
  - version: "1.41"
    date: 2026-10-28
    title: 可以在家里的平板上用圆桌了
    pr: [41]
    added:
      - 新的启动方式 start_lan.bat：同一个 Wi-Fi 里的平板 / 手机也能打开电脑上的圆桌，数据仍然只在电脑上
      - 顶部「平板」：设访问口令、看平板该打开的地址、生成二维码（平板相机一扫就进，10 分钟有效、只能用一次）
      - 平板可以「添加到主屏幕」，像 App 一样全屏打开；登录一次管 30 天
    fixed:
      - 平板横屏时终端顶栏压住大卡、小卡标题一个字一行
      - 平板竖屏时公寓楼被侧栏挤窄、群聊输入框跑到屏幕外
    howto: 关掉黑色服务窗口，双击 start_lan.bat；Windows 问是否允许网络时只勾「专用网络」。然后在网页顶部点「平板」设口令。平时只在电脑上用就照旧双击 start.bat。

  - version: "1.40"
    date: 2026-10-28
    title: 邮件栏能分类、标重要、显示图片，还能一键总结和翻译
    pr: [40]
    added:
      - 邮件自动分好类（考试成绩、作业截止、费用财务、课程教学、活动讲座、学校通知、系统通知、个人往来），点分类只看这一类；分错了可以在邮件里改
      - 每封邮件可以自己「标为重要」或取消，只记在这台电脑上，不会改到邮箱里
      - 邮件列表最上面多了速览：今天收到几封、重要的还有几封没读、最近的截止日期
      - 点「显示图片」看邮件原本的排版和图片；邮件里的脚本一律不运行，外面网站的图片先拦着（加载会让发件人知道你打开了），你点了才加载
      - 「AI 总结」「翻译」「AI 汇总重要邮件」：只有你点了才调用，第一次会先问你同不同意把这封发给 AI；每月最多花 $0.30、每天最多 20 次，结果存在本机，再看不再花钱
    howto: 点右上角「邮件」→ 打开一封 → 上面一排按钮：标重要、改分类、AI 总结、翻译、显示图片。不想用 AI 可以在齿轮设置里关掉。

  - version: "1.34"
    date: 2026-10-27
    title: 终端加了邮件栏，能读学校邮箱
    pr: [34]
    added:
      - 终端右上角多了「邮件」：接上你的学校邮箱，只读，老师、学院、考试这类重要邮件排在最前，数字是没读的重要邮件
      - 登录时会弹出一个单独的浏览器窗口，由你自己在微软登录页输入账号密码、完成验证；圆桌不收、不存密码
      - 只能看不能改：不发信、不删信、不移动、不标已读，那个窗口里的写入操作也会被拦下
      - 正文里找到的截止日期会列出来，你点「加入提醒」才算
      - 邮件只存在这台电脑上，成员看不到，也不发给任何模型；判断哪些重要用的是本机规则，不花钱
    howto: 点右上角「邮件」→「打开邮件栏」→「登录学校邮箱」，在弹出的窗口里登录。规则、保留天数、退出登录都在面板右上角的齿轮里。

  - version: "1.30"
    date: 2026-10-27
    title: 终端加了公告栏和多时区时钟
    pr: [30]
    added:
      - 终端右上角多了「公告」：每次更新都写在这里，新的在最上面，带「新」标记，看过就不再提醒
      - 终端左上角的时间换成时钟，最多同时显示三个地方的时间（默认曼彻斯特和中国）
      - 点时钟可以加减城市、改显示名、选 12 / 24 小时、显示日期和与本机的时差
      - 夏令时自动处理：曼彻斯特 10 月底切回冬令时、3 月底切回夏令时，和中国的时差会自己从 7 小时变成 8 小时
    howto: 点右上角「公告」看更新；点左上角时钟改城市。都不联网、不花钱，设置只存在这台电脑的浏览器里。

  - version: "1.27"
    date: 2026-10-27
    title: 公寓楼改成基建式剖面图
    pr: [27]
    added:
      - 公寓楼像一栋切开的楼：每层每间房一目了然，谁在哪个房间、在干什么都看得到
      - 可以看布局图、点房间放大看细节，顶上有资源栏
    howto: 点顶部「公寓楼」，再点任意房间放大。

  - version: "1.26"
    date: 2026-10-27
    title: 革新例会页面变简单，会自己挑大会小会
    pr: [26]
    added:
      - 革新例会页面去掉了多余的选项，只留「开会」和结果
      - 按时间自动决定：每个月第一场开大版本会（围绕一个主题大改），其余开小版本会
    howto: 点「革新例会」直接开会就行，不用再选类型。

  - version: "1.25"
    date: 2026-10-27
    title: 终端可以放自己的背景音乐
    pr: [25]
    added:
      - 终端顶上有音乐条：从电脑里挑歌加进播放列表，可以排序、删除、调音量
      - 列表循环、单曲循环、随机三种放法；切到别的页面会淡出暂停，回来接着放
    fixed:
      - 朋友圈切换作者时偶尔显示成上一个人的动态，已修好
    howto: 点终端顶上的音乐图标 →「添加」。音乐只存在这台电脑的浏览器里，不上传。

  - version: "1.24"
    date: 2026-10-27
    title: 革新例会分大小版本，每场列出 20 个以上插件
    pr: [24]
    added:
      - 例会分大版本（大改）和小版本（小改）两种
      - 每场开完自动整理一份不少于 20 个插件 / 项目的清单，按使用场景分好类
      - 例会结果放宽到前 10 名，附一段给新手的大白话说明

  - version: "1.23"
    date: 2026-10-27
    title: 革新例会会自己找资料，建议可以一键「做这条」
    pr: [23]
    added:
      - 成员会自己上白名单网站找资料、写资料卡，另一位成员复核后才收进来
      - 每条建议旁边有「做这条 / 不做」按钮；「做这条」会交给开发侧去实现并开 PR
      - 网页上的「合并」按钮（默认关闭，开了也要你确认）
    howto: 革新例会结果页里，看中哪条就点「做这条」。

  - version: "1.22"
    date: 2026-10-27
    title: 界面整体改版：深色夜景 + 玻璃卡片
    pr: [22]
    added:
      - 首页、办公室、群聊、公寓、朋友圈全部换成深色夜景加液态玻璃的新样子
      - 成员设定、上网两个弹窗改成手机「设置」那样的分组列表
      - 切换页面有更顺滑的动画
    fixed:
      - 打开网页时自动清一次旧缓存，不会再一直看到改版前的界面
      - 朋友圈动态不再互相重叠

  - version: "1.21"
    date: 2026-10-27
    title: 朋友圈不再发重复内容；新增「会慢慢淡忘」的记忆（默认关）
    pr: [21]
    added:
      - 成员发朋友圈前会和当天别人的动态比一比，太像就换一件事或不发
      - 半衰期记忆：越久远、越少被提起的事越容易淡忘，更像真人（默认关闭，要在配置文件里打开）

  - version: "1.20"
    date: 2026-10-26
    title: 新增革新例会：成员一起给圆桌提改进建议
    pr: [20]
    added:
      - 成员读资料卡、各自提建议、互相投票，最后导出一张「采纳单」给你拍板
    howto: 点办公室顶上的「革新例会」。默认关闭，要先在配置文件里打开。

  - version: "1.19"
    date: 2026-10-26
    title: 开机自动对账，新增插件榜
    pr: [19]
    added:
      - 插件榜：列出调研过的好用插件 / 项目，以及它们对圆桌有什么用
    fixed:
      - 服务意外关掉后，没做完的讨论不会一直卡在「进行中」，会变成可以点「继续」的暂停状态
    howto: 插件榜在办公室右侧面板的「插件榜」页签。
