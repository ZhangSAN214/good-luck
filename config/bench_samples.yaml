# 工作台生成器的本地示例素材包（2026-10-31 工作台大更新）：
# 生成的工作台需要示例照片、3D 模型时先用这里的本地文件，不再在线取图（修图台那次所有照片都打不开）。
#
# - 只收能随项目打包的许可证：CC0 / 公有领域，或注明作者即可的 CC-BY（attribution 必填）。
# - 每项钉死 sha256：下载后对不上就丢掉，不冒充。
# - 下载：在电脑上运行 `python scripts/fetch_bench_samples.py`（只下载这里列的，存到 data/bench/_samples/，不进仓库）；
#   `--check` 只看哪些已经有了。也可以把你自己的图放进 data/bench/_samples/mine/（只用于你自己的台）。
# - 加一项：照下面的格式写，sha256 用 `sha256sum 文件` 算；不写 sha256 的不会被下载。
samples:
