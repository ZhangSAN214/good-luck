date: 2026-11-23
pr: [234]
level: minor
title: 铁甲突围第二版：可以 2 对 2 组队了
added:
  - 新玩法「2 对 2」：你和一位成员一队，对打另外两位；也能旁观她们四个分两队打。炮弹打不伤队友
  - 补给从 3 种变成 6 种：新增穿甲（能打碎钢墙）、加速、地雷（按 E 或 K 埋在身后，只炸对手）
  - 打起来更有手感：被打中会震一下、停一下，有火花、碎块和履带印
  - 成员会在头顶冒小气泡说话，每位按自己的性格说（不花钱）
  - 开局页下面多了「战绩」表：每位的场次、拿第一和击毁次数
howto: 点顶部「游戏区」→「铁甲突围」→ 选「2 对 2」，先点的那位是你的队友，再点「开打」。
