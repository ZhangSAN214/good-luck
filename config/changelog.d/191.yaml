pr: [191]
level: minor
title: 工作台：主视觉先做、固定版型、方案书有出处、办公室能把大项目交给工作台
added:
  - 主视觉先行：先只做最大的那块主画面，单独截图打分（是不是真素材、够不够大、有没有自己的样子），过了才做其余窗口；改两次还不行就停下来让你定
  - 6 种固定版型（主视觉 + 侧栏、主视觉 + 底部数据条、四分屏、流程四区、编辑器三栏、单列阅读），签字前可以换；电脑、平板、手机都不乱，手机上主画面在最上面
  - 方案书里每个技术选择都写明参考了调研报告的哪一条；评审会核对借鉴的东西真的做进去没有
  - 办公室遇到大项目会先问你「要不要交给工作台」；交了以后，办公室里已经说过的不再重复问，做完把成品和验收结果发回那场对话
howto: 在办公室提一个要做成工具或平台的大需求，经理决定项目分工时会弹出卡片，选「交给工作台」即可
