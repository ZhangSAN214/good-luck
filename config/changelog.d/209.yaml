date: 2026-11-05
pr: [209]
level: minor
title: 工作台生成器会自己上网找素材和数据了
added:
  - 做工作台时，每个窗口会先列出要用的照片、图标、3D 模型、字体和数据，「资源检索员」按清单去免费、不要 key 的公开网站找
  - 只用许可证宽松的素材，每个文件都记下来源、作者、许可证和下载日期，自动写好署名；找不够就如实写「只找到几个」，不凑数、不画假图
  - 数据只用能联网的公开接口，当场试一次通不通再用；写代码要查的资料链接只留能打开的
  - 底部多了「素材」：能看到找来的每样东西，不喜欢可以「换一个」或「不要」，也能「重新找」
howto: 工作台 → 生成器 → 做一个项目后点底部「素材」。第一次真找要在你电脑上跑，不花钱
