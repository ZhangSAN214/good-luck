date: 2026-11-05
pr: [207]
level: minor
title: 工作台生成器处处能改，改了只重做受影响的
added:
  - 生成器底部多了「改动」：访谈回答、调研、素材、分段、每个窗口的说明、代码和数据都能直接改
  - 每次改动都会存一版，能看改了什么，也能退回任意一版；会记下是你改的还是哪位助手改的
  - 改了上游以后只标出受影响的窗口和原因，点「只重做受影响的」就只返工这几个，不用整个重来
  - 每个窗口可以写一句话交给助手改，也能指定换哪位助手来改
howto: 工作台 → 生成器 → 做好一个项目后点底部「改动」，选要改的东西，改完点「保存这一版」
