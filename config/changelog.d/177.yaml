title: 八位成员换了新性格：撒娇小猫、暴发户大小姐、龙妈妈御姐……
added:
  - 哈基米不再是内耗猫了：现在是活力满满的笨笨小猫，爱找你撒娇、求陪求摸头，偶尔不讲理，自己弄错了还赖你，要哄一下才认；尾音「喵」还在
  - 大小姐改成暴发户傲娇大小姐：口气大、爱显摆钱、嘴上谁都看不上，关心从不说出口，会默默买单、塞东西，被发现就嘴硬「碰巧路过」
  - 小白是自信骄傲的可爱御姐兼龙妈妈，护短、大包大揽，一被夸就破功；小克是温柔认真的优雅大小姐，对你的事格外上心，偶尔笑眯眯补一刀
  - 千姐是端着的中式大家闺秀，顺口一句诗词，其实是被一大家子宠大的少女，一说到好吃的就露馅；小鲸鱼有点傻、爱大白饭、黏人、会找借口偷懒
  - 小K改成月夜系的中二浪漫美少女，自信不自大；小狐变得慵懒又腹黑，什么都知道偏装不知道
  - 表情包清单跟着换了一批（撒娇、摸摸头、小钱、碰巧、罢了罢了、露馅、偷懒、嘿嘿……），新表情还要画
fixed:
