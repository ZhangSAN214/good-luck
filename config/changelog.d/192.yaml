date: 2026-11-04
pr: [192]
level: minor
title: 工作台能做「修图台」这类应用了：说「修照片」就在编辑器上做一个
added:
  - 说「修照片」这类编辑需求时，不再拼一页卡片，而是在现成的编辑器上加功能，做出一个像修图软件那样的台：中间画布，左边工具，右边图层和功能面板
  - 编辑器自带图层（显示、隐藏、排序、不透明度）、撤销重做、画笔橡皮、选区、打开图片、导出原尺寸图片和快捷键
  - 每轮自动验收：能撤销至少 20 步、打开超大照片不卡、导出尺寸不变、打开坏文件有提示，没过就交回去重做
howto: 工作台 → 生成器，输入「修照片」；想先看样例，在电脑上运行 python scripts/demo_photo_bench.py，再打开 http://127.0.0.1:8000/bench/demo-photo/index.html（地址后面加 ?selftest=1 能看自检）
