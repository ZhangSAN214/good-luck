date: 2026-11-23
pr: [233]
level: minor
title: 游戏区新增「游戏工坊」：按你的要求自动做游戏
added:
  - 写一句想玩什么，工作台的编程助手帮你做成一个网页小游戏：Claude Code 主做，DeepSeek 和 Codex 依次试玩、找错、修好
  - 做完程序会在浏览器里自己试玩一遍，有报错或显示不全就交回去返工；还剩的小问题会标在游戏卡片上
  - 做好的游戏都是原创的，在沙箱里打开，碰不到圆桌的其他东西；可以随时叫停、删除
  - 走工作台的包月订阅，不花圆桌的 API 额度
howto: 点顶部「游戏区」，往下翻到「游戏工坊」，写下想玩的游戏，点「开做」；做好后点「玩」。
