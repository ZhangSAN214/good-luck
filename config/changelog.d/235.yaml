date: 2026-11-23
pr: [235]
level: minor
title: 铁甲突围：炮弹会反弹，地图变成迷宫
added:
  - 炮弹碰到钢墙和地图边会弹回来，最多弹两次；地图上新加「斜板」，炮弹碰到会拐个弯，可以打拐弯炮
  - 小心被自己弹回来的炮弹打中（贴着墙开炮马上弹回来的算接住，不会掉命）；照旧打不伤队友
  - 地图默认变成迷宫：每局随机生成，四个角一样公平；砖墙能打穿，越打越开阔
  - 成员也会打反弹炮和拐弯炮，难度越高算得越远
  - 开局页可以选「迷宫地图 / 开阔地图」和「炮弹反弹 / 不反弹」
howto: 点顶部「游戏区」→「铁甲突围」，默认就是迷宫加反弹，直接点「开打」。
