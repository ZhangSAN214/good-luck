# 称呼规则
# 匿名开启：成员用 codes 里的塔罗牌代号（随机分配，不含任何身份信息；发给模型的内容也只用代号）。
# 匿名关闭：成员用"昵称·模式"（如 鲸鱼娘·全力），统筹显示为"昵称·模式（统筹）"；
#           界面、过程区、交接链、贡献统计和成员之间互相称呼都用这个名字。
#           同一桌里厂商和档位都相同的两个模型，后一个自动加序号（鲸鱼娘·全力2）。
# 想改昵称或模式名，只改这个文件。code_prefix 留空：代号 / 昵称本身就是称呼。
code_prefix: ""

# 匿名代号池：塔罗牌 22 张大阿卡纳（不得少于 roundtable.yaml 的 seats）
codes:
  - 愚者
  - 魔术师
  - 女祭司
  - 皇后
  - 皇帝
  - 教皇
  - 恋人
  - 战车
  - 力量
  - 隐者
  - 命运之轮
  - 正义
  - 倒吊人
  - 死神
  - 节制
  - 恶魔
  - 高塔
  - 星星
  - 月亮
  - 太阳
  - 审判
  - 世界

# 厂商昵称：键是 models.yaml 里的 vendor。没有昵称的厂商直接用厂商名。
nicknames:
  OpenAI: 小白龙       # GPT
  Anthropic: 克劳德    # Claude
  xAI: 歌若柯          # Grok
  DeepSeek: 鲸鱼娘
  Google: 双子星       # Gemini
  Alibaba: 千问        # Qwen

# 档位的显示名：flagship = 全力模式，budget = 节电模式
tier_labels:
  flagship: 全力
  budget: 节电

nickname_separator: "·"
coordinator_suffix: "（统筹）"

# 人设模式（后续扩展）：按模型 id 配置昵称、性格、口头禅、专长。
# 示例：
# personas:
#   gpt-6-sol:
#     nickname: 小G
