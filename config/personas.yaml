# 再自动补上 members.json 里的立绘 / 小人 / 头像，一共最多 3 张）、stickers 表情清单（name 表情名，caption 画进图里的字，
# action 动作和表情）。梗和配文都来自各自的人物卡；画风学 B 站、小黑盒流行的 Q 版二创贴纸，不复制原图。
