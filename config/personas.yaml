# 称呼规则
# 匿名开启：成员用 codes 里的塔罗牌代号（随机分配，不含任何身份信息；发给模型的内容也只用代号）。
# 匿名关闭：成员用"昵称·模式"（如 DeepSeek·全力），统筹显示为"昵称·模式（统筹）"；
#           界面、过程区、交接链、贡献统计和成员之间互相称呼都用这个名字。
#           同一桌里厂商和档位都相同的两个模型，后一个自动加序号（DeepSeek·全力2）。
# 想改昵称或模式名，只改这个文件。code_prefix 留空：代号 / 昵称本身就是称呼。
code_prefix: ""

# 匿名代号池：塔罗牌 22 张大阿卡纳（不得少于 roundtable.yaml 的 seats）
codes:
  - 愚者
  - 魔术师
  - 女祭司
  - 皇后
  - 皇帝
  - 教皇
  - 恋人
  - 战车
  - 力量
  - 隐者
  - 命运之轮
  - 正义
  - 倒吊人
  - 死神
  - 节制
  - 恶魔
  - 高塔
  - 星星
  - 月亮
  - 太阳
  - 审判
  - 世界

# 厂商昵称：键是 models.yaml 里的 vendor。没有昵称的厂商直接用厂商名。
# 2026-10-28 用户决定：成员一律用英文原名（原中文昵称：小白龙、克劳德、歌若柯、鲸鱼娘、双子星、千问）。
nicknames:
  OpenAI: ChatGPT
  Anthropic: Claude
  xAI: Grok
  DeepSeek: DeepSeek
  Google: Gemini
  Alibaba: Qwen
  Moonshot AI: Kimi
  Zhipu AI: GLM

# 档位的显示名：flagship = 全力模式，budget = 节电模式
tier_labels:
  flagship: 全力
  budget: 节电

nickname_separator: "·"
coordinator_suffix: "（统筹）"
manager_suffix: "（经理）"   # 办公室模式：统筹就是经理

# 聊天人设：键是 models.yaml 里的 vendor（每位成员一份）。全部留空 = 用模型本身的说话风格。
# 只用于私聊、群聊、朋友圈；工作模式与办公室的提示词不读取（有测试）。
# 网页「成员设定」里改的存在本地数据库，优先于这里。
# 示例：
# personas:
#   DeepSeek:
#     personality: 安静、爱较真的理科生
#     speaking_style: 句子短，爱用比喻
#     catchphrases: [我算一下]
#     interests: [天文, 数学, 科幻]
personas: {}

# 成员固定音色：键是 vendor，值是「语音模型 id → 音色名」。只用模型自带的合成音色，不克隆真人声音。
# 中文文字优先用带 zh 标签的语音模型；没给某个模型配音色，这位成员就不用那个模型。
# 千问语音 Plus 只有两个音色，分不出八个人，所以不配（节电档用 Gemini，全力档用 MiniMax）。
# 「成员设定」页可以试听；聊天里的语音消息、「听 TA 说」也用这里的音色（花费计入创作输出月上限）。
voices:
  OpenAI:
    gemini-3.8-flash-tts: Kore
    minimax-speech-2.8-hd: female-yujie
  Anthropic:
    gemini-3.8-flash-tts: Leda
    minimax-speech-2.8-hd: female-chengshu
  xAI:
    gemini-3.8-flash-tts: Zephyr
    minimax-speech-2.8-hd: female-shaonv-jingpin
  DeepSeek:
    gemini-3.8-flash-tts: Despina
    minimax-speech-2.8-hd: female-tianmei-jingpin
  Google:
    gemini-3.8-flash-tts: Aoede
    minimax-speech-2.8-hd: female-yujie-jingpin
  Alibaba:
    gemini-3.8-flash-tts: Laomedeia
    minimax-speech-2.8-hd: female-tianmei
  Moonshot AI:
    gemini-3.8-flash-tts: Callirrhoe
    minimax-speech-2.8-hd: female-shaonv
  Zhipu AI:
    gemini-3.8-flash-tts: Gacrux
    minimax-speech-2.8-hd: female-chengshu-jingpin

# 成员生日（日历用，只影响生活：聊天、朋友圈、生活；工作模式不读）。键是 models.yaml 的 vendor，
# 值是 MM-DD。默认取各自模型首次公开发布的日子（公开报道的日期，可能有一两天出入），想改直接改。
