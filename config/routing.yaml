# 阵容与花费：所选档位内的每个可用模型都上桌（担任组员或统筹），省钱靠选档位，不靠减人。
#
# 中立原则：这里只引用档位（flagship / budget）和能力标签，不得出现具体模型名或厂商名（有测试检查）。
# 用户的选择（档位 / 自选的模型）永远优先。

# 单题预计花费超过此值时，执行前先请用户确认（美元）
confirm_threshold_usd: 0.30

# 用户没有指定时使用的档位（plans 中的名称）
default_plan: budget

# 难度只用于估计答案长度（花费预估）；规则和规划员都判断不出时使用此值
default_difficulty: medium

# 规划员：规则判断不出时，用最便宜的模型估计题型与答案长度（不影响谁上桌）
planner:
  tiers: [budget]
  max_tokens: 300
  # 用于挑选"最便宜"时估算单次调用成本
  expected_input_tokens: 700
  expected_output_tokens: 150

# 规则判断（不调用模型）。按顺序检查：
# - 第一条给出 difficulty 的规则决定难度（只影响预估的答案长度）；
# - require_tags / task_type 会累积（例如有图片 → 需要 vision 标签）。
# 条件（when）之间是"且"的关系：
#   min_chars / max_chars   题目字数范围
#   any_keywords            包含任一关键词
#   no_keywords             不包含任何关键词
#   attachment_types        带有任一类型的附件
triage:
  - name: has_image
    when: {attachment_types: [image]}
    then: {require_tags: [vision]}
  - name: very_long
    when: {min_chars: 1500}
    then: {difficulty: hard}
  - name: very_short
    when:
      max_chars: 30
      no_keywords: [证明, 推导, 为什么, 分析, 比较, 论述, prove, derive, why, explain, compare]
    then: {difficulty: simple}

# 成员档位：tiers 中所有可用模型都上桌；其中一个按 roundtable.yaml 的 coordinator 规则
# 担任统筹（本题不作答），其余为组员。没有可用渠道的模型列为"缺席"。
# pipeline 省略时使用 roundtable.yaml 中的完整流程。
# escalate_to：汇总仍有分歧或把握低时，询问用户是否用该档位重做（不会自动升级）。
plans:
  budget:
    label: 便宜档全员
    tiers: [budget]
    escalate_to: flagship
  flagship:
    label: 旗舰档全员
    tiers: [flagship]

# 自选：用户勾选上桌的模型（至少 min_members + 1 个），可指定其中一个当统筹
custom:
  label: 自选

# 升级询问条件（满足任一即询问）：汇总中未解决的分歧数 ≥ min_disagreements，或把握程度在列表中
escalation:
  min_disagreements: 1
  confidence: [low]

# 花费预估参数（token 数为粗估，用于执行前提示，可按实际记录调整）
estimate:
  cjk_chars_per_token: 1.0
  other_chars_per_token: 4.0
  prompt_overhead_tokens: 500       # 系统提示等固定开销 / 每次调用
  answer_tokens: {simple: 200, medium: 1200, hard: 2500}
  answer_tokens_bounds: {min: 200, max: 6000}  # 规划员给出的长度估计会被限制在此范围
  review_tokens_per_peer: 400
  revise_overhead_tokens: 300
  synthesize_tokens: 1500
  # 协同模式
  decompose_tokens: 800             # 统筹拆分子任务
  volunteer_tokens: 300             # 每位成员的自荐
  assign_tokens: 400                # 统筹分配
  merge_tokens: 3000                # 统筹合并成完整成果
