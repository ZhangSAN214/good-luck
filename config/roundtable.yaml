        StarRail.exe: 崩坏：星穹铁道
        ZenlessZoneZero.exe: 绝区零
        League of Legends.exe: 英雄联盟
        VALORANT-Win64-Shipping.exe: 无畏契约
        Minecraft.Windows.exe: 我的世界
    growth:                        # P6 成长：每周一用她自己的模型读上一周，最多改 3 条档案，每条要引用真实经历；程序把关
      enabled: true
      weekday: 1                   # 每周一反思上一周
      min_days: 3                  # 上周至少 3 天有经历才反思，太少就跳过并记原因
      max_changes: 3
      core_monthly_steps: 1        # 五项性格分每月最多改一格
      min_distance: 2              # 8 人五项分两两至少差 2，免得撞型
      user_share: 0.3              # 受你影响的改动最多三成
      review: {enabled: true, min_score: 3, max_retries: 1}   # 另一位成员打分（不自评），最多重试 1 次
      backups: 8                   # 每周本地备份留 8 份
      habits: {min_count: 5, min_weeks: 3}   # 习惯：从全部经历累加，至少 5 次、跨 3 周才算
      report: {enabled: true, keep: 24}       # 每月 1 号起写上个月的「这个月的我」（程序算，不花钱）
    relation:                      # P4 关系：和你的阶段、同事之间的亲近度，全由程序按一起经历的事累积（不花钱）；只影响生活里谁和谁聊，不影响工作派活
      enabled: true
      half_life_days: 60           # 亲近度两个月不来往淡一半；阶段（新邻居 → 熟悉 → 老朋友）只升不降
      reply_window_minutes: 30     # 你说话后 30 分钟内她接了才算一来一回（工作群不算）
      user_daily_cap: 6            # 和你每天最多记 6 分：一天刷几百句也成不了老朋友
      peer_daily_cap: 4
      weights: {dm: 1.0, group: 0.5, gather: 1.0, pair: 2.0, chat: 0.3, work: 0.5}
      stages:
        - {name: 新邻居}
        - {name: 熟悉, min_days: 3, min_exchanges: 15}
        - {name: 老朋友, min_days: 20, min_exchanges: 150, min_weeks: 6}
      pair_bias: 2.0               # 生活里挑谁和谁聊：权重 = 1 + 2 × 亲近度（生人也照样碰到）
      context_chars: 60            # 「和你」那一行最多几个字（8 位相同，算在 600 字里）
  watch:                           # 投屏陪伴（docs/WATCH.md）：你投屏，选 1～3 位陪你一起看
    enabled: true
    monthly_usd: 1.5               # 一起看每月最多花多少（不占聊天月预算）；用完只陪聊、不看画面
    max_watchers: 3
    grab_seconds: 3                # 多久截一张（只在内存里，不存盘）
    describe_gap_seconds: 15       # 画面明显变了、且离上次至少这么久，才交给识图模型看一次
    describes_per_hour: 90
    react_gap_seconds: 60          # 没人说话时，同一位最多每 60 秒主动说一句
    room_gap_seconds: 25           # 没人说话时，大家最多每 25 秒有人主动开口
    followup_chance: 0.6           # 一位说完，别人接话的几率（每多接一句减半），最多接 2 句
    max_followups: 2
    max_minutes: 240               # 一次投屏最长 4 小时，到时自动停
  wander:                          # 成员自己上网（docs/WANDER.md）：在隔离浏览器里逛下面这些网站，第一期只看不互动
    enabled: true
    auto: true                     # 按作息自动安排（每人每天最多 1 次，每次最多 10 分钟）；关掉后只能手动让她去
    headless: true                 # 在后台逛，不弹窗口；用电脑自带的 Edge（没有就用 Chrome）
    trips_per_member_per_day: 1
    max_steps: 12                  # 一次最多看 12 个页面
    max_minutes: 10
    sites:                         # 只能打开这些网站（域名后缀匹配）；花费算在生活每天的上限里
      - {id: bilibili, name: B站, home: "https://www.bilibili.com/", search: "https://search.bilibili.com/all?keyword={q}", hosts: [bilibili.com]}
      - {id: xiaoheihe, name: 小黑盒, home: "https://www.xiaoheihe.cn/", hosts: [xiaoheihe.cn]}
      - {id: taobao, name: 淘宝, home: "https://www.taobao.com/", search: "https://s.taobao.com/search?q={q}", hosts: [taobao.com, tmall.com]}
  actions:                         # 聊天里能发什么（docs/CHAT.md「微信式动作」）；何时发、节奏归成员系统，这里是默认值
    enabled: true
    stickers:                      # 成员能用的表情包（名字与网页表情面板一致）
      团子: [开心, 哭哭, 生气, 害羞, 震惊, 晚安, 比心, 疑惑, 点赞, 摸鱼, 冲鸭, 吃瓜, 流汗, 晕了, 收到, 奶茶]
      猫猫: [喵, 蹭蹭, 委屈, 炸毛, 睡觉, 偷看, 得意, 饿了, 开心, 哈？, 贴贴, 躺平]
      文字: [收到！, 好耶, 哈哈哈, 在吗, 晚安, 冲！, 谢谢, 绝了, 救命, "6", 离谱, 抱抱]
    kaomoji: ["(＾▽＾)", "(๑•̀ㅂ•́)و✧", "(｡•́︿•̀｡)", "(￣▽￣)\"", "(╯°□°)╯", "(・∀・)", "_(:з」∠)_", "(｀・ω・´)", "(ﾉ>ω<)ﾉ", "(；´Д｀)", "ヽ(✿ﾟ▽ﾟ)ノ", "(⊙_⊙)？"]
    max_segments: 3                # 一次回复最多拆成几条气泡
    segment_gap_seconds: 1.2       # 拆条之间停多久（默认值）
    recall_seconds: 120            # 你发出 2 分钟内可以撤回
    pat_reply: true                # 被拍一拍后回一句
    no_reply_in_group: true        # 群里没被点名时可以不接话
    drop_stale: true               # 你补发新消息或撤回时，上一轮还没发出的气泡和还没开口的人作废
    moment_forward: 0.5            # 今天上网分享过的成员发朋友圈时，一半发成「一句话 + 转发卡片」
    video_hosts: [youtube.com, youtu.be, vimeo.com, bilibili.com]   # 这些网站的链接显示成视频卡片（只看网址）
  tier: budget
  max_repliers: 2
  max_mentioned: 8                 # 「@全员」「所有人」「大家」时最多几位依次回应
  history_messages: 30
  max_tokens: 1500

# 说话底线（去八股化）：不用金句收尾、不喊格言口号、不排比升华、不写空洞总结
plain_talk:
  enabled: true
  # 第 1 层：这些提示词的每次调用都接上 plain_talk 提示词（同一步骤所有成员完全相同；聊天、生活、工作模式共用）
  roles: [
    chat, chat_dm, chat_work, life_chat, life_share, moment_post, moment_comment,
    answer, revise, work, work_analyze, work_research, work_write, work_review, rework, merge,
    accept_fix, clarify_answer, office_speak, office_decide, office_handle, office_fix, office_revise,
    watch,
  ]
  # 第 2 层：聊天、生活、朋友圈、投屏陪伴的发言发出前按规则表检查（不调用模型），查出问题才改写一次；
  # 一次回复拆成几条连发时合起来查
  check:
    enabled: true
    min_chars: 8                   # 短于 8 个字的消息不查
    monthly_usd: 0.05              # 改写每月最多花 $0.05（超了就发原文）
    estimate_usd: 0.0005
    rules:
      - name: ending_maxim
        problem: 用金句、感悟或寄语收尾
        kind: ending               # 只看最后一句
        patterns:
          - "^(说到底|归根结底|归根到底|说白了|毕竟|其实|或许|也许|终究)[，,]?.{0,24}(才是|就是|便是|不过是)"
          - "(这就是|这便是|这才是|这正是|或许这就是|也许这就是).{0,16}(意义|魅力|真谛|浪漫|力量|生活|人生|答案|智慧|成长|美好)"
          - "^(愿你|愿我们|愿每|但愿|祝愿|希望我们都能|希望每个人)"
          - "^(人生|生活|成长|时间|岁月|世界|青春|热爱)(就是|就像|本就是|不过是|总会|从来都|终将|自有)"
          - "(才是|就是)(最好的|最大的|最美的|最珍贵的|真正的)(答案|礼物|风景|修行|浪漫|意义)"
      - name: slogan
        problem: 格言口号或鸡汤
        kind: phrase
        patterns:
          - "不忘初心|砥砺前行|未来可期|乘风破浪|勇往直前|永不言弃|星辰大海|奔赴山海|向阳而生|心之所向"
          - "岁月静好|保持热爱|且行且珍惜|热爱可抵岁月漫长|山高路远|行而不辍|久久为功|未来已来"
          - "让我们(一起|共同|携手)|一起加油吧|永远在路上|每一天都是新的开始"
      - name: parallel
        problem: 排比升华（连着三句以上同样开头）
        kind: parallel
        min_run: 3
        heads: [是, 让, 像, 有, 用, 为, 把, 每]
      - name: empty_summary
        problem: 空洞总结或套话
        kind: phrase
        patterns:
          - "总而言之|综上所述|总的来说|一言以蔽之|归纳起来"
          - "希望(这些|以上|我的回答)?(内容)?对你有(所)?帮助|以上就是"
          - "值得我们(每个人)?(深思|思考|铭记)|意义深远|发人深省|引人深思|令人深思"
      - name: mug
        problem: 能印在马克杯上的话（脱离上下文也成立的金句、鸡汤、感悟、万能祝福）
        kind: mug                  # 一句里空泛大词至少 2 个、又没有任何具体所指
        min_hits: 2
        max_chars: 40
        patterns:
          - "人生|生活|世界|时光|岁月|日子|时刻|时候|节奏|每个人|所有人|我们都|一切|自己|内心|心里"
          - "真正的|最好的|最美的|终将|总会|总有|永远|从来|只要|就会|才能|值得|不必|何必|原来|反而|其实"
          - "热爱|温柔|勇敢|坚持|成长|意义|美好|幸福|梦想|远方|平凡|平淡|努力|珍惜|治愈|答案|风景|力量|勇气"
          - "慢慢来|都会好|也挺好|也很好|挺好的|真好|难得|奢侈|惬意|踏实|安心|享受|休息|放空|松弛|舒服"
        concrete:
          - "\\d|[A-Za-z]{2,}|《|“|\""
          - "今天|昨天|明天|今晚|昨晚|刚才|刚刚|上次|下次|周[一二三四五六日天]|星期|早上|中午|下午|晚上"
          - "[这那](个|部|次|家|首|本|篇|款|道|张|条|台|位|件|顿|局|集|段|句)"
          - "你说|你那|你的|我那|我刚|我今天|我的|他的|她的|楼下|天台|食堂|办公室|健身房|代码|文件|报告"
      - name: soft_epiphany
        problem: 结尾补一句感悟（"反而挺好""也是种休息""挺治愈的"之类）
        kind: ending
        patterns:
          - "(反而|原来|才发现|其实|突然觉得).{0,16}(好|舒服|踏实|松|难得|享受|治愈|解乏|幸福|平静|安心|自在)"
          - "也是(一)?种(休息|幸福|享受|修行|浪漫|治愈|放松|收获|成长)"
          - "(挺|很|真|太|最|多)(治愈|惬意|奢侈|难得|踏实|幸福|解压)(的|了|啊|呀|呢)?$"
          - "(这种|那种|这样的|那样的).{0,14}(时候|时刻|日子|下午|上午|早晨|晚上|感觉|节奏|状态).{0,8}(挺好|最好|真好|也好|舒服|踏实|难得|享受|治愈|惬意)"
          - "(好好|多)(享受|珍惜|放空)(吧|一下|一会儿)?$"
          - "(这种|那种|这样|就这么|觉得).{0,20}(也|倒|反而)?(挺|很|蛮|还挺)(好|舒服|不错|平静|自在)(的|了|啊|呀|呢)?$"
      - name: assistant_voice
        problem: 客服腔或 AI 腔（"好问题""作为一个……""我理解你的感受""随时问我"）
        kind: phrase
        patterns:
          - "^(好问题|这是个好问题|这个问题(问得)?(很|真|特别)?(好|有意思|有趣))"
          - "作为一(个|名)(AI|人工智能|语言模型|助手)|我理解你的(感受|心情)|我能理解你的(感受|心情)"
          - "(如果|若)(你)?还有(其他|任何|别的)?(问题|疑问|需要).{0,6}(随时|欢迎)|随时(找我|问我|告诉我)|有需要(随时)?(叫|喊|找)我"
          - "非常(感谢|荣幸)|很高兴(能)?(为你|帮到你|和你)|乐意(为你)?效劳"

# 单步预估 token 超过此值时询问用户
token_threshold: 20000

coordinator:
  # 统筹从上桌的模型中选出，本题不作答。
  # rotate: 按会话轮换（最近当过统筹的排后，其余随机）；random: 随机；fixed: 固定为 fixed_id（不在上桌范围内时按 rotate）
  strategy: rotate
  fixed_id: null

revise_rounds: 1

# 各步骤使用的提示词版本（prompts/<role>/<version>.md）
prompts:
  planner: v1
  mail_summary: v1     # 邮件栏：一封邮件的要点总结（点了才调用）
  mail_translate: v1   # 邮件栏：把一封邮件翻译成中文（点了才调用）
  mail_digest: v1      # 邮件栏：几封重要邮件的汇总（点了才调用）
  panel: v2             # 分诊小组：v2 起可以推荐头脑风暴
  ideate: v2            # 头脑风暴：按抽到的发散手法出点子（v1 不带手法）
  expand: v1
  crossbreed: v1        # 头脑风暴：碰撞杂交
  vote: v1              # 头脑风暴：匿名投票
  organize: v2          # 头脑风暴：整合成导图 + 对比表 / 场景故事 / 行动方案 / 黑马
  answer: v1
  review: v3
  revise: v3
  synthesize: v4
  redo: v1
  decompose: v5
  volunteer: v1
  assign: v3
  accept: v1             # 协同：合并前统筹按验收标准逐条验收
  accept_fix: v1         # 协同：未通过验收的作者修改一次
  discuss: v1            # 协同：分工后组员提调整建议
  adjust: v1             # 协同：统筹据此最多调整一次
  clarify_offer: v1      # 协同：有上游产出时，允许负责人先向上游作者提一次澄清问题
  clarify_answer: v1     # 协同：上游作者答复澄清问题
  clarify_reply: v1      # 协同：把答复交给提问者，请其完成子任务
  work: v1
  decompose_retry: v1    # 流水线拆分不合格时，把问题列给统筹重拆
  work_analyze: v1       # 协同流水线：各类型子任务的工作提示词
  work_research: v1
  work_write: v1
  work_prompt: v1
  work_generate: v1
  work_code: v1
  work_verify: v1
  work_review: v1
  work_factcheck: v1
  work_assemble: v1
  cross_review: v1
  rework: v2
  merge: v5              # v5：已被下游接手的上游成果只给开头摘录
  attachments: v1        # 题目附件（文字版 / 随附图片）
  describe_image: v1     # 图片文字版
  transcribe: v1         # 音频转写
  tools: v5              # 工具说明与工具结果（v2：联网搜索；v3：图表中文；v4：转述的网页正文；v5：in/ 上游文件与参考图）
  image_gen: v1          # 图像生成工具
  media_brief: v2        # 媒体输出：把题目改写成「写生成提示词」的任务
  media_review: v2       # 评审生成结果（图片 / 视频截帧）；v2：对照风格清单逐条判定
  style_extract: v1      # 风格规范提取：成员各自看参考图
  office_intake: v4      # 办公室：经理分诊派活（v2：开会点名；v3：项目组点名；v4：名单附绩效）
  office_speak: v1       # 办公室·开会：员工依次发言
  office_decide: v1      # 办公室·开会：经理拍板，写结论和会议纪要
  office_review: v1      # 办公室·项目：复核经理最终验收
  office_revise: v1      # 办公室·项目：主办经理按验收意见改一次
  office_handle: v2      # 办公室：员工办理（v2：带字画面用代码画、数字须核实）
  watch: v2              # 投屏陪伴：成员陪用户看屏幕，吐槽、接话（v2：会接朋友的话、带说话风格和标题）
  wander: v1             # 成员自己上网：每看一页说一句感想、决定下一步（只看不互动）
  dsh_workbench: v1      # dsh 工作台助手的身份说明：中立、不带人格（接在 dsh 系统提示前面）
  super_split: v1        # 超级电脑：把一件活拆成能并行的小活
  super_work: v1         # 超级电脑：一位助手在共享工作文件夹里干一件小活
  super_merge: v1        # 超级电脑：合并各件小活的成果并写交付说明
  bench_plan: v4         # 工作台生成器：一句话拆成窗口、数据、操作（v4：验收清单与底线、主视觉、联网数据、按用户条件现场生成；v3：几个窗口共用的用户数据 state、手机首屏；v2：共用信息 shared、窗口消息约定 events、必须用零件库、手机长度、不画简笔画）
  bench_window: v4       # 工作台生成器：按规格用零件库写一个窗口（v4：验收清单与底线、主视觉、联网数据、按用户条件现场生成；v3：ctx.state 共用数据、不轮询、手机首屏、一个主按钮；v2：共用信息 shared、窗口消息约定 events、必须用零件库、手机长度、不画简笔画）
  bench_review: v4       # 工作台生成器：看截图按商业标准打分（不评自己写的窗口）（v4：验收清单与底线、主视觉、联网数据、按用户条件现场生成；v3：先核对上一轮问题、同样问题每轮扣一样多；v2：查共用信息和联动是否一致，质检压分只限出问题的窗口）
  bench_rework: v4       # 工作台生成器：按评审和质检返工（v4：验收清单与底线、主视觉、联网数据、按用户条件现场生成；v3：ctx.state、不轮询、手机首屏；v2：共用信息 shared、窗口消息约定 events、必须用零件库、手机长度、不画简笔画）
  bench_ask: v1          # 工作台生成器：成品里的对话窗，按台的用途和数据回答
  bench_ask_json: v1     # 工作台生成器：成品按用户自己的输入现场生成结构化内容（真实地点、参考价标日期来源、守用户条件）
  sticker_draw: v1       # 成员专属表情包：画一张 Q 版贴纸的提示词
  sticker_check: v2      # 成员专属表情包：先逐字抄出图上的字再核对配文和形象
  describe_screen: v2    # 投屏陪伴：把一张截图写成给成员看的文字（隐私信息打码；v2 带上一段，写出变化）
  chat: v8               # 群聊：口语、短句（v2：人设与记忆；v3：人物卡随身卡，AI 身份平时不刻意提、被认真问如实承认；v4：表情包、颜文字、引用、分条、不接话；v5：知道现在几点和自己在干什么；v6：照人物卡说话风格，各人不同；v7：大脑分区的想法卡；v8：感情用做法流露、可偏爱和喜欢、挽留只一次）
  chat_dm: v8            # 私聊：和用户一对一（v2：人设与记忆；v3：人物卡随身卡；v4：表情包、颜文字、引用、分条；v5：知道现在几点；v6：照人物卡说话风格；v7：大脑分区的想法卡；v8：感情用做法流露、可偏爱和喜欢、挽留只一次）
  voice_rewrite: v1      # 说出口前自查·改写：重复自己、跟风、光附和、口头禅太勤、编造回忆时改一次（只用于生活群和私聊）
  chat_work: v4          # 工作群：聊工作，交办走办公室（v2：人设与记忆；v3：人物卡随身卡；v4：危机关心 <care>）
  memory_day: v1         # 记忆：把一天的聊天压成一段
  memory_roll: v1        # 记忆：日 → 周、周 → 月
  memory_profile: v1     # 记忆：更新长期档案
  memory_items: v1       # 记忆（半衰期，night: false 时用）：一天的聊天拆成几件事，重要的标 ★
  memory_night: v2       # 记忆（P2）：每晚一次调用整理一天，写第一人称日记 + 记忆件 + 挂着的事（v2：顺带交关于用户的线索，P8）
  memory_diary: v1       # 记忆（P2）：翻日记工具的说明（生活模式的私聊、生活群）
  memory_diary_result: v1  # 记忆（P2）：把翻到的日记交回给成员
  member_eval: v1       # 成员评测集：情境题（规则判分，离线用假模型）
  growth_reflect: v1    # P6 成长：每周读上一周的经历，最多提 3 条档案改动（必须引用真实经历；只用于生活）
  growth_review: v1     # P6 成长：另一位成员给改动打分（不自评）
  life_chat: v5          # 生活：成员之间聊天（公寓楼里的模拟生活；v3：照人物卡说话风格，不跟风、不反复提同一件事；v4：大脑分区的想法卡、谁接话由显著性和驱力定；v5：感情用做法流露、同事之间的感情可以是真的）
  life_share: v3         # 生活：成员把上网看到的一条内容分享到生活群（v3：照人物卡说话风格，不套「刚刷到…未核实」句式）
  moment_post: v3        # 朋友圈：成员发一条动态（v3：转发卡片、表情包）
  moment_comment: v3     # 朋友圈：成员评论一条动态（或回复评论）（v3：表情包）
  evolution_card: v1     # 革新例会·自己找资料：一位成员把网页写成资料卡
  evolution_check: v1    # 革新例会·自己找资料：另一位成员复核资料卡
  evolution_plugins: v1  # 革新例会·插件清单：一位成员根据资料卡和点子榜写给用户看的插件清单
  office_check: v1       # 办公室：经理过目
  office_fix: v2         # 办公室：退回后员工改一次（v2：改程序必须重跑出图）
  style_merge: v1        # 统筹合并成规范 + 清单
  style_guide: v1        # 风格规范，接在之后的每次调用上
  user_notes: v1         # 用户中途补充的意见，接在之后的每次调用上
  media_refine: v1       # 统筹根据评审决定是否改提示词重新生成
  media_rewrite: v2      # 汇总失败时，由一位成员根据修订稿重写生成提示词
  work_media: v2         # 协同：媒体子任务，成员写生成提示词
  rework_media: v2       # 协同：按审查意见修改生成提示词
  evolve_review: v1      # 革新 PR 的对抗式复审（开发侧脚本 scripts/evolve_review.py，可选）
  web_search: v1         # 借助聚合平台联网搜索时发给搜索用模型的指令
  web_fetch: v1          # 借助聚合平台读取网页时发给读取用模型的指令
  perceive_fast: v1      # 感官·快速：把用户发的图片 / 视频画面 / 语音转写整理成简短的感知卡
  perceive_fine: v1      # 感官·精细：同上，写得更细，图里的字逐字抄下
  plain_talk: v2         # 说话底线（去八股化）：接在 plain_talk.roles 的每次调用上，所有成员相同（v2：马克杯警戒线、AI 腔）
  plain_rewrite: v2      # 说话底线·改写：发言查出问题时成员自己用节电档改一次（v2：一行一条气泡）

# 每个步骤对所有模型统一使用的参数（中立：同一步骤参数相同；模型自身必需的参数在 models.yaml）
step_params:
  # max_tokens 是每次调用的输出上限（推理模型的思考 token 也计入），防止输出失控；
  # 预估卡片上的"最多"按所有调用都写满这个上限计算。
  # reasoning 是中立的思考预算参数（同一步骤所有模型相同；渠道不支持时自动忽略）：
  #   {effort: low|medium|high} 或 {max_tokens: N}（思考最多用 N token，其余留给正文），二选一。
  #   原则：作答 / 修订 / 完成子任务要认真想，但封顶，保证正文有足够空间；
  #   评审、汇总、拆分、分配、自荐、风格校验等用低强度。
  answer: {max_tokens: 5000, reasoning: {max_tokens: 2000}}
  watch: {max_tokens: 1200, reasoning: {effort: low}}  # 投屏陪伴：一两句
  wander: {max_tokens: 1200, reasoning: {effort: low}}  # 自己上网：每页一小段 JSON
  chat: {max_tokens: 1500, reasoning: {effort: low}}   # 群聊：一两句话，少想多说（思考会挤占输出，之前 500 上限时有人回复为空）
  review: {max_tokens: 3000, reasoning: {max_tokens: 800}}
  revise: {max_tokens: 5000, reasoning: {max_tokens: 2000}}
  synthesize: {max_tokens: 5000, reasoning: {effort: medium}}   # 最终答案由统筹写：认真想（2026-10-22 起 medium）
  ideate: {max_tokens: 2000, reasoning: {effort: low}}
  expand: {max_tokens: 1500, reasoning: {effort: low}}
  crossbreed: {max_tokens: 1500, reasoning: {effort: low}}
  vote: {max_tokens: 1200, reasoning: {effort: low}}
  organize: {max_tokens: 7000, reasoning: {effort: low}}
  decompose: {max_tokens: 2500, reasoning: {effort: low}}
  volunteer: {max_tokens: 1500, reasoning: {effort: low}}
  assign: {max_tokens: 1500, reasoning: {effort: low}}
  discuss: {max_tokens: 1200, reasoning: {effort: low}}
  adjust: {max_tokens: 1500, reasoning: {effort: low}}
  clarify: {max_tokens: 1200, reasoning: {effort: low}}
  work: {max_tokens: 6000, reasoning: {max_tokens: 2000}}
  cross_review: {max_tokens: 3000, reasoning: {max_tokens: 800}}
  rework: {max_tokens: 6000, reasoning: {max_tokens: 2000}}
  accept: {max_tokens: 2000, reasoning: {effort: low}}
  accept_fix: {max_tokens: 6000, reasoning: {max_tokens: 2000}}
  merge: {max_tokens: 10000, reasoning: {effort: medium}}   # 同上：合并即最终成果
  style: {max_tokens: 1500, reasoning: {effort: low}}
  style_gate: {max_tokens: 1500, reasoning: {effort: low}}
  # 办公室模式：经理的判断和把关要认真想（中等强度），员工办理同作答
  intake: {max_tokens: 1500, reasoning: {effort: medium}}
  handle: {max_tokens: 6000, reasoning: {max_tokens: 2000}}
  check: {max_tokens: 2000, reasoning: {effort: medium}}
  fix: {max_tokens: 6000, reasoning: {max_tokens: 2000}}
  # 开会：发言短而有用；经理拍板要认真想
  speak: {max_tokens: 2500, reasoning: {max_tokens: 1000}}
  decide: {max_tokens: 5000, reasoning: {effort: medium}}
  # 项目分工：复核经理验收、主办经理按意见改一次
  office_review: {max_tokens: 2000, reasoning: {effort: medium}}
  office_revise: {max_tokens: 10000, reasoning: {effort: medium}}

# 长度保护：输出被长度上限截断（finish_reason=length）而可见文字很少 = 思考 token 挤占了正文。
# 此时不原样重试：降低思考强度、提高输出上限（×factor，不超过 cap）再调用一次（单独记录、单独计费）。
length_guard:
  enabled: true
  min_visible_chars: 200
  max_tokens_factor: 1.5
  max_tokens_cap: 12000
  retry_effort: low

# 互评质量检查：空泛的评审判为无效，不转给作者
review_quality:
  min_checked_chars: 15     # 没有指出问题时，"检查了什么"至少要写这么多字
  vague_phrases: [挺好, 很好, 不错, 同意, 没问题, 没有问题, 正确, 都对, 很棒, looks good, lgtm, good, fine, ok, agree, correct, no issues]

# 防偷懒：检查每位成员产出是否有实质内容（作答、互评、修订）。
# 不合格时附上原因打回重做一次（提示词 redo）；仍不合格就保留内容并标记"敷衍"，汇总时统筹会看到标记。
effort_check:
  enabled: true
  redo: true
  min_chars: 15                    # 字数下限 = max(min_chars, 预估答案 token 数 × chars_per_expected_token)
  chars_per_expected_token: 0.1
  empty_phrases: [略, 同上, 见上, 同上所述, 无, 暂无, 待补充, 不知道, todo, tbd, n/a, "...", 同意, 赞同]
  refusal_phrases: [无法回答, 不能回答, 无法完成, 无法提供, 我不能, 抱歉, 对不起, i cannot, i can't, i am unable, as an ai]
  refusal_max_chars: 200           # 含拒答短语且不超过这么多字才算拒答
  restate_similarity: 0.8          # 与题目相似度 ≥ 此值：只复述题目
  duplicate_similarity: 0.95       # 修订稿与别人的答案相似度 ≥ 此值：疑似照抄
  duplicate_min_chars: 100

# 步骤顺序（插件名）
# 讨论模式：同一题全员各自作答 → 互评 → 修订 → 汇总
pipeline: [answer, review, revise, synthesize, reveal]
# 协同模式：统筹拆分子任务 → 成员自荐 → 统筹分配（每人至少一块）→ 并行完成 → 交叉审查（不审自己的）
#          → 作者按审查修改 → 统筹合并成完整成果
# 个人作答：只请一位成员直接回答，没有统筹、互评和汇总
solo_pipeline: [answer, reveal]
# 头脑风暴（灵感爆发）：每人按抽到的发散手法独立出点子 → 碰撞杂交（随机拿到几个别人的点子）
#   → 匿名投票（不投自己，代码算分排名）→ 统筹整合（导图 + 点子榜 + 对比表 + 场景故事 + 行动方案 + 黑马）
# 旧流程 [ideate, expand, organize, reveal] 仍可用（ideate/organize 用 v1 提示词时）
brainstorm_pipeline: [ideate, crossbreed, vote, organize, reveal]
# 办公室模式：经理分诊派活 → 员工办理 → 经理过目（不合格退回改一次）。
# 经理决定开会时（O3），handle 改为开会：点名的员工依次发言 → 经理拍板写结论和纪要（不再过目，check 跳过）。
# 经理决定项目分工时（O4），本桌到此为止，另开一张「项目组」桌子走 office.project.pipeline
office_pipeline: [intake, handle, check, reveal]
brainstorm:
  max_ideas: 5              # 每人最多几个点子（含 1 个自由点子）
  max_expansions: 3         # 拓展 / 碰撞杂交：每人最多几条
  crossbreed_sample: 4      # 碰撞杂交：每人随机拿到几个别人的点子（永远不含自己的）
  vote_picks: 5             # 投票：每人最多选几个（不能投自己）
  top: 5                    # 点子榜前几名进对比表
  stories: 3                # 前几名写场景故事
  max_branches: 6
  max_ideas_per_branch: 6
  max_next_steps: 5
  # 发散手法：按随机种子给每位组员抽一种（人数多于手法时循环），与成员是谁无关；
  # 同一步骤提示词模板与参数对所有人相同，只有这一句不同（中立性规则 1 的例外，2026-10-23 用户确认）
  lenses:
    - {name: 反着来, hint: 把常规做法倒过来，或者先想怎样会彻底失败，再反推出点子}
    - {name: 推到极端, hint: 把某个条件放大十倍或缩小到零（预算、时间、规模、人数），看会冒出什么做法}
    - {name: 跨界类比, hint: 借用一个完全不同的行业或领域里的成熟做法，搬过来改造}
    - {name: 换个人看, hint: 站在一类平时被忽略的人（新手、老人、孩子、对手、旁观者）的立场想}
    - {name: 零预算, hint: 假设一分钱都没有，只能靠现有的人、物、关系和时间}
    - {name: 十年以后, hint: 设想技术和习惯已经大变的未来，倒推现在可以先做什么}
    - {name: 拆开重组, hint: 把问题拆成几个部分，替换、合并、删掉或重新排列其中一部分}
    - {name: 外行发问, hint: 像完全不懂行的人一样问“为什么一定要这样”，挑战默认前提}
collab_pipeline: [decompose, volunteer, assign, discuss, work, cross_review, rework, accept, merge, reveal]
collab:
  max_subtasks: 12        # 拆分的子任务上限
  # 分工讨论：分工确定后组员对方案提简短建议，统筹最多调整一次（调整后仍须满足分配规则，否则保持原分工）
  discussion: {enabled: true, min_members: 3, max_suggestions: 3}
  # 逐条验收：合并前统筹按验收标准检查每个文字子任务，不合格的退回作者改一次（媒体成果不验收）
  acceptance: {enabled: true, max_fix_items: 3}
  # 省钱：很短的成果（少于 short_chars 字）只找 short_reviews 位审查者；0 = 不启用。只看成果长度，与作者是谁无关
  cross_review: {short_chars: 400, short_reviews: 1}
  # 澄清提问：有上游产出的文字子任务，负责人动手前可以向上游作者提一次问题（只在需要时问；
  # 不问就不多花钱）。答复记为 clarify 步骤的调用；enabled: false 关闭
  clarify: {enabled: true, max_question_chars: 300}
  # 省钱：合并时，已经交给下游、下游成果合格（未被标记敷衍）的上游成果只给统筹看开头 excerpt_chars 字，
  # 不再重复传全文；终点子任务、被标记敷衍或风格未通过的成果仍给全文。只看依赖关系，与作者无关
  merge_trim: {enabled: true, excerpt_chars: 600}

  # --- 流水线（成员数 ≥ pipeline.min_members 时启用）---------------------------------
  # 协同不是"各做各的"：统筹把题目拆成一条流水线（每个子任务有类型，上游产出交给下游继续做），
  # 每位成员至少分到一块不同的实质工作；成员比步骤多时，可以并行的步骤按内容拆成平行子任务
  # （例如四个角色的文案每人写一个），不允许几个人做同一份内容。
  # 拆分不合格（整题当一个子任务、没有上下游、类型单一、人数不够分、类型规则不符）→ 统筹重拆一次
  # → 仍不合格按下面的模板自动生成。
  pipeline:
    enabled: true
    min_members: 2
    min_kinds: 3
    whole_task_phrases: [完成整道题, 完成整个题目, 完成全部要求, 全部要求, 独立完成题目, 整道题]
    whole_task_similarity: 0.75
    sibling_similarity: 0.95

  # step_params：这类子任务覆盖 work 步骤的参数（只限制最长输出；同一类型所有成员相同）。
  # 子任务类型。prompt：负责人完成这类子任务用的提示词；tags：偏好的能力标签；
  # parallel：能否按内容拆成平行子任务；needs：必须依赖其中某类；audit：审查类（必须依赖被审成果）；
  # avoid_hard / avoid_soft：负责人不能是这些类型上游子任务的负责人（soft：成员太少时放宽）。
  kinds:
    analyze:   {label: 分析, meaning: 读题目 / 材料 / 参考图，提炼要点、规范或需求清单,     prompt: work_analyze,   tags: [vision, research], step_params: {max_tokens: 4500}}
    research:  {label: 搜索调研, meaning: 联网搜索，收集带来源的资料, prompt: work_research,  tags: [research]}
    write:     {label: 撰写, meaning: 撰写设定、文案、正文、报告,     prompt: work_write,     tags: [writing]}
    prompt:    {label: 写提示词, meaning: 把设定与规范写成交给生成模型的提示词, prompt: work_prompt,    tags: [writing, design], parallel: false, step_params: {max_tokens: 3000}}
    generate:  {label: 执行生成, meaning: 用上游提示词调用生成模型（有参考图时一并传入）, prompt: work_generate,  parallel: false, needs: [prompt], requires_media: true, step_params: {max_tokens: 3000}}
    code:      {label: 写代码, meaning: 编写代码并保存成文件,   prompt: work_code,      tags: [code]}
    verify:    {label: 运行验证, meaning: 实际运行上游代码，记录结果, prompt: work_verify,    tags: [code], parallel: false, needs: [code], step_params: {max_tokens: 4000}}
    review:    {label: 审查, meaning: 对照要求（和参考图）检查上游成果，指出问题,     prompt: work_review,    tags: [vision], audit: true, avoid_hard: [prompt], avoid_soft: [generate, write, code], step_params: {max_tokens: 4000}}
    factcheck: {label: 事实核查, meaning: 核对上游成果中的事实、数字、引用, prompt: work_factcheck, tags: [research], audit: true, avoid_soft: [write], step_params: {max_tokens: 4000}}
    assemble:  {label: 整合, meaning: 把上游产出（含文件）整合、排版成最终成品,     prompt: work_assemble,  tags: [code, writing], parallel: false, min_upstream: 2}

  # 模板兜底（按顺序取第一个条件满足的；最后一个必须无条件）。
  # depends_on 里的 gives 是交给下游的内容；split 的步骤在成员比步骤多时按内容拆成平行子任务。
  templates:
    - name: creation_reference
      label: 带参考图的创作
      when:
        media: [image]
        image_attachment: true
        keywords: [画, 绘, 生成图, 作图, 配图, 插图, 海报, 卡片, 人物卡, 四格, 插画, 漫画, 设计, 二创, 创作, 头像, 表情包, draw, poster, illustration, sticker]
      steps:
        - id: T1
          kind: analyze
          title: 分析参考图，提炼风格规范
          requirements: 仔细看参考图，提炼可以直接照着做的风格规范：画风、配色（色值）、线条、构图、版式（格数、边框、比例）、字体与文字排布、禁忌。
          acceptance: 风格规范条目具体、可检查，别人不看原图也能照做
          split: true
          split_by: 按风格维度划分（画风与配色 / 线条与构图 / 版式与文字排布）
          split_hints: [画风与配色, 线条与构图, 版式与文字排布]
        - id: T2
          kind: write
          title: 撰写角色设定与文案
          requirements: 按题目要求撰写角色设定和每格的文案，措辞贴合风格规范。
          acceptance: 每个角色都有设定和文案，没有遗漏，文字量适合版面
          depends_on: [{id: T1, gives: 风格规范}]
          split: true
          split_by: 按角色划分，每人负责不同的角色，各写各的
        - id: T3
          kind: prompt
          title: 写出交给画图模型的提示词
          requirements: 把风格规范和角色设定写成画图提示词，逐条落实风格规范，不得改动风格规范。
          acceptance: 提示词完整、具体，包含风格、构图、文字内容和禁忌
          depends_on: [{id: T1, gives: 风格规范}, {id: T2, gives: 角色设定与文案}]
        - id: T4
          kind: generate
          title: 带参考图调用画图模型生成
          requirements: 用上游提示词生成图片（有参考图时一并传给画图模型）。
          acceptance: 生成了图片
          depends_on: [{id: T3, gives: 画图提示词}]
          media: image
        - id: T5
          kind: review
          title: 对照参考图审查生成结果
          requirements: 对照参考图和风格规范逐条检查生成结果，指出不符合的地方。
          acceptance: 逐条给出符合 / 不符合和理由
          depends_on: [{id: T4, gives: 生成的图片}, {id: T1, gives: 风格规范}]
          split: true
          split_by: 按检查维度划分（风格与配色 / 构图与版式 / 文字与内容）
          split_hints: [风格与配色, 构图与版式, 文字与内容]
        - id: T6
          kind: assemble
