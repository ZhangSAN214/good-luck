# 圆桌运行参数

# 一张桌最多的组员座位数（所选档位的可用模型都上桌，人数超过此值时拒绝执行；代号池不得少于此值）
seats: 12
# 组员少于此数时暂停问用户；开桌至少需要 min_members 个组员 + 1 个统筹
min_members: 2
# 互评：每份答案由几位其他组员评审（分配均衡、不评自己）；组员不多于此数 + 1 时等于全员互评
reviews_per_answer: 3

# 预算按 UTC 自然月 / 自然日统计（每月 1 号、每天 0 点 UTC 进入新周期）。
# 达到 warn_ratio 时提醒（不打断）；已超出或下一步预计会超出时暂停，请用户确认继续或停止。
budget:
  monthly_usd: 20.0    # 每月预算
  daily_usd: 3.0       # 每日上限；填 null 表示不设
  warn_ratio: 0.8

# 办公室模式（O1 起，见 docs/OFFICE.md）：AI 是员工，token 是工资。经理在 models.yaml 用 office_role: manager 指定。
# task_caps_usd：每件事的工资上限，按办事方式（单人办 / 开会 / 项目分工）分别设；预计超出时先问你。
office:
  task_caps_usd: {single: 0.05, meeting: 0.15, project: 0.80}
  manager_strategy: rotate   # 两位以上经理：每件事轮流主办，项目级任务由另一位复核
  # 开会（O3）：经理点名几位员工依次发言（后发言的看得到前面的），经理拍板写结论和纪要
  meeting: {min_attendees: 2, max_attendees: 3}
  # 项目分工（O4）：经理点名 2～4 人的项目组，另开一张桌子走协同流水线（只派需要的人），
  # 交叉审查每份成果只找 1 位（只审关键），主办经理以中等思考强度合并，另一位经理最后验收（退回改一次）
  project:
    min_members: 2
    max_members: 4
    reviews_per_item: 1
    pipeline: [decompose, volunteer, assign, work, cross_review, rework, accept, merge, office_review, reveal]
    step_params:
      merge: {reasoning: {effort: medium}}
  # 绩效（O5）：员工名单附上绩效给经理参考；规则派活时工资相同的员工优先通过率高的。
  # min_jobs：某类活至少办过几件才显示 / 参考（太少不说明问题）
  performance: {enabled: true, min_jobs: 3}

# 群聊：成员只回应你，不主动发消息；没有 @ 人时随机一两位回应
chat:
  life_title: 大家庭               # 生活群
  work_title: 工作群
  budget:
    monthly_usd: 5.0               # 聊天这一块每月最多花多少（私聊 + 群聊；也计入上面的总预算）
  memory:                          # 成员的分层记忆：只存本地，只用于聊天
    enabled: true
    context_chars: 800             # 聊天时最多带多少字的记忆
    group_lines: 6                 # 私聊（和你、成员之间）时接上大家庭群里最近半天的几句，群里刚聊过的事私聊里不会说没人提
    group_hours: 12
    group_chars: 60
    catch_up_days: 7               # 最多补整理几天前的聊天
    recall: half_life              # 召回方式：half_life 半衰期记忆（默认，按相关 × 鲜活 × 重要挑）；layers 按时间固定带几层（旧）
    half_life_days: 30             # 半衰期记忆：发生过的事过 30 天鲜活度减半（不删，只排后）
    inject_max: 6                  # 半衰期记忆：每次聊天最多带几件
    daily_quota: 8                 # 半衰期记忆：每人每天最多记几件事
    freshness_floor: 0.5           # 鲜活度保底：再久的事也不低于一半（只排后，不删）
    night: true                    # 每晚整理合并成一次调用：第一人称日记 + 记忆件 + 挂着的事（心情只改回忆语气和重要度，留旧版）
    domains: [学术, 日常, 工作, 娱乐, 社交, 身心]   # 领域标签
    hanging_max: 5                 # 脑子里挂着的事最多几件
    links: {enabled: true, assoc_max: 1}         # 联想网：一起出现就连得更紧，想起一件顺带想到一件；夜里随便走几步
    diary: {enabled: true, daily_reads: 3}       # 翻日记：只在生活模式，每位成员每天最多翻 3 次
  life:                            # 生活引擎：你不在时成员按作息过日子、彼此聊天（不主动找你）
    enabled: true
    daily_usd: 0.15                # 生活（含记忆整理、自己上网）每天最多花多少；约 $4.5 / 月
    memory_reserve_usd: 0.05       # 其中给夜里整理记忆留的钱：白天花到 $0.10 就停，记得住比多聊几句要紧（10-31 第 3 次试跑：留 $0.02 只够 3 位）
    tick_minutes: 30               # 电脑开着时多久推进一次
    max_written_per_tick: 2        # 每次推进最多几件事写成聊天，其余只记一行
    max_written_catch_up: 6        # 开机补算时最多写几件
    catch_up_hours: 24             # 补算最多往回看多少小时（更早的只整理成记忆）
    turns: 3                       # 一段成员之间的对话最多几句
    guard:                         # 收得住：全部由代码判断，不花钱
      daily_messages: 40           # 成员之间每天最多说几句（含分享）
      max_chars: 200               # 互聊每句最多多少字
      stale_similarity: 0.5        # 和这段前面的话或最近的互聊太像就收尾（0～1）
      max_failures: 3              # 连续出错几次，当天停掉生活
      budget_alarm: 0.9            # 生活日上限或聊天月预算用到 90%，当天停掉
      report_weekday: 1            # 每周一生成上一周的自检报告（花费、谁说得多、重复、异常）
    story:                         # 生活事件库 + 长线剧情（L0）+ 擅长觉醒（L10）：程序挑事不花钱；只发事件，心情 / 记忆 / 档案由 P3 / P2 / P6 接
      enabled: true
      max_per_day: 2               # 每人每天最多几件事（大部分日子是平淡的）
      group_cooldown_days: {sick: 90, mishap: 30}   # 每季度最多病一次、每月最多一件小意外
      phase_groups: {sick: [小感冒]}   # 生活阶段（chat.engine.phase）里正在小感冒时，不会再排 sick 组的事（感冒归阶段，这里只管过敏、拉伤、牙疼）
      way:                         # 空闲时去哪：按各自档案里的爱好挑（不再按编号轮换）；键为「房间:活动」
        options:
          "gym:exercise": [健身, 跑步, 运动, 篮球, 足球, 瑜伽, 游泳, 锻炼]
          "rooftop:stargaze": [星星, 星空, 天文, 夜空, 宇宙, 发呆, 晒太阳, 月亮]
          "lounge:game": [游戏, 通关, 抽卡, 桌游, 打牌, 手柄]
          "lounge:chat": [聊天, 热闹, 八卦, 朋友, 玩笑, 段子]
          "dorm:read": [书, 小说, 阅读, 诗, 漫画, 安静, 独处]
          "canteen:chat": [美食, 做饭, 零食, 甜点, 奶茶, 好吃]
      stories:                     # 生活事件库：加一种生活只加一条配置；text 不带主语，{name} 她 / {other} 同伴
        - {id: late_night, chance: 0.05, hours: [22, 24], steps: [{text: 追东西追到很晚才睡, tags: [story.late]}, {day: 1, text: 昨晚睡太晚，一整天都犯困, tags: [story.tired]}]}
        - {id: lazy_morning, chance: 0.08, weekdays: [5, 6], hours: [9, 12], steps: [{text: 睡到自然醒，懒洋洋地过了一上午}]}
        - id: allergy              # 轻度生病（10-31 你定：只限过敏、拉伤这类，几天就好；感冒在生活阶段里）
          group: sick
          chance: 0.01
          months: [4, 5, 6]
          steps:
            - {text: 花粉过敏，喷嚏打个不停, tags: [story.sick]}
            - {day: [1, 2], text: 过敏总算消停了, tags: [story.better]}
        - id: sprain
          group: sick
          chance: 0.012
          likes: [健身, 跑步, 运动, 篮球, 足球, 瑜伽]
          need_likes: true
          steps:
            - {text: 锻炼时把脚踝扭了一下, tags: [story.sick], place: gym}
            - {day: 1, text: 脚踝还肿着，在房间歇着, tags: [story.sick], rest: true}
            - {day: [3, 5], text: 脚踝不疼了, tags: [story.better]}
        - id: toothache
          group: sick
          chance: 0.004
          steps:
            - {text: 牙疼，吃东西只敢用一边嚼, tags: [story.sick]}
            - {day: [1, 2], text: 牙不疼了, tags: [story.better]}
        - {id: lost_keys, group: mishap, chance: 0.01, steps: [{text: 钥匙找了半天，最后在外套口袋里摸到, tags: [story.bad]}]}
        - {id: new_recipe, domain: 做饭, chance: 0.03, likes: [做饭, 菜, 烘焙, 美食, 下厨], steps: [{text: 在公共厨房试着做了道新菜, tags: [story.good], place: canteen}]}
        - {id: burnt_pot, domain: 做饭, chance: 0.01, likes: [做饭, 下厨, 烘焙], need_likes: true, steps: [{text: 做饭糊锅了，开窗散了半天味, tags: [story.bad], place: canteen}]}
        - {id: fix_lamp, domain: 手工修理, chance: 0.025, likes: [修, 工具, 拆, 组装, 手工], steps: [{text: 把房间里接触不良的台灯修好了, tags: [story.good]}]}
        - {id: clear_sky, domain: 天文科学, chance: 0.035, hours: [20, 23], likes: [星, 天文, 夜空, 宇宙], steps: [{text: 难得晴天，在天台多看了会儿星星, tags: [story.good], place: rooftop}]}
        - {id: finish_book, domain: 长文阅读, chance: 0.03, likes: [书, 小说, 阅读], steps: [{text: 把一本看了好久的书看完了, tags: [story.good]}]}
        - {id: write_bit, domain: 写作, chance: 0.03, likes: [写, 故事, 日记, 诗, 文字], steps: [{text: 随手写了一小段东西，自己还挺满意, tags: [story.good]}]}
        - {id: sketch, domain: 画画审美, chance: 0.03, likes: [画, 配色, 设计, 审美, 拍照], steps: [{text: 窝在房间画了张小画}]}
        - {id: song_loop, domain: 音乐, chance: 0.03, likes: [歌, 音乐, 唱, 吉他, 钢琴], steps: [{text: 单曲循环了一下午同一首歌}]}
        - {id: small_ledger, domain: 记账理财, chance: 0.02, likes: [记账, 理财, 省钱, 算账, 预算], steps: [{text: 把这个月的小账理了一遍}]}
        - {id: sort_photos, domain: 整理归纳, chance: 0.03, likes: [整理, 收纳, 目录, 归档, 清单], steps: [{text: 把手机里攒了很久的照片按日子归了档, tags: [story.good]}]}
        - {id: rabbit_hole, domain: 资料检索, chance: 0.025, likes: [查, 资料, 考据, 出处, 搜], steps: [{text: 为了弄清一个小问题查了一晚上资料}]}
        - {id: puzzle_done, domain: 推理, chance: 0.025, likes: [推理, 谜, 逻辑, 侦探, 数独], steps: [{text: 解开了一道卡了好几天的谜题, tags: [story.good]}]}
        - {id: words_day, domain: 语言翻译, chance: 0.025, likes: [外语, 英语, 日语, 翻译, 单词], steps: [{text: 背了会儿单词，顺手翻了段歌词}]}
        - {id: tiny_script, domain: 编程, chance: 0.02, likes: [代码, 编程, 程序, 算法], steps: [{text: 给自己写了个小脚本，省了不少事, tags: [story.good]}]}
        - {id: old_story, domain: 历史文学, chance: 0.02, likes: [历史, 古代, 文学, 典故, 诗词], steps: [{text: 读了段以前没留意过的历史，越看越上头}]}
        - {id: level_clear, domain: 游戏, chance: 0.03, likes: [游戏, 通关, 抽卡], steps: [{text: 终于把卡了很久的那一关打过去了, tags: [story.good], place: lounge}]}
        - {id: extra_run, domain: 运动, chance: 0.03, likes: [健身, 跑步, 运动, 瑜伽], steps: [{text: 比平时多跑了两公里, place: gym}]}
        - {id: kept_company, domain: 倾听照顾人, chance: 0.02, with_other: true, likes: [照顾, 倾听, 关心, 陪伴, 温柔], steps: [{text: "{other}心情不太好，{name}陪着聊了很久", place: lounge}]}
        - {id: made_laugh, domain: 活跃气氛, chance: 0.02, with_other: true, likes: [热闹, 玩笑, 搞笑, 段子], steps: [{text: "{name}在休息室讲了个段子，把{other}笑得不行", tags: [story.good], place: lounge}]}
        # 住户变化（10-31 你定：成员离开 / 新成员入住当生活事件，温和，不煽情）
        - {id: arrive, trigger: arrive, steps: [{text: 刚搬进公寓，还在收拾行李, tags: [story.new]}]}
        - {id: welcome, trigger: welcome, steps: [{text: "{new}搬进来了，大家去打了个招呼", tags: [story.welcome], place: lounge}]}
        - {id: farewell, trigger: farewell, steps: [{text: "{gone}搬走了，走之前和大家道了别", tags: [story.farewell], place: lounge}]}
      talent:                      # 觉醒擅长领域（L10）：证据只用人物卡种子 + 生活练习；和工作完全无关，不影响派活
        enabled: true
        domains:                   # 领域 → 档案里的种子词 / 生活里算练习的去处 / 深耕后楼里的人怎么说她（可增删）
          推理: {words: [推理, 逻辑, 侦探, 谜题, 数独, 悬疑], known: "楼里有想不通的事都爱问{name}"}
          编程: {words: [代码, 编程, 程序, 算法, 脚本], known: "楼里谁的小程序出毛病都找{name}"}
          写作: {words: [写作, 故事, 日记, 诗, 文字, 写], known: "楼里要写点什么都找{name}"}
          语言翻译: {words: [外语, 英语, 日语, 翻译, 单词, 方言], known: "看不懂的外文大家都丢给{name}"}
          长文阅读: {words: [读书, 看书, 书, 阅读, 小说], acts: ["dorm:read"], known: "想找书看大家都问{name}"}
          资料检索: {words: [资料, 查证, 考据, 出处, 检索], known: "要查个出处大家都找{name}"}
          整理归纳: {words: [整理, 收纳, 归纳, 目录, 清单, 归档], known: "楼里东西找不着都问{name}"}
          画画审美: {words: [画画, 画, 配色, 设计, 审美, 拍照, 摄影], known: "要挑颜色挑样子都找{name}"}
          音乐: {words: [音乐, 歌, 唱歌, 吉他, 钢琴, 乐理], known: "想听点什么都问{name}"}
          天文科学: {words: [星星, 天文, 星空, 宇宙, 物理, 科学], acts: ["rooftop:stargaze"], known: "天上有什么动静大家都问{name}"}
          历史文学: {words: [历史, 古代, 文学, 典故, 诗词], known: "聊到以前的事大家都等{name}开讲"}
          做饭: {words: [做饭, 菜谱, 厨房, 烘焙, 下厨, 美食], known: "楼里想吃点好的就去找{name}"}
          手工修理: {words: [修理, 修好, 工具, 手工, 组装], known: "楼里东西坏了都找{name}"}
          记账理财: {words: [记账, 理财, 省钱, 预算, 算账], known: "算不清账的都去问{name}"}
          倾听照顾人: {words: [照顾, 倾听, 关心, 陪伴, 安慰, 温柔], known: "楼里谁心里不痛快都爱找{name}说说"}
          活跃气氛: {words: [热闹, 玩笑, 段子, 搞笑, 气氛], acts: ["lounge:chat"], known: "有{name}在场就冷不下来"}
          运动: {words: [运动, 健身, 跑步, 瑜伽, 球], acts: ["gym:exercise"], known: "想练练身体的都跟着{name}"}
          游戏: {words: [游戏, 通关, 抽卡, 桌游], acts: ["lounge:game"], known: "游戏卡关了都找{name}"}
  moments:                         # 朋友圈：成员每天最多发 1 条，互相点赞（免费）、评论
    enabled: true
    posts_per_member: 1
    comments_per_tick: 2           # 每次推进最多写几条评论
    post_misses: 2                 # 省钱：成员一天里动态两次没过自查（太像、套话）就不再写
    comment_misses: 2              # 省钱：一条动态底下两条评论没过自查就不再评；没过的那位也不再重写
    dedupe_hours: 48               # 去重：别人 48 小时内发过的同一件事不再发
    similarity_max: 0.3            # 去重：正文和近期动态相似度达到这个值就不发（0～1）
  browse:                          # 上网：只读公开订阅源（$0），成员按兴趣挑一条分享到生活群
    enabled: true
    refresh_hours: 3               # 多久重新抓一次订阅源
    shares_per_member: 1           # 每位成员每天最多分享几条
    search_per_day: 5              # 订阅源里没有感兴趣的内容时联网搜索，全体每天最多几次
    feeds:                         # 网页「上网」里可以增删；改过之后以网页里的为准
      - {name: BBC 中文, url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml", topics: [新闻, 国际], kind: news}
      - {name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml", topics: [新闻, 国际], kind: news}
      - {name: 36氪, url: "https://36kr.com/feed", topics: [科技, 商业], kind: news}
      - {name: 少数派, url: "https://sspai.com/feed", topics: [科技, 数码, 效率], kind: blog}
      - {name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index", topics: [科技, 科学], kind: news}
      - {name: Hacker News, url: "https://news.ycombinator.com/rss", topics: [科技, 编程], kind: forum}
      - {name: NASA, url: "https://www.nasa.gov/news-release/feed/", topics: [天文, 科学], kind: news}
      - {name: ScienceDaily, url: "https://www.sciencedaily.com/rss/top/science.xml", topics: [科学], kind: news}
      - {name: Polygon, url: "https://www.polygon.com/rss/index.xml", topics: [游戏], kind: news}
      - {name: NASA 视频, url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCLA_DiR1FfKNvjuUpBHmylQ", topics: [天文, 科学, 视频], kind: video}
  memes:                           # 网络梗（梗雷达，2026-10-31 你要的）：每天抓一次公开热榜（$0）+ 每天最多搜 2 次，最便宜的一位提炼成梗卡；约 $0.01～0.03/天，算生活每日上限；只用于生活和聊天
    enabled: true
    refresh_hours: 24
    sources:                       # 只读热榜标题；抓不到的跳过（网页「上网」里能看到抓没抓到）
      - {name: 微博热搜, url: "https://weibo.com/ajax/side/hotSearch", path: data.realtime, key: word}
      - {name: 百度热搜, url: "https://top.baidu.com/api/board?tab=realtime", path: data.cards.0.content, key: word}
