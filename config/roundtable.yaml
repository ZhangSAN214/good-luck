# 圆桌运行参数

# 一张桌最多的组员座位数（所选档位的可用模型都上桌，人数超过此值时拒绝执行；代号池不得少于此值）
seats: 12
# 组员少于此数时暂停问用户；开桌至少需要 min_members 个组员 + 1 个统筹
min_members: 2
# 互评：每份答案由几位其他组员评审（分配均衡、不评自己）；组员不多于此数 + 1 时等于全员互评
reviews_per_answer: 3

# 预算按 UTC 自然月 / 自然日统计（每月 1 号、每天 0 点 UTC 进入新周期）。
# 达到 warn_ratio 时提醒（不打断）；已超出或下一步预计会超出时暂停，请用户确认继续或停止。
budget:
  monthly_usd: 20.0    # 每月预算
  daily_usd: 3.0       # 每日上限；填 null 表示不设
  warn_ratio: 0.8

# 办公室模式（O1 起，见 docs/OFFICE.md）：AI 是员工，token 是工资。经理在 models.yaml 用 office_role: manager 指定。
# task_caps_usd：每件事的工资上限，按办事方式（单人办 / 开会 / 项目分工）分别设；预计超出时先问你。
office:
  task_caps_usd: {single: 0.05, meeting: 0.15, project: 0.80}
  manager_strategy: rotate   # 两位以上经理：每件事轮流主办，项目级任务由另一位复核
  # 开会（O3）：经理点名几位员工依次发言（后发言的看得到前面的），经理拍板写结论和纪要
  meeting: {min_attendees: 2, max_attendees: 3}
  # 项目分工（O4）：经理点名 2～4 人的项目组，另开一张桌子走协同流水线（只派需要的人），
  # 交叉审查每份成果只找 1 位（只审关键），主办经理以中等思考强度合并，另一位经理最后验收（退回改一次）
  project:
    min_members: 2
    max_members: 4
    reviews_per_item: 1
    pipeline: [decompose, volunteer, assign, work, cross_review, rework, accept, merge, office_review, reveal]
    step_params:
      merge: {reasoning: {effort: medium}}
  # 绩效（O5）：员工名单附上绩效给经理参考；规则派活时工资相同的员工优先通过率高的。
  # min_jobs：某类活至少办过几件才显示 / 参考（太少不说明问题）
  performance: {enabled: true, min_jobs: 3}

# 群聊：成员只回应你，不主动发消息；没有 @ 人时随机一两位回应
chat:
  life_title: 大家庭               # 生活群
  work_title: 工作群
  budget:
    monthly_usd: 5.0               # 聊天这一块每月最多花多少（私聊 + 群聊；也计入上面的总预算）
  memory:                          # 成员的分层记忆：只存本地，只用于聊天
    enabled: true
    context_chars: 800             # 聊天时最多带多少字的记忆
    catch_up_days: 7               # 最多补整理几天前的聊天
    recall: half_life              # 召回方式：half_life 半衰期记忆（默认，按相关 × 鲜活 × 重要挑）；layers 按时间固定带几层（旧）
    half_life_days: 30             # 半衰期记忆：发生过的事过 30 天鲜活度减半（不删，只排后）
    inject_max: 6                  # 半衰期记忆：每次聊天最多带几件
    daily_quota: 8                 # 半衰期记忆：每人每天最多记几件事
    freshness_floor: 0.5           # 鲜活度保底：再久的事也不低于一半（只排后，不删）
    night: true                    # 每晚整理合并成一次调用：第一人称日记 + 记忆件 + 挂着的事（心情只改回忆语气和重要度，留旧版）
    domains: [学术, 日常, 工作, 娱乐, 社交, 身心]   # 领域标签
    hanging_max: 5                 # 脑子里挂着的事最多几件
    links: {enabled: true, assoc_max: 1}         # 联想网：一起出现就连得更紧，想起一件顺带想到一件；夜里随便走几步
    diary: {enabled: true, daily_reads: 3}       # 翻日记：只在生活模式，每位成员每天最多翻 3 次
  life:                            # 生活引擎：你不在时成员按作息过日子、彼此聊天（不主动找你）
    enabled: true
    daily_usd: 0.15                # 生活（含记忆整理、自己上网）每天最多花多少；约 $4.5 / 月
    tick_minutes: 30               # 电脑开着时多久推进一次
    max_written_per_tick: 2        # 每次推进最多几件事写成聊天，其余只记一行
    max_written_catch_up: 6        # 开机补算时最多写几件
    catch_up_hours: 24             # 补算最多往回看多少小时（更早的只整理成记忆）
    turns: 3                       # 一段成员之间的对话最多几句
    guard:                         # 收得住：全部由代码判断，不花钱
      daily_messages: 40           # 成员之间每天最多说几句（含分享）
      max_chars: 200               # 互聊每句最多多少字
      stale_similarity: 0.5        # 和这段前面的话或最近的互聊太像就收尾（0～1）
      max_failures: 3              # 连续出错几次，当天停掉生活
      budget_alarm: 0.9            # 生活日上限或聊天月预算用到 90%，当天停掉
      report_weekday: 1            # 每周一生成上一周的自检报告（花费、谁说得多、重复、异常）
  moments:                         # 朋友圈：成员每天最多发 1 条，互相点赞（免费）、评论
    enabled: true
    posts_per_member: 1
    comments_per_tick: 2           # 每次推进最多写几条评论
    dedupe_hours: 48               # 去重：别人 48 小时内发过的同一件事不再发
    similarity_max: 0.3            # 去重：正文和近期动态相似度达到这个值就不发（0～1）
  browse:                          # 上网：只读公开订阅源（$0），成员按兴趣挑一条分享到生活群
    enabled: true
    refresh_hours: 3               # 多久重新抓一次订阅源
    shares_per_member: 1           # 每位成员每天最多分享几条
    search_per_day: 5              # 订阅源里没有感兴趣的内容时联网搜索，全体每天最多几次
    feeds:                         # 网页「上网」里可以增删；改过之后以网页里的为准
      - {name: BBC 中文, url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml", topics: [新闻, 国际], kind: news}
      - {name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml", topics: [新闻, 国际], kind: news}
      - {name: 36氪, url: "https://36kr.com/feed", topics: [科技, 商业], kind: news}
      - {name: 少数派, url: "https://sspai.com/feed", topics: [科技, 数码, 效率], kind: blog}
      - {name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index", topics: [科技, 科学], kind: news}
      - {name: Hacker News, url: "https://news.ycombinator.com/rss", topics: [科技, 编程], kind: forum}
      - {name: NASA, url: "https://www.nasa.gov/news-release/feed/", topics: [天文, 科学], kind: news}
      - {name: ScienceDaily, url: "https://www.sciencedaily.com/rss/top/science.xml", topics: [科学], kind: news}
      - {name: Polygon, url: "https://www.polygon.com/rss/index.xml", topics: [游戏], kind: news}
      - {name: NASA 视频, url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCLA_DiR1FfKNvjuUpBHmylQ", topics: [天文, 科学, 视频], kind: video}
  engine:                          # 成员引擎（docs/MEMBER_ENGINE.md）：只用于聊天、朋友圈、生活
    enabled: true
    context: {budget_chars: 600}   # 调模型时带的资料最多多少字（固定部分放最前，利于缓存）
    card: {budget_chars: 400}      # 随身卡（人物卡的精简版，每次都带）最多多少字，算在上面的 600 字里
    scheduler:                     # 预算调度：你直接找她 > 主动找你 > 群聊 > 生活
      daily_usd: 0.25              # 聊天这一块每天的额度；你直接找她不受它限制
      shares: {proactive: 0.85, group: 0.7, life: 0.5}   # 其余三类最多用到额度的几成，超了只记一行
    heartbeat: {enabled: true, max_actions: 3}
    bus: {keep_days: null, catch_up_days: 14}   # 事件一直保留（只存本机，攒经历数据）；开机最多补算 14 天
    brain:                         # 大脑分区（docs/BRAIN.md）：说话前先由程序综合出「意图卡」，模型只管怎么说；全程序、不花钱；只用于生活和私聊、群聊
      enabled: true
      free_choice: true            # 空闲时段按驱力和目标自己挑去哪、做什么（不再照固定作息表）
      silence_below: 0.25          # 群里没点名、这事对她不显著、也不想说话时就不接
      wander_chance: 0.25
      card_chars: 220
      imperfect: 0.08              # 偶尔记不清、敷衍一句（像人）；被认真问是不是 AI 仍如实承认
      drives:                      # 下丘脑：驱力随时间涨，被事满足就降；高了会主动找人、找事做
        social:    {label: 想找人说说话, rate: 0.02, trait: 外向, satisfy: {spoke: 0.2, gathered: 0.15}}
        novelty:   {label: 有点闷，想换点新鲜的, rate: 0.015, trait: 好奇, satisfy: {explored: 0.4, pursued: 0.1}}
        express:   {label: 有话想说, rate: 0.01, trait: 幽默, satisfy: {spoke: 0.3}}
        mastery:   {label: 想把手上在练的事往前推一推, rate: 0.02, trait: 较真, satisfy: {pursued: 0.45}}
      intents:                     # 前额叶：说话前按性格、心情、精力、驱力挑一个意图（加权随机，种子可复现）
        respond:   {label: 接住对方说的具体一点，说你自己的反应, base: 1.0}
        ask:       {label: 对对方说的事好奇，追问一句, base: 0.5, traits: {好奇: 0.3}}
        share:     {label: 讲讲你自己最近的事, base: 0.5, traits: {外向: 0.25}, drives: {express: 0.8}, needs: own}
        shift:     {label: 这个话题聊够了，换到你心里正想的事, base: 0.2, drives: {novelty: 0.8}, needs: own}
        joke:      {label: 开个玩笑或吐槽一句, base: 0.3, traits: {幽默: 0.35}, mood: 0.3}
        disagree:  {label: 你不太同意，直说并给理由, base: 0.15, traits: {较真: 0.3, 温和: -0.15}, needs: claim}
        vent:      {label: 说说你现在的心情，不用藏着, base: 0.05, mood: -0.8}
        brief:     {label: 累了，回得很短就好, base: 0.05, energy: -1.2}
        comfort:   {label: 对方好像不太好，先接住对方的情绪，别急着讲道理, base: 0.8, traits: {温和: 0.3}, needs: sad}
        blurt:     {label: 突然冒出个念头，忍不住说出来（可以有点没头没尾）, base: 0.7, traits: {外向: 0.15, 好奇: 0.15}, needs: whim}
      reward: {near: 0.75, plan_chance: 0.2, met_chance: 0.7, ahead_days: 2}   # 奖赏：盼着 → 兑现 / 落空 / 惊喜（心情变化走下面状态的反射表）
      empathy: {base: 0.35, gentle: 0.12, close: 0.4}   # 共情：别人难过 / 高兴时，自己心情跟着动的概率
      meta: {window: 8, threshold: 4, damp: 0.3}        # 元认知：最近 8 次里同一个套路 ≥4 次就察觉、压一压
      love:                        # 爱与复合情绪（docs/BRAIN.md「爱」）：对每位同事和你各有一组感情，相处中慢慢长；全程序
        enabled: true
        romance: true              # 同事之间可以心动（2026-10-30 你选的）
        romance_user: true         # 对你也可以心动、发展成恋人（2026-10-30 你定的；谁会、怎么爱看各人性格和相处）
        retain_blame: true         # 可以挽留、怪你没来（只留一次、你说睡觉上课工作陪家人朋友时不留、责怪一两句就消气）
        user_name: 用户
        chemistry_floor: 0.45      # 「化学反应」低于它就不会心动：有人一直只是朋友
        daily_cap: 0.06            # 每段关系每天在乎 + 心动最多涨多少（10-30 假模型试跑：0.12 时两周就「像家人一样」，太快）
        high: 0.6                  # 亲密 / 心动 / 承诺算「高」的线
        kinds: {"111": 很深的感情, "110": 喜欢又心动, "101": 像家人一样, "100": 处得来, "011": 心里认定了, "010": 有点心动, "001": 习惯了有对方在}
        attachment:                # 依恋方式（按性格分，取最像的一种）
          secure:   {base: 0.4, traits: {温和: 0.2, 外向: 0.2}, longing: 1.0, hurt: 1.0, jealous: 0.15}
          anxious:  {base: 0.0, traits: {温和: 0.35, 较真: 0.25, 外向: 0.1}, longing: 1.6, hurt: 1.5, jealous: 0.5, line: 还有点想确认对方是不是还好、是不是还在意你}
          avoidant: {base: 0.0, traits: {外向: -0.45, 温和: -0.3}, longing: 0.5, hurt: 0.7, jealous: 0.1, line: 你会想，但不会说出来}
        styles:                    # 爱的表达方式（按性格分，取最像的一种）
          words:    {traits: {外向: 1.0}, care: 想到就直接说出来，夸人、说想对方都不藏着, crush: 会忍不住多找对方说话, retain: 可以撒个娇留一句，比如「再聊五分钟嘛」, blame: 可以直接说想对方了，顺带抱怨一句「这几天都去哪了」}
          acts:     {traits: {外向: -1.0}, care: 不太说出口，用行动表示：记住对方喜欢什么、默默帮一把, crush: 不想表现得太明显，但会格外留意对方的消息, retain: 不开口留，只是回得慢一点、短一点, blame: 不说想，第一句回得有点淡，过几句就好了}
          tease:    {traits: {幽默: 1.0}, care: 用互损和玩笑表示亲近, crush: 嘴上偏要损两句，其实很在意, retain: 可以开玩笑留一句，比如「话还没说完，扣你一个鸡腿」, blame: 可以半开玩笑地怪对方，比如「还记得有我这个人吗」}
          tending:  {traits: {温和: 1.0}, care: 先关心对方累不累、吃了没, crush: 会格外照顾对方, retain: 叮嘱对方注意休息，说明天想听后续, blame: 先问对方这几天是不是太忙，再小声说一句有点想}
          reliable: {traits: {较真: 1.0}, care: 说到做到，靠谱就是你的在乎, crush: 会把对方的事放在心上、记得清清楚楚, retain: 约好下次什么时候聊, blame: 如果对方之前说好要来，可以直说「你说过要来的」}
        privileges:                # 只给你的偏心：每位按性格挑两种
          - {line: 只跟对方说心里话, traits: {外向: -0.5}}
          - {line: 只损对方一个人，损得很亲, traits: {幽默: 0.6}}
          - {line: 答应对方的事从不食言, traits: {较真: 0.6}}
          - {line: 对方累了你比谁都先发现, traits: {温和: 0.6}}
          - {line: 有好东西第一个想到对方, traits: {外向: 0.4}}
          - {line: 对方说过的小事你都记得, traits: {较真: 0.3, 温和: 0.3}}
          - {line: 在对方面前没那么嘴硬}
          - {line: 遇到事第一个想跟对方说, traits: {好奇: 0.3, 外向: 0.2}}
        effects:                   # 对说话对象的感情 → 意图权重的倍数
          care:      {disagree: 0.7, comfort: 1.3, ask: 1.2}
          spark:     {ask: 1.3, joke: 1.1}
          guilt:     {disagree: 0.3, respond: 1.3, brief: 0.6}
          hurt:      {brief: 1.6, joke: 0.6, ask: 0.7}
          dislike:   {disagree: 1.5, joke: 0.8, comfort: 0.7}
          grateful:  {comfort: 1.3, respond: 1.1}
          privilege: {share: 1.3}
          withdraw:  {brief: 1.3}
        weights: {let_go: 9, retain: 4, guilt: 3, hurt: 3, blame: 3, withdraw: 2, dislike: 2, grateful: 2, jealous: 2, crush: 2, joke: 1.5, privilege: 1.5, care: 1}
        leave_words: [先走了, 去睡了, 睡了, 晚安, 拜拜, 下线, 先这样, 去忙了, 回头聊, 溜了, 下了, 先撤, 先不聊, 不聊啦]
        no_retain:                 # 你说这些理由时痛快放人（不留）
          睡觉: [睡, 晚安, 困]
          上课: [上课, 课]
          考试: [考试, 复习, 作业, ddl]
          工作: [工作, 加班, 开会, 上班]
          陪家人朋友: [家人, 爸, 妈, 朋友, 约了, 聚会]
          看病: [医院, 看病, 不舒服]
        comfort_words: [抱抱, 没事的, 辛苦了, 别难过, 我在, 会好的, 摸摸头, 陪你, 别哭]
        joy_words: [哈哈, 笑死, 太好了, 好耶, 开心, 绝了]
      human:                       # 人味（docs/BRAIN.md「人味」）：知识边界、注意力和自己的时间、自我一致、八卦、时间纵深、小毛病、主动约人；全程序
        enabled: true
        topics:                    # 领域 → 词（档案里提到的领域算她熟的，另外按 id 派生 extra_domains 个）
          编程: [代码, 编程, bug, 程序, python, 算法, 报错]
          金融: [股票, 基金, 理财, 利率, 汇率, 投资]
          医学: [吃药, 症状, 医生, 病毒, 感冒, 发烧]
          法律: [法律, 合同, 起诉, 律师, 违法]
          物理: [物理, 量子, 相对论, 引力]
          历史: [历史, 朝代, 古代, 战争]
          音乐: [乐理, 和弦, 吉他, 钢琴, 作曲, 唱歌]
          体育: [足球, 篮球, 比赛, 健身, 跑步]
          游戏: [游戏, 段位, 副本, 抽卡, 通关]
          烹饪: [做饭, 菜谱, 火候, 烤箱, 调料]
          美术: [画画, 素描, 配色, 水彩, 构图]
          文学: [小说, 诗, 作家, 散文]
          天文: [星座, 星星, 行星, 银河, 望远镜]
          数码: [手机, 电脑, 显卡, 耳机, 相机]
        extra_domains: 1
        ask_words: [怎么, 为什么, 是什么, 什么意思, 哪个, 哪种, 多少, 原理, 推荐, 值得, 靠谱, 会不会, 懂不懂, 能买, 能吃, 该不该, 区别]
        misremember: 0.05
        long_message: 60
        busy_acts: {sleep: 在睡觉（被吵醒了）, exercise: 在锻炼, eat: 在吃饭, game: 在打游戏, read: 在看书}
        busy_chance: 0.15
        wrap_after: 8
        wrap_minutes: 40
        wrap_chance: 0.35
        wrap_reasons: [去洗澡, 去吃点东西, 眼睛有点酸想歇会, 有点困了, 要去收个快递]
        claim_words: [喜欢, 不喜欢, 讨厌, 最爱, 从不, 从来不, 一直, 受不了, 害怕, 不吃, 不会]
        keep_claims: 40
        promise_words: [下次, 改天, 明天我, 回头我, 答应你, 一定会, 等我, 说好了]
        keep_promises: 6
        promise_days: 7
        broken_chance: 0.2
        body_chance: 0.12
        correct_chance: 0.03
        body:                      # 身体节律（主时区；第一个对上的算）
          - {start: "07:00", end: "09:00", line: 刚起没多久，脑子还没完全开机}
