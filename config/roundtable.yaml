# 圆桌运行参数

# 一张桌最多的组员座位数（所选档位的可用模型都上桌，人数超过此值时拒绝执行；代号池不得少于此值）
seats: 12
# 组员少于此数时暂停问用户；开桌至少需要 min_members 个组员 + 1 个统筹
min_members: 2
# 互评：每份答案由几位其他组员评审（分配均衡、不评自己）；组员不多于此数 + 1 时等于全员互评
reviews_per_answer: 3

# 预算按 UTC 自然月 / 自然日统计（每月 1 号、每天 0 点 UTC 进入新周期）。
# 达到 warn_ratio 时提醒（不打断）；已超出或下一步预计会超出时暂停，请用户确认继续或停止。
budget:
  monthly_usd: 20.0    # 每月预算
  daily_usd: 3.0       # 每日上限；填 null 表示不设
  warn_ratio: 0.8

# 办公室模式（O1 起，见 docs/OFFICE.md）：AI 是员工，token 是工资。经理在 models.yaml 用 office_role: manager 指定。
# task_caps_usd：每件事的工资上限，按办事方式（单人办 / 开会 / 项目分工）分别设；预计超出时先问你。
office:
  task_caps_usd: {single: 0.05, meeting: 0.15, project: 0.80}
  manager_strategy: rotate   # 两位以上经理：每件事轮流主办，项目级任务由另一位复核
  # 开会（O3）：经理点名几位员工依次发言（后发言的看得到前面的），经理拍板写结论和纪要
  meeting: {min_attendees: 2, max_attendees: 3}
  # 项目分工（O4）：经理点名 2～4 人的项目组，另开一张桌子走协同流水线（只派需要的人），
  # 交叉审查每份成果只找 1 位（只审关键），主办经理以中等思考强度合并，另一位经理最后验收（退回改一次）
  project:
    min_members: 2
    max_members: 4
    reviews_per_item: 1
    pipeline: [decompose, volunteer, assign, work, cross_review, rework, accept, merge, office_review, reveal]
    step_params:
      merge: {reasoning: {effort: medium}}
  # 绩效（O5）：员工名单附上绩效给经理参考；规则派活时工资相同的员工优先通过率高的。
  # min_jobs：某类活至少办过几件才显示 / 参考（太少不说明问题）
  performance: {enabled: true, min_jobs: 3}

# 群聊：成员只回应你，不主动发消息；没有 @ 人时随机一两位回应
chat:
  life_title: 大家庭               # 生活群
  work_title: 工作群
  budget:
    monthly_usd: 5.0               # 聊天这一块每月最多花多少（私聊 + 群聊；也计入上面的总预算）
  memory:                          # 成员的分层记忆：只存本地，只用于聊天
    enabled: true
    context_chars: 800             # 聊天时最多带多少字的记忆
    catch_up_days: 7               # 最多补整理几天前的聊天
    recall: half_life              # 召回方式：half_life 半衰期记忆（默认，按相关 × 鲜活 × 重要挑）；layers 按时间固定带几层（旧）
    half_life_days: 30             # 半衰期记忆：发生过的事过 30 天鲜活度减半（不删，只排后）
    inject_max: 6                  # 半衰期记忆：每次聊天最多带几件
    daily_quota: 8                 # 半衰期记忆：每人每天最多记几件事
    freshness_floor: 0.5           # 鲜活度保底：再久的事也不低于一半（只排后，不删）
    night: true                    # 每晚整理合并成一次调用：第一人称日记 + 记忆件 + 挂着的事（心情只改回忆语气和重要度，留旧版）
    domains: [学术, 日常, 工作, 娱乐, 社交, 身心]   # 领域标签
    hanging_max: 5                 # 脑子里挂着的事最多几件
    links: {enabled: true, assoc_max: 1}         # 联想网：一起出现就连得更紧，想起一件顺带想到一件；夜里随便走几步
    diary: {enabled: true, daily_reads: 3}       # 翻日记：只在生活模式，每位成员每天最多翻 3 次
  life:                            # 生活引擎：你不在时成员按作息过日子、彼此聊天（不主动找你）
    enabled: true
    daily_usd: 0.15                # 生活（含记忆整理、自己上网）每天最多花多少；约 $4.5 / 月
    tick_minutes: 30               # 电脑开着时多久推进一次
    max_written_per_tick: 2        # 每次推进最多几件事写成聊天，其余只记一行
    max_written_catch_up: 6        # 开机补算时最多写几件
    catch_up_hours: 24             # 补算最多往回看多少小时（更早的只整理成记忆）
    turns: 3                       # 一段成员之间的对话最多几句
    guard:                         # 收得住：全部由代码判断，不花钱
      daily_messages: 40           # 成员之间每天最多说几句（含分享）
      max_chars: 200               # 互聊每句最多多少字
      stale_similarity: 0.5        # 和这段前面的话或最近的互聊太像就收尾（0～1）
      max_failures: 3              # 连续出错几次，当天停掉生活
      budget_alarm: 0.9            # 生活日上限或聊天月预算用到 90%，当天停掉
      report_weekday: 1            # 每周一生成上一周的自检报告（花费、谁说得多、重复、异常）
  moments:                         # 朋友圈：成员每天最多发 1 条，互相点赞（免费）、评论
    enabled: true
    posts_per_member: 1
    comments_per_tick: 2           # 每次推进最多写几条评论
    dedupe_hours: 48               # 去重：别人 48 小时内发过的同一件事不再发
    similarity_max: 0.3            # 去重：正文和近期动态相似度达到这个值就不发（0～1）
  browse:                          # 上网：只读公开订阅源（$0），成员按兴趣挑一条分享到生活群
    enabled: true
    refresh_hours: 3               # 多久重新抓一次订阅源
    shares_per_member: 1           # 每位成员每天最多分享几条
    search_per_day: 5              # 订阅源里没有感兴趣的内容时联网搜索，全体每天最多几次
    feeds:                         # 网页「上网」里可以增删；改过之后以网页里的为准
      - {name: BBC 中文, url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml", topics: [新闻, 国际], kind: news}
      - {name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml", topics: [新闻, 国际], kind: news}
      - {name: 36氪, url: "https://36kr.com/feed", topics: [科技, 商业], kind: news}
      - {name: 少数派, url: "https://sspai.com/feed", topics: [科技, 数码, 效率], kind: blog}
      - {name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index", topics: [科技, 科学], kind: news}
      - {name: Hacker News, url: "https://news.ycombinator.com/rss", topics: [科技, 编程], kind: forum}
      - {name: NASA, url: "https://www.nasa.gov/news-release/feed/", topics: [天文, 科学], kind: news}
      - {name: ScienceDaily, url: "https://www.sciencedaily.com/rss/top/science.xml", topics: [科学], kind: news}
      - {name: Polygon, url: "https://www.polygon.com/rss/index.xml", topics: [游戏], kind: news}
      - {name: NASA 视频, url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCLA_DiR1FfKNvjuUpBHmylQ", topics: [天文, 科学, 视频], kind: video}
  engine:                          # 成员引擎（docs/MEMBER_ENGINE.md）：只用于聊天、朋友圈、生活
    enabled: true
    context: {budget_chars: 600}   # 调模型时带的资料最多多少字（固定部分放最前，利于缓存）
    card: {budget_chars: 400}      # 随身卡（人物卡的精简版，每次都带）最多多少字，算在上面的 600 字里
    scheduler:                     # 预算调度：你直接找她 > 主动找你 > 群聊 > 生活
      daily_usd: 0.25              # 聊天这一块每天的额度；你直接找她不受它限制
      shares: {proactive: 0.85, group: 0.7, life: 0.5}   # 其余三类最多用到额度的几成，超了只记一行
    heartbeat: {enabled: true, max_actions: 3}
    bus: {keep_days: null, catch_up_days: 14}   # 事件一直保留（只存本机，攒经历数据）；开机最多补算 14 天
  watch:                           # 投屏陪伴（docs/WATCH.md）：你投屏，选 1～3 位陪你一起看
    enabled: true
    monthly_usd: 1.5               # 一起看每月最多花多少（不占聊天月预算）；用完只陪聊、不看画面
    max_watchers: 3
    grab_seconds: 3                # 多久截一张（只在内存里，不存盘）
    describe_gap_seconds: 20       # 画面明显变了、且离上次至少这么久，才交给识图模型看一次
    describes_per_hour: 90
    react_gap_seconds: 90          # 没人说话时，同一位最多每 90 秒主动说一句
    max_minutes: 240               # 一次投屏最长 4 小时，到时自动停
  wander:                          # 成员自己上网（docs/WANDER.md）：在隔离浏览器里逛下面这些网站，第一期只看不互动
    enabled: true
    auto: true                     # 按作息自动安排（每人每天最多 1 次，每次最多 10 分钟）；关掉后只能手动让她去
    headless: true                 # 在后台逛，不弹窗口；用电脑自带的 Edge（没有就用 Chrome）
    trips_per_member_per_day: 1
    max_steps: 12                  # 一次最多看 12 个页面
    max_minutes: 10
    sites:                         # 只能打开这些网站（域名后缀匹配）；花费算在生活每天的上限里
      - {id: bilibili, name: B站, home: "https://www.bilibili.com/", search: "https://search.bilibili.com/all?keyword={q}", hosts: [bilibili.com]}
      - {id: xiaoheihe, name: 小黑盒, home: "https://www.xiaoheihe.cn/", hosts: [xiaoheihe.cn]}
      - {id: taobao, name: 淘宝, home: "https://www.taobao.com/", search: "https://s.taobao.com/search?q={q}", hosts: [taobao.com, tmall.com]}
  actions:                         # 聊天里能发什么（docs/CHAT.md「微信式动作」）；何时发、节奏归成员系统，这里是默认值
    enabled: true
    stickers:                      # 成员能用的表情包（名字与网页表情面板一致）
      团子: [开心, 哭哭, 生气, 害羞, 震惊, 晚安, 比心, 疑惑, 点赞, 摸鱼, 冲鸭, 吃瓜, 流汗, 晕了, 收到, 奶茶]
      猫猫: [喵, 蹭蹭, 委屈, 炸毛, 睡觉, 偷看, 得意, 饿了, 开心, 哈？, 贴贴, 躺平]
      文字: [收到！, 好耶, 哈哈哈, 在吗, 晚安, 冲！, 谢谢, 绝了, 救命, "6", 离谱, 抱抱]
    kaomoji: ["(＾▽＾)", "(๑•̀ㅂ•́)و✧", "(｡•́︿•̀｡)", "(￣▽￣)\"", "(╯°□°)╯", "(・∀・)", "_(:з」∠)_", "(｀・ω・´)", "(ﾉ>ω<)ﾉ", "(；´Д｀)", "ヽ(✿ﾟ▽ﾟ)ノ", "(⊙_⊙)？"]
    max_segments: 3                # 一次回复最多拆成几条气泡
    segment_gap_seconds: 1.2       # 拆条之间停多久（默认值）
    recall_seconds: 120            # 你发出 2 分钟内可以撤回
    pat_reply: true                # 被拍一拍后回一句
    no_reply_in_group: true        # 群里没被点名时可以不接话
    drop_stale: true               # 你补发新消息或撤回时，上一轮还没发出的气泡和还没开口的人作废
    moment_forward: 0.5            # 今天上网分享过的成员发朋友圈时，一半发成「一句话 + 转发卡片」
    video_hosts: [youtube.com, youtu.be, vimeo.com, bilibili.com]   # 这些网站的链接显示成视频卡片（只看网址）
  tier: budget
  max_repliers: 2
  max_mentioned: 8                 # 「@全员」「所有人」「大家」时最多几位依次回应
  history_messages: 30
  max_tokens: 1500

# 说话底线（去八股化）：不用金句收尾、不喊格言口号、不排比升华、不写空洞总结
plain_talk:
  enabled: true
  # 第 1 层：这些提示词的每次调用都接上 plain_talk 提示词（同一步骤所有成员完全相同；聊天、生活、工作模式共用）
  roles: [
    chat, chat_dm, chat_work, life_chat, life_share, moment_post, moment_comment,
    answer, revise, work, work_analyze, work_research, work_write, work_review, rework, merge,
    accept_fix, clarify_answer, office_speak, office_decide, office_handle, office_fix, office_revise,
    watch,
  ]
  # 第 2 层：聊天、生活、朋友圈、投屏陪伴的发言发出前按规则表检查（不调用模型），查出问题才改写一次；
  # 一次回复拆成几条连发时合起来查
  check:
    enabled: true
    min_chars: 8                   # 短于 8 个字的消息不查
    monthly_usd: 0.05              # 改写每月最多花 $0.05（超了就发原文）
    estimate_usd: 0.0005
    rules:
      - name: ending_maxim
        problem: 用金句、感悟或寄语收尾
        kind: ending               # 只看最后一句
        patterns:
          - "^(说到底|归根结底|归根到底|说白了|毕竟|其实|或许|也许|终究)[，,]?.{0,24}(才是|就是|便是|不过是)"
          - "(这就是|这便是|这才是|这正是|或许这就是|也许这就是).{0,16}(意义|魅力|真谛|浪漫|力量|生活|人生|答案|智慧|成长|美好)"
          - "^(愿你|愿我们|愿每|但愿|祝愿|希望我们都能|希望每个人)"
          - "^(人生|生活|成长|时间|岁月|世界|青春|热爱)(就是|就像|本就是|不过是|总会|从来都|终将|自有)"
          - "(才是|就是)(最好的|最大的|最美的|最珍贵的|真正的)(答案|礼物|风景|修行|浪漫|意义)"
      - name: slogan
        problem: 格言口号或鸡汤
        kind: phrase
        patterns:
          - "不忘初心|砥砺前行|未来可期|乘风破浪|勇往直前|永不言弃|星辰大海|奔赴山海|向阳而生|心之所向"
          - "岁月静好|保持热爱|且行且珍惜|热爱可抵岁月漫长|山高路远|行而不辍|久久为功|未来已来"
          - "让我们(一起|共同|携手)|一起加油吧|永远在路上|每一天都是新的开始"
      - name: parallel
        problem: 排比升华（连着三句以上同样开头）
        kind: parallel
        min_run: 3
        heads: [是, 让, 像, 有, 用, 为, 把, 每]
      - name: empty_summary
        problem: 空洞总结或套话
        kind: phrase
        patterns:
          - "总而言之|综上所述|总的来说|一言以蔽之|归纳起来"
          - "希望(这些|以上|我的回答)?(内容)?对你有(所)?帮助|以上就是"
          - "值得我们(每个人)?(深思|思考|铭记)|意义深远|发人深省|引人深思|令人深思"
      - name: mug
        problem: 能印在马克杯上的话（脱离上下文也成立的金句、鸡汤、感悟、万能祝福）
        kind: mug                  # 一句里空泛大词至少 2 个、又没有任何具体所指
        min_hits: 2
        max_chars: 40
        patterns:
          - "人生|生活|世界|时光|岁月|日子|时刻|时候|节奏|每个人|所有人|我们都|一切|自己|内心|心里"
          - "真正的|最好的|最美的|终将|总会|总有|永远|从来|只要|就会|才能|值得|不必|何必|原来|反而|其实"
          - "热爱|温柔|勇敢|坚持|成长|意义|美好|幸福|梦想|远方|平凡|平淡|努力|珍惜|治愈|答案|风景|力量|勇气"
          - "慢慢来|都会好|也挺好|也很好|挺好的|真好|难得|奢侈|惬意|踏实|安心|享受|休息|放空|松弛|舒服"
        concrete:
          - "\\d|[A-Za-z]{2,}|《|“|\""
          - "今天|昨天|明天|今晚|昨晚|刚才|刚刚|上次|下次|周[一二三四五六日天]|星期|早上|中午|下午|晚上"
          - "[这那](个|部|次|家|首|本|篇|款|道|张|条|台|位|件|顿|局|集|段|句)"
          - "你说|你那|你的|我那|我刚|我今天|我的|他的|她的|楼下|天台|食堂|办公室|健身房|代码|文件|报告"
      - name: soft_epiphany
        problem: 结尾补一句感悟（"反而挺好""也是种休息""挺治愈的"之类）
        kind: ending
        patterns:
          - "(反而|原来|才发现|其实|突然觉得).{0,16}(好|舒服|踏实|松|难得|享受|治愈|解乏|幸福|平静|安心|自在)"
          - "也是(一)?种(休息|幸福|享受|修行|浪漫|治愈|放松|收获|成长)"
          - "(挺|很|真|太|最|多)(治愈|惬意|奢侈|难得|踏实|幸福|解压)(的|了|啊|呀|呢)?$"
          - "(这种|那种|这样的|那样的).{0,14}(时候|时刻|日子|下午|上午|早晨|晚上|感觉|节奏|状态).{0,8}(挺好|最好|真好|也好|舒服|踏实|难得|享受|治愈|惬意)"
          - "(好好|多)(享受|珍惜|放空)(吧|一下|一会儿)?$"
          - "(这种|那种|这样|就这么|觉得).{0,20}(也|倒|反而)?(挺|很|蛮|还挺)(好|舒服|不错|平静|自在)(的|了|啊|呀|呢)?$"
      - name: assistant_voice
        problem: 客服腔或 AI 腔（"好问题""作为一个……""我理解你的感受""随时问我"）
        kind: phrase
        patterns:
          - "^(好问题|这是个好问题|这个问题(问得)?(很|真|特别)?(好|有意思|有趣))"
          - "作为一(个|名)(AI|人工智能|语言模型|助手)|我理解你的(感受|心情)|我能理解你的(感受|心情)"
          - "(如果|若)(你)?还有(其他|任何|别的)?(问题|疑问|需要).{0,6}(随时|欢迎)|随时(找我|问我|告诉我)|有需要(随时)?(叫|喊|找)我"
          - "非常(感谢|荣幸)|很高兴(能)?(为你|帮到你|和你)|乐意(为你)?效劳"

# 单步预估 token 超过此值时询问用户
token_threshold: 20000

coordinator:
  # 统筹从上桌的模型中选出，本题不作答。
  # rotate: 按会话轮换（最近当过统筹的排后，其余随机）；random: 随机；fixed: 固定为 fixed_id（不在上桌范围内时按 rotate）
  strategy: rotate
  fixed_id: null

revise_rounds: 1

# 各步骤使用的提示词版本（prompts/<role>/<version>.md）
prompts:
  planner: v1
  mail_summary: v1     # 邮件栏：一封邮件的要点总结（点了才调用）
  mail_translate: v1   # 邮件栏：把一封邮件翻译成中文（点了才调用）
  mail_digest: v1      # 邮件栏：几封重要邮件的汇总（点了才调用）
  panel: v2             # 分诊小组：v2 起可以推荐头脑风暴
  ideate: v2            # 头脑风暴：按抽到的发散手法出点子（v1 不带手法）
  expand: v1
  crossbreed: v1        # 头脑风暴：碰撞杂交
  vote: v1              # 头脑风暴：匿名投票
  organize: v2          # 头脑风暴：整合成导图 + 对比表 / 场景故事 / 行动方案 / 黑马
  answer: v1
  review: v3
  revise: v3
  synthesize: v4
  redo: v1
  decompose: v5
  volunteer: v1
  assign: v3
  accept: v1             # 协同：合并前统筹按验收标准逐条验收
  accept_fix: v1         # 协同：未通过验收的作者修改一次
  discuss: v1            # 协同：分工后组员提调整建议
  adjust: v1             # 协同：统筹据此最多调整一次
  clarify_offer: v1      # 协同：有上游产出时，允许负责人先向上游作者提一次澄清问题
  clarify_answer: v1     # 协同：上游作者答复澄清问题
  clarify_reply: v1      # 协同：把答复交给提问者，请其完成子任务
  work: v1
  decompose_retry: v1    # 流水线拆分不合格时，把问题列给统筹重拆
  work_analyze: v1       # 协同流水线：各类型子任务的工作提示词
  work_research: v1
  work_write: v1
  work_prompt: v1
  work_generate: v1
  work_code: v1
  work_verify: v1
  work_review: v1
  work_factcheck: v1
  work_assemble: v1
  cross_review: v1
  rework: v2
  merge: v5              # v5：已被下游接手的上游成果只给开头摘录
  attachments: v1        # 题目附件（文字版 / 随附图片）
  describe_image: v1     # 图片文字版
  transcribe: v1         # 音频转写
  tools: v5              # 工具说明与工具结果（v2：联网搜索；v3：图表中文；v4：转述的网页正文；v5：in/ 上游文件与参考图）
  image_gen: v1          # 图像生成工具
  media_brief: v2        # 媒体输出：把题目改写成「写生成提示词」的任务
  media_review: v2       # 评审生成结果（图片 / 视频截帧）；v2：对照风格清单逐条判定
  style_extract: v1      # 风格规范提取：成员各自看参考图
  office_intake: v4      # 办公室：经理分诊派活（v2：开会点名；v3：项目组点名；v4：名单附绩效）
  office_speak: v1       # 办公室·开会：员工依次发言
  office_decide: v1      # 办公室·开会：经理拍板，写结论和会议纪要
  office_review: v1      # 办公室·项目：复核经理最终验收
  office_revise: v1      # 办公室·项目：主办经理按验收意见改一次
  office_handle: v2      # 办公室：员工办理（v2：带字画面用代码画、数字须核实）
  watch: v1              # 投屏陪伴：成员陪用户看屏幕，吐槽、接话
  wander: v1             # 成员自己上网：每看一页说一句感想、决定下一步（只看不互动）
  describe_screen: v1    # 投屏陪伴：把一张截图写成给成员看的文字（隐私信息打码）
  chat: v5               # 群聊：口语、短句（v2：人设与记忆；v3：人物卡随身卡，AI 身份平时不刻意提、被认真问如实承认；v4：表情包、颜文字、引用、分条、不接话；v5：知道现在几点和自己在干什么）
  chat_dm: v5            # 私聊：和用户一对一（v2：人设与记忆；v3：人物卡随身卡；v4：表情包、颜文字、引用、分条；v5：知道现在几点）
  chat_work: v3          # 工作群：聊工作，交办走办公室（v2：人设与记忆；v3：人物卡随身卡）
  memory_day: v1         # 记忆：把一天的聊天压成一段
  memory_roll: v1        # 记忆：日 → 周、周 → 月
  memory_profile: v1     # 记忆：更新长期档案
  memory_items: v1       # 记忆（半衰期，night: false 时用）：一天的聊天拆成几件事，重要的标 ★
  memory_night: v1       # 记忆（P2）：每晚一次调用整理一天，写第一人称日记 + 记忆件 + 挂着的事
  memory_diary: v1       # 记忆（P2）：翻日记工具的说明（生活模式的私聊、生活群）
  memory_diary_result: v1  # 记忆（P2）：把翻到的日记交回给成员
  member_eval: v1       # 成员评测集：情境题（规则判分，离线用假模型）
  life_chat: v2          # 生活：成员之间聊天（公寓楼里的模拟生活）
  life_share: v2         # 生活：成员把上网看到的一条内容分享到生活群
  moment_post: v3        # 朋友圈：成员发一条动态（v3：转发卡片、表情包）
  moment_comment: v3     # 朋友圈：成员评论一条动态（或回复评论）（v3：表情包）
  evolution_card: v1     # 革新例会·自己找资料：一位成员把网页写成资料卡
  evolution_check: v1    # 革新例会·自己找资料：另一位成员复核资料卡
  evolution_plugins: v1  # 革新例会·插件清单：一位成员根据资料卡和点子榜写给用户看的插件清单
  office_check: v1       # 办公室：经理过目
  office_fix: v2         # 办公室：退回后员工改一次（v2：改程序必须重跑出图）
  style_merge: v1        # 统筹合并成规范 + 清单
  style_guide: v1        # 风格规范，接在之后的每次调用上
  user_notes: v1         # 用户中途补充的意见，接在之后的每次调用上
  media_refine: v1       # 统筹根据评审决定是否改提示词重新生成
  media_rewrite: v2      # 汇总失败时，由一位成员根据修订稿重写生成提示词
  work_media: v2         # 协同：媒体子任务，成员写生成提示词
  rework_media: v2       # 协同：按审查意见修改生成提示词
  evolve_review: v1      # 革新 PR 的对抗式复审（开发侧脚本 scripts/evolve_review.py，可选）
  web_search: v1         # 借助聚合平台联网搜索时发给搜索用模型的指令
  web_fetch: v1          # 借助聚合平台读取网页时发给读取用模型的指令
  perceive_fast: v1      # 感官·快速：把用户发的图片 / 视频画面 / 语音转写整理成简短的感知卡
  perceive_fine: v1      # 感官·精细：同上，写得更细，图里的字逐字抄下
  plain_talk: v2         # 说话底线（去八股化）：接在 plain_talk.roles 的每次调用上，所有成员相同（v2：马克杯警戒线、AI 腔）
  plain_rewrite: v2      # 说话底线·改写：发言查出问题时成员自己用节电档改一次（v2：一行一条气泡）

# 每个步骤对所有模型统一使用的参数（中立：同一步骤参数相同；模型自身必需的参数在 models.yaml）
step_params:
  # max_tokens 是每次调用的输出上限（推理模型的思考 token 也计入），防止输出失控；
  # 预估卡片上的"最多"按所有调用都写满这个上限计算。
  # reasoning 是中立的思考预算参数（同一步骤所有模型相同；渠道不支持时自动忽略）：
  #   {effort: low|medium|high} 或 {max_tokens: N}（思考最多用 N token，其余留给正文），二选一。
  #   原则：作答 / 修订 / 完成子任务要认真想，但封顶，保证正文有足够空间；
  #   评审、汇总、拆分、分配、自荐、风格校验等用低强度。
  answer: {max_tokens: 5000, reasoning: {max_tokens: 2000}}
  watch: {max_tokens: 1200, reasoning: {effort: low}}  # 投屏陪伴：一两句
  wander: {max_tokens: 1200, reasoning: {effort: low}}  # 自己上网：每页一小段 JSON
  chat: {max_tokens: 1500, reasoning: {effort: low}}   # 群聊：一两句话，少想多说（思考会挤占输出，之前 500 上限时有人回复为空）
  review: {max_tokens: 3000, reasoning: {max_tokens: 800}}
  revise: {max_tokens: 5000, reasoning: {max_tokens: 2000}}
  synthesize: {max_tokens: 5000, reasoning: {effort: medium}}   # 最终答案由统筹写：认真想（2026-10-22 起 medium）
  ideate: {max_tokens: 2000, reasoning: {effort: low}}
  expand: {max_tokens: 1500, reasoning: {effort: low}}
  crossbreed: {max_tokens: 1500, reasoning: {effort: low}}
  vote: {max_tokens: 1200, reasoning: {effort: low}}
  organize: {max_tokens: 7000, reasoning: {effort: low}}
  decompose: {max_tokens: 2500, reasoning: {effort: low}}
  volunteer: {max_tokens: 1500, reasoning: {effort: low}}
  assign: {max_tokens: 1500, reasoning: {effort: low}}
  discuss: {max_tokens: 1200, reasoning: {effort: low}}
  adjust: {max_tokens: 1500, reasoning: {effort: low}}
  clarify: {max_tokens: 1200, reasoning: {effort: low}}
  work: {max_tokens: 6000, reasoning: {max_tokens: 2000}}
  cross_review: {max_tokens: 3000, reasoning: {max_tokens: 800}}
  rework: {max_tokens: 6000, reasoning: {max_tokens: 2000}}
  accept: {max_tokens: 2000, reasoning: {effort: low}}
  accept_fix: {max_tokens: 6000, reasoning: {max_tokens: 2000}}
  merge: {max_tokens: 10000, reasoning: {effort: medium}}   # 同上：合并即最终成果
  style: {max_tokens: 1500, reasoning: {effort: low}}
  style_gate: {max_tokens: 1500, reasoning: {effort: low}}
  # 办公室模式：经理的判断和把关要认真想（中等强度），员工办理同作答
  intake: {max_tokens: 1500, reasoning: {effort: medium}}
  handle: {max_tokens: 6000, reasoning: {max_tokens: 2000}}
  check: {max_tokens: 2000, reasoning: {effort: medium}}
  fix: {max_tokens: 6000, reasoning: {max_tokens: 2000}}
  # 开会：发言短而有用；经理拍板要认真想
  speak: {max_tokens: 2500, reasoning: {max_tokens: 1000}}
  decide: {max_tokens: 5000, reasoning: {effort: medium}}
  # 项目分工：复核经理验收、主办经理按意见改一次
  office_review: {max_tokens: 2000, reasoning: {effort: medium}}
  office_revise: {max_tokens: 10000, reasoning: {effort: medium}}

# 长度保护：输出被长度上限截断（finish_reason=length）而可见文字很少 = 思考 token 挤占了正文。
# 此时不原样重试：降低思考强度、提高输出上限（×factor，不超过 cap）再调用一次（单独记录、单独计费）。
length_guard:
  enabled: true
  min_visible_chars: 200
  max_tokens_factor: 1.5
  max_tokens_cap: 12000
  retry_effort: low

# 互评质量检查：空泛的评审判为无效，不转给作者
review_quality:
  min_checked_chars: 15     # 没有指出问题时，"检查了什么"至少要写这么多字
  vague_phrases: [挺好, 很好, 不错, 同意, 没问题, 没有问题, 正确, 都对, 很棒, looks good, lgtm, good, fine, ok, agree, correct, no issues]

# 防偷懒：检查每位成员产出是否有实质内容（作答、互评、修订）。
# 不合格时附上原因打回重做一次（提示词 redo）；仍不合格就保留内容并标记"敷衍"，汇总时统筹会看到标记。
effort_check:
  enabled: true
  redo: true
  min_chars: 15                    # 字数下限 = max(min_chars, 预估答案 token 数 × chars_per_expected_token)
  chars_per_expected_token: 0.1
  empty_phrases: [略, 同上, 见上, 同上所述, 无, 暂无, 待补充, 不知道, todo, tbd, n/a, "...", 同意, 赞同]
  refusal_phrases: [无法回答, 不能回答, 无法完成, 无法提供, 我不能, 抱歉, 对不起, i cannot, i can't, i am unable, as an ai]
  refusal_max_chars: 200           # 含拒答短语且不超过这么多字才算拒答
  restate_similarity: 0.8          # 与题目相似度 ≥ 此值：只复述题目
  duplicate_similarity: 0.95       # 修订稿与别人的答案相似度 ≥ 此值：疑似照抄
  duplicate_min_chars: 100

# 步骤顺序（插件名）
# 讨论模式：同一题全员各自作答 → 互评 → 修订 → 汇总
pipeline: [answer, review, revise, synthesize, reveal]
# 协同模式：统筹拆分子任务 → 成员自荐 → 统筹分配（每人至少一块）→ 并行完成 → 交叉审查（不审自己的）
#          → 作者按审查修改 → 统筹合并成完整成果
# 个人作答：只请一位成员直接回答，没有统筹、互评和汇总
solo_pipeline: [answer, reveal]
# 头脑风暴（灵感爆发）：每人按抽到的发散手法独立出点子 → 碰撞杂交（随机拿到几个别人的点子）
#   → 匿名投票（不投自己，代码算分排名）→ 统筹整合（导图 + 点子榜 + 对比表 + 场景故事 + 行动方案 + 黑马）
# 旧流程 [ideate, expand, organize, reveal] 仍可用（ideate/organize 用 v1 提示词时）
brainstorm_pipeline: [ideate, crossbreed, vote, organize, reveal]
# 办公室模式：经理分诊派活 → 员工办理 → 经理过目（不合格退回改一次）。
# 经理决定开会时（O3），handle 改为开会：点名的员工依次发言 → 经理拍板写结论和纪要（不再过目，check 跳过）。
# 经理决定项目分工时（O4），本桌到此为止，另开一张「项目组」桌子走 office.project.pipeline
office_pipeline: [intake, handle, check, reveal]
brainstorm:
  max_ideas: 5              # 每人最多几个点子（含 1 个自由点子）
  max_expansions: 3         # 拓展 / 碰撞杂交：每人最多几条
  crossbreed_sample: 4      # 碰撞杂交：每人随机拿到几个别人的点子（永远不含自己的）
  vote_picks: 5             # 投票：每人最多选几个（不能投自己）
  top: 5                    # 点子榜前几名进对比表
  stories: 3                # 前几名写场景故事
  max_branches: 6
  max_ideas_per_branch: 6
  max_next_steps: 5
  # 发散手法：按随机种子给每位组员抽一种（人数多于手法时循环），与成员是谁无关；
  # 同一步骤提示词模板与参数对所有人相同，只有这一句不同（中立性规则 1 的例外，2026-10-23 用户确认）
  lenses:
    - {name: 反着来, hint: 把常规做法倒过来，或者先想怎样会彻底失败，再反推出点子}
    - {name: 推到极端, hint: 把某个条件放大十倍或缩小到零（预算、时间、规模、人数），看会冒出什么做法}
    - {name: 跨界类比, hint: 借用一个完全不同的行业或领域里的成熟做法，搬过来改造}
    - {name: 换个人看, hint: 站在一类平时被忽略的人（新手、老人、孩子、对手、旁观者）的立场想}
    - {name: 零预算, hint: 假设一分钱都没有，只能靠现有的人、物、关系和时间}
    - {name: 十年以后, hint: 设想技术和习惯已经大变的未来，倒推现在可以先做什么}
    - {name: 拆开重组, hint: 把问题拆成几个部分，替换、合并、删掉或重新排列其中一部分}
    - {name: 外行发问, hint: 像完全不懂行的人一样问“为什么一定要这样”，挑战默认前提}
collab_pipeline: [decompose, volunteer, assign, discuss, work, cross_review, rework, accept, merge, reveal]
collab:
  max_subtasks: 12        # 拆分的子任务上限
  # 分工讨论：分工确定后组员对方案提简短建议，统筹最多调整一次（调整后仍须满足分配规则，否则保持原分工）
  discussion: {enabled: true, min_members: 3, max_suggestions: 3}
  # 逐条验收：合并前统筹按验收标准检查每个文字子任务，不合格的退回作者改一次（媒体成果不验收）
  acceptance: {enabled: true, max_fix_items: 3}
  # 省钱：很短的成果（少于 short_chars 字）只找 short_reviews 位审查者；0 = 不启用。只看成果长度，与作者是谁无关
  cross_review: {short_chars: 400, short_reviews: 1}
  # 澄清提问：有上游产出的文字子任务，负责人动手前可以向上游作者提一次问题（只在需要时问；
  # 不问就不多花钱）。答复记为 clarify 步骤的调用；enabled: false 关闭
  clarify: {enabled: true, max_question_chars: 300}
  # 省钱：合并时，已经交给下游、下游成果合格（未被标记敷衍）的上游成果只给统筹看开头 excerpt_chars 字，
  # 不再重复传全文；终点子任务、被标记敷衍或风格未通过的成果仍给全文。只看依赖关系，与作者无关
  merge_trim: {enabled: true, excerpt_chars: 600}

  # --- 流水线（成员数 ≥ pipeline.min_members 时启用）---------------------------------
  # 协同不是"各做各的"：统筹把题目拆成一条流水线（每个子任务有类型，上游产出交给下游继续做），
  # 每位成员至少分到一块不同的实质工作；成员比步骤多时，可以并行的步骤按内容拆成平行子任务
  # （例如四个角色的文案每人写一个），不允许几个人做同一份内容。
  # 拆分不合格（整题当一个子任务、没有上下游、类型单一、人数不够分、类型规则不符）→ 统筹重拆一次
  # → 仍不合格按下面的模板自动生成。
  pipeline:
    enabled: true
    min_members: 2
    min_kinds: 3
    whole_task_phrases: [完成整道题, 完成整个题目, 完成全部要求, 全部要求, 独立完成题目, 整道题]
    whole_task_similarity: 0.75
    sibling_similarity: 0.95

  # step_params：这类子任务覆盖 work 步骤的参数（只限制最长输出；同一类型所有成员相同）。
  # 子任务类型。prompt：负责人完成这类子任务用的提示词；tags：偏好的能力标签；
  # parallel：能否按内容拆成平行子任务；needs：必须依赖其中某类；audit：审查类（必须依赖被审成果）；
  # avoid_hard / avoid_soft：负责人不能是这些类型上游子任务的负责人（soft：成员太少时放宽）。
  kinds:
    analyze:   {label: 分析, meaning: 读题目 / 材料 / 参考图，提炼要点、规范或需求清单,     prompt: work_analyze,   tags: [vision, research], step_params: {max_tokens: 4500}}
    research:  {label: 搜索调研, meaning: 联网搜索，收集带来源的资料, prompt: work_research,  tags: [research]}
    write:     {label: 撰写, meaning: 撰写设定、文案、正文、报告,     prompt: work_write,     tags: [writing]}
    prompt:    {label: 写提示词, meaning: 把设定与规范写成交给生成模型的提示词, prompt: work_prompt,    tags: [writing, design], parallel: false, step_params: {max_tokens: 3000}}
    generate:  {label: 执行生成, meaning: 用上游提示词调用生成模型（有参考图时一并传入）, prompt: work_generate,  parallel: false, needs: [prompt], requires_media: true, step_params: {max_tokens: 3000}}
    code:      {label: 写代码, meaning: 编写代码并保存成文件,   prompt: work_code,      tags: [code]}
    verify:    {label: 运行验证, meaning: 实际运行上游代码，记录结果, prompt: work_verify,    tags: [code], parallel: false, needs: [code], step_params: {max_tokens: 4000}}
    review:    {label: 审查, meaning: 对照要求（和参考图）检查上游成果，指出问题,     prompt: work_review,    tags: [vision], audit: true, avoid_hard: [prompt], avoid_soft: [generate, write, code], step_params: {max_tokens: 4000}}
    factcheck: {label: 事实核查, meaning: 核对上游成果中的事实、数字、引用, prompt: work_factcheck, tags: [research], audit: true, avoid_soft: [write], step_params: {max_tokens: 4000}}
    assemble:  {label: 整合, meaning: 把上游产出（含文件）整合、排版成最终成品,     prompt: work_assemble,  tags: [code, writing], parallel: false, min_upstream: 2}

  # 模板兜底（按顺序取第一个条件满足的；最后一个必须无条件）。
  # depends_on 里的 gives 是交给下游的内容；split 的步骤在成员比步骤多时按内容拆成平行子任务。
  templates:
    - name: creation_reference
      label: 带参考图的创作
      when:
        media: [image]
        image_attachment: true
        keywords: [画, 绘, 生成图, 作图, 配图, 插图, 海报, 卡片, 人物卡, 四格, 插画, 漫画, 设计, 二创, 创作, 头像, 表情包, draw, poster, illustration, sticker]
      steps:
        - id: T1
          kind: analyze
          title: 分析参考图，提炼风格规范
          requirements: 仔细看参考图，提炼可以直接照着做的风格规范：画风、配色（色值）、线条、构图、版式（格数、边框、比例）、字体与文字排布、禁忌。
          acceptance: 风格规范条目具体、可检查，别人不看原图也能照做
          split: true
          split_by: 按风格维度划分（画风与配色 / 线条与构图 / 版式与文字排布）
          split_hints: [画风与配色, 线条与构图, 版式与文字排布]
        - id: T2
          kind: write
          title: 撰写角色设定与文案
          requirements: 按题目要求撰写角色设定和每格的文案，措辞贴合风格规范。
          acceptance: 每个角色都有设定和文案，没有遗漏，文字量适合版面
          depends_on: [{id: T1, gives: 风格规范}]
          split: true
          split_by: 按角色划分，每人负责不同的角色，各写各的
        - id: T3
          kind: prompt
          title: 写出交给画图模型的提示词
          requirements: 把风格规范和角色设定写成画图提示词，逐条落实风格规范，不得改动风格规范。
          acceptance: 提示词完整、具体，包含风格、构图、文字内容和禁忌
          depends_on: [{id: T1, gives: 风格规范}, {id: T2, gives: 角色设定与文案}]
        - id: T4
          kind: generate
          title: 带参考图调用画图模型生成
          requirements: 用上游提示词生成图片（有参考图时一并传给画图模型）。
          acceptance: 生成了图片
          depends_on: [{id: T3, gives: 画图提示词}]
          media: image
        - id: T5
          kind: review
          title: 对照参考图审查生成结果
          requirements: 对照参考图和风格规范逐条检查生成结果，指出不符合的地方。
          acceptance: 逐条给出符合 / 不符合和理由
          depends_on: [{id: T4, gives: 生成的图片}, {id: T1, gives: 风格规范}]
          split: true
          split_by: 按检查维度划分（风格与配色 / 构图与版式 / 文字与内容）
          split_hints: [风格与配色, 构图与版式, 文字与内容]
        - id: T6
          kind: assemble
          title: 用 Python 拼成成品
          requirements: 把生成的图片和文案排版成最终成品文件（按题目要求的版式）。
          acceptance: 成品文件可以直接使用，版式符合要求
          depends_on: [{id: T4, gives: 生成的图片}, {id: T2, gives: 角色设定与文案}, {id: T5, gives: 审查意见}]

    - name: creation
      label: 无参考图的创作
      when:
        media: [image]
        keywords: [画, 绘, 生成图, 作图, 配图, 插图, 海报, 卡片, 人物卡, 四格, 插画, 漫画, 设计, 二创, 创作, 头像, 表情包, draw, poster, illustration, sticker]
      steps:
        - id: T1
          kind: write
          title: 撰写设定与文案
          requirements: 按题目要求确定风格方向，并撰写设定和文案。
          acceptance: 设定完整，风格方向明确
          split: true
          split_by: 按角色或场景划分，每人负责不同的部分，各写各的
        - id: T2
          kind: prompt
          title: 写出交给画图模型的提示词
          requirements: 把设定写成画图提示词，包含风格、构图、文字内容和禁忌。
          acceptance: 提示词完整、具体
          depends_on: [{id: T1, gives: 设定与文案}]
        - id: T3
          kind: generate
          title: 调用画图模型生成
          requirements: 用上游提示词生成图片。
          acceptance: 生成了图片
          depends_on: [{id: T2, gives: 画图提示词}]
          media: image
        - id: T4
          kind: review
          title: 审查生成结果
          requirements: 对照设定和提示词逐条检查生成结果，指出不符合的地方。
          acceptance: 逐条给出符合 / 不符合和理由
          depends_on: [{id: T3, gives: 生成的图片}, {id: T1, gives: 设定与文案}]
          split: true
          split_by: 按检查维度划分（风格与配色 / 构图与版式 / 文字与内容）
          split_hints: [风格与配色, 构图与版式, 文字与内容]
        - id: T5
          kind: assemble
          title: 用 Python 拼成成品
          requirements: 把图片和文案排版成最终成品文件。
          acceptance: 成品文件可以直接使用
          depends_on: [{id: T3, gives: 生成的图片}, {id: T1, gives: 设定与文案}, {id: T4, gives: 审查意见}]

    - name: research
      label: 调研
      when:
        tools: [search]
        keywords: [调研, 研究, 综述, 搜索, 检索, 查找, 资料, 现状, 趋势, 市场, 文献, 对比, 盘点, research, survey, review of, landscape]
      steps:
        - id: T1
          kind: research
          title: 联网搜索并收集资料
          requirements: 围绕题目联网搜索，收集可靠来源的资料，每条都记下来源编号。
          acceptance: 资料覆盖题目的主要方面，每条有来源
          split: true
          split_by: 按子主题或来源类型划分，每人搜索不同的方面，不要搜同样的内容
        - id: T2
          kind: analyze
          title: 分析整理资料
          requirements: 把资料去重、归类，提炼要点，指出资料之间的矛盾和空白。
          acceptance: 要点清晰，矛盾与空白被指出，来源编号保留
          depends_on: [{id: T1, gives: 收集到的资料}]
          split: true
          split_by: 按主题划分，每人整理不同的主题
        - id: T3
          kind: write
          title: 撰写调研报告
          requirements: 依据整理后的要点撰写报告，结论有来源支撑。
          acceptance: 结构完整，结论有 [S1] 这样的来源标注
          depends_on: [{id: T2, gives: 整理后的要点}]
          split: true
          split_by: 按章节划分，每人写不同的章节
        - id: T4
          kind: factcheck
          title: 事实核查
          requirements: 逐条核对报告中的事实、数字和引用是否有来源支撑，必要时重新搜索。
          acceptance: 列出核对过的论断及结果，错误和无来源的论断被指出
          depends_on: [{id: T3, gives: 报告初稿}, {id: T1, gives: 收集到的资料}]
          split: true
          split_by: 按报告章节划分，每人核查不同的部分
        - id: T5
          kind: assemble
          title: 整合成最终报告
          requirements: 把各章节按核查意见改正后整合成完整报告文件。
          acceptance: 报告完整，核查指出的问题已处理
          depends_on: [{id: T3, gives: 报告初稿}, {id: T4, gives: 核查意见}]

    - name: report
      label: 报告 / 论文
      when:
        keywords: [报告, 论文, 作文, 议论文, 小论文, 论述, 实验报告, essay, report, thesis, paper, lab report]
      steps:
        - id: T1
          kind: analyze
          title: 分析题目，拟定提纲与论点
          requirements: 弄清题目和评分要求，确定中心论点或研究问题，列出章节提纲和每章要回答的问题。
          acceptance: 提纲覆盖题目的全部要求，论点明确，章节之间逻辑连贯
          split: true
          split_by: 按要点或材料划分，每人分析不同的部分
        - id: T2
          kind: write
          title: 撰写各章节
          requirements: 按提纲撰写完整章节，论述有依据，数据、公式和引用准确。
          acceptance: 章节完整，论证清楚，没有遗漏提纲中的问题
          depends_on: [{id: T1, gives: 提纲与论点}]
          split: true
          split_by: 按章节划分，每人写不同的章节
        - id: T3
          kind: review
          title: 审查论证与准确性
          requirements: 对照题目要求检查论证是否成立、数据和引用是否准确、章节之间是否衔接，指出问题。
          acceptance: 逐条给出问题位置和修改建议
          depends_on: [{id: T2, gives: 章节草稿}, {id: T1, gives: 提纲与论点}]
          split: true
          split_by: 按章节划分，每人审查不同的部分
        - id: T4
          kind: assemble
          title: 整合成完整报告
          requirements: 按审查意见改正，统一术语和格式，写出摘要和结论，整合成完整报告。
          acceptance: 报告完整，摘要和结论与正文一致，审查指出的问题已处理
          depends_on: [{id: T2, gives: 章节草稿}, {id: T3, gives: 审查意见}]

    - name: study_notes
      label: 学习笔记 / 复习资料
      when:
        keywords: [笔记, 复习, 总结, 知识点, 考点, 讲义, 梳理, 速记, 思维导图, 重点, notes, revision, summary, cheat sheet, study guide]
      steps:
        - id: T1
          kind: analyze
          title: 梳理知识结构
          requirements: 把材料或题目涉及的内容按主题归类，列出知识点清单和它们之间的联系。
          acceptance: 清单覆盖全部主题，分类清楚，重点和难点被标出
          split: true
          split_by: 按主题划分，每人梳理不同的主题
        - id: T2
          kind: write
          title: 编写笔记正文
          requirements: 按知识结构写笔记：概念、公式、例子和易错点，简洁、可以直接复习使用。
          acceptance: 每个知识点有清楚的解释，公式和数字准确，有至少一个例子或易错点提示
          depends_on: [{id: T1, gives: 知识结构}]
          split: true
          split_by: 按主题划分，每人写不同的主题
        - id: T3
          kind: review
          title: 核对准确性与遗漏
          requirements: 核对笔记中的概念、公式和数字是否正确，检查是否遗漏知识点，指出问题。
          acceptance: 逐条给出错误或遗漏的位置和修改建议
          depends_on: [{id: T2, gives: 笔记草稿}, {id: T1, gives: 知识结构}]
          split: true
          split_by: 按主题划分，每人核对不同的部分
        - id: T4
          kind: assemble
          title: 整合成复习资料
          requirements: 按核对意见改正，统一格式，补一页速查总结（公式、定义、易错点）。
          acceptance: 资料完整，格式统一，速查总结与正文一致，核对指出的问题已处理
          depends_on: [{id: T2, gives: 笔记草稿}, {id: T3, gives: 核对意见}]

    - name: data_code
      label: 数据 / 代码
      when:
        tools: [python]
        keywords: [代码, 编程, 程序, 脚本, 算法, 数据分析, 数据处理, 统计, 计算, 实现, 函数, 爬虫, 可视化, 图表, 报表, python, code, script, dataset, csv, excel]
      steps:
        - id: T1
          kind: analyze
          title: 理解需求
          requirements: 弄清题目要什么：输入、输出、约束、边界情况和验收方式，写成清单。
          acceptance: 需求清单具体，歧义处写出了采用的假设
          split: true
          split_by: 按需求的模块或功能点划分
        - id: T2
          kind: code
          title: 编写代码
          requirements: 按需求清单写出代码，保存成文件。
          acceptance: 代码完整、可运行、覆盖需求清单
          depends_on: [{id: T1, gives: 需求清单}]
          split: true
          split_by: 按模块划分，每人写不同的模块，接口按需求清单约定
        - id: T3
          kind: verify
          title: 运行验证
          requirements: 实际运行上游代码，用测试数据或样例验证，记录运行结果和发现的问题。
          acceptance: 给出运行命令、输出和结论；失败时说明原因
          depends_on: [{id: T2, gives: 代码}, {id: T1, gives: 需求清单}]
        - id: T4
          kind: review
          title: 审查代码与结果
          requirements: 审查代码的正确性、边界情况和可读性，核对运行结果是否满足需求。
          acceptance: 逐条给出问题位置、原因和修改建议
          depends_on: [{id: T2, gives: 代码}, {id: T3, gives: 验证记录}]
          split: true
          split_by: 按审查维度划分（正确性 / 边界与健壮性 / 可读性与结构）
          split_hints: [正确性, 边界与健壮性, 可读性与结构]
        - id: T5
          kind: write
          title: 撰写报告
          requirements: 写出报告：需求、方法、代码说明、验证结果、已知局限和使用方法。
          acceptance: 报告完整，结果与验证记录一致
          depends_on: [{id: T2, gives: 代码}, {id: T3, gives: 验证记录}, {id: T4, gives: 审查意见}]

    - name: document
      label: 文档
      steps:
        - id: T1
          kind: analyze
          title: 分析题目与材料
          requirements: 弄清题目要求，提炼要点和需要覆盖的内容，列出提纲。
          acceptance: 提纲覆盖题目的全部要求
          split: true
          split_by: 按要点或材料划分，每人分析不同的部分
        - id: T2
          kind: write
          title: 起草正文
          requirements: 按提纲起草完整正文。
          acceptance: 正文完整，结构清楚，覆盖提纲
          depends_on: [{id: T1, gives: 提纲与要点}]
          split: true
          split_by: 按章节划分，每人写不同的章节
        - id: T3
          kind: review
          title: 审查草稿
          requirements: 对照题目要求检查草稿的完整性、准确性和逻辑，指出问题。
          acceptance: 逐条给出问题位置和修改建议
          depends_on: [{id: T2, gives: 草稿}, {id: T1, gives: 提纲与要点}]
          split: true
          split_by: 按章节划分，每人审查不同的部分
        - id: T4
          kind: assemble
          title: 整合成最终文档
          requirements: 按审查意见改正并整合成完整文档。
          acceptance: 文档完整，审查指出的问题已处理
          depends_on: [{id: T2, gives: 草稿}, {id: T3, gives: 审查意见}]

# 渠道模式：
#   openrouter —— 只走聚合平台
#   direct     —— 只走官方直连（及本地）
#   auto       —— 按每个模型 routes 的顺序，直连与 OpenRouter 都可用
# 没有 key 的渠道自动跳过。
channel_mode: auto

request:
  timeout_s: 120
  failover_rounds: 2          # 所有渠道都失败后从头再试的轮数（含第一轮）
  backoff_s: 2.0              # 两轮之间的等待
  cooldown_rate_limit_s: 30   # 渠道被限流后，冷却期内排到最后
  cooldown_quota_s: 600       # 渠道额度用尽 / key 无效后，冷却期内排到最后
  max_concurrent: 6           # 每个渠道同时在途的请求数上限（全员并发调用时避免触发限流），超过的排队
  requests_per_minute: null   # 每个渠道每分钟请求数上限；null 不限，达到时排队等待

# 文件上传（附件）：类型同时按扩展名和文件头判断；文件按内容哈希存放，文件名只用于显示
uploads:
  max_files: 5              # 每道题最多几个附件
  max_file_mb: 20           # 单个文件大小上限
  max_pdf_pages: 50
  max_text_chars: 60000     # 每个附件提取出的文字最多保留的字数（超出截断并注明）
  scanned_chars_per_page: 20  # PDF 平均每页少于这么多字时提示"可能是扫描件"（不做文字识别）
  describe_max_tokens: 3000   # 图片文字版的输出上限
  transcribe_max_tokens: 8000 # 音频转写的输出上限
  storage_dir: data/uploads

# 工具：成员在作答过程中可以运行代码、写文件、生成图片（文字协议，见 prompts/tools）
# 同一步骤所有成员可用的工具、限额和说明完全相同
tools:
  enabled: true
  max_rounds: 6               # 每次作答最多几轮工具调用
  by_step:
    answer: [python, write_file, generate_image, search, fetch]
    # 修订、互评、交叉审查不再联网（2026-10-22，见项目资料「超预算与慢笨原因」）：查资料在作答 / 子任务时做，
    # 之后的步骤用 python 核算即可；原来每人每步都按搜索计费，占讨论模式预估的大头，也是慢的主要原因
    revise: [python, write_file, generate_image]
    work: [python, write_file, generate_image, search, fetch]
    rework: [python, write_file, generate_image, search, fetch]
    review: [python]   # 互评 / 交叉审查：用来核算
    cross_review: [python]
    merge: [python, write_file]   # 统筹整理交付文件
    # 办公室模式：员工办理与修改；search / fetch 只在经理判断需要查资料时提供
    handle: [python, write_file, generate_image, search, fetch]
    fix: [python, write_file, generate_image, search, fetch]
  python:
    backend: auto             # wasm（Deno + Pyodide，python scripts/setup_sandbox.py 安装）/ docker / auto / off
    timeout_s: 60             # 每次运行的时限（含加载 numpy 等包）
    memory_mb: 1024
    max_runs: 3               # 每位成员每步最多运行几次（出错重跑也算）
    max_runs_by_step: {handle: 5, fix: 4}   # 办公室模式一个人办完全部（算、画图、改完重跑），多给几次
    max_output_chars: 8000    # 回传给成员的输出最多多少字
  files:
    max_file_mb: 10
    max_session_mb: 100
    max_files_per_step: 20
    share_text_chars: 3000    # 转交给其他成员时，每个文本文件最多附上多少字
  image:
    max_per_step: 2           # 每位成员每步最多生成几张图（需要带 image_gen 标签的模型）
  search:                     # 联网搜索（需要 models.yaml 的 search_providers 中有可用服务）
    max_per_step: 2           # 每位成员每步最多搜索几次
    max_fetch_per_step: 3     # 每步最多读取几个网页（只能读本人搜索结果中的链接）
    max_results: 5
    fetch_max_chars: 8000
    require_citations: true   # 用过搜索的答案要用 [S1] 标注来源；编造来源或一条都不引用 → 打回重做

# 媒体生成（图片 / 语音 / 视频）：媒体模型是工具（models.yaml 中 seat: false），按标签 + 档位选择，同档内随机。
# 讨论模式提问时选择输出类型：成员先讨论并写出生成提示词 → 生成 → 带 vision 标签的成员评审结果
# （图片、视频截帧真正发给他们）→ 不满意就改提示词重新生成，最多 max_rounds 轮。
# 协同模式：拆分时可把子任务标为 image / speech / video，由负责人写提示词并生成，再交叉审查。
media:
  enabled: true
  default_tier: budget       # 提问时可改选 flagship（高质量档）
  max_rounds: 3              # 生成 → 评审 → 重新生成，最多几轮（含第一次生成）
  reviewers: 3               # 每轮最多几位评审者（需带 vision 标签）
  confirm_video: true        # 视频每次生成前都先问你；图片、语音、音乐只在超过单题门槛或创作月上限时才问
  images_per_round: 1
  monthly_usd: 5.0           # 创作输出（图片 / 语音 / 视频 / 音乐）每月合计上限；本月快超时先问你，0 = 不限
  speech: {voice: alloy, format: mp3, max_chars: 4000}
  music: {format: mp3, max_chars: 1500}   # 音乐：按「风格、情绪、乐器、时长、有无人声 / 歌词」描述生成一段，不评审
  video:
    audio: true              # 视频同时生成声音（环境声、对白；模型不支持时忽略）
    duration_s: 5
    resolution: 720p
    aspect_ratio: "16:9"
    poll_interval_s: 10      # 轮询间隔
    timeout_s: 900           # 提交后最多等多久；超时记为失败
    submit_retries: 1        # 提交失败 / 任务失败后再试几次
    frames: 4                # 发给评审者的截帧数
    max_mb: 100
  expected_rounds: 1.5       # 花费预估：平均生成几轮
  review_tokens: 500
  refine_tokens: 600
  prompt_max_chars: 2000
  # 风格参考图：上传的图片默认作为风格参考。生成图片时优先选带 image_edit 标签（支持参考图）的模型，
  # 把参考图一并传给它；没有这样的模型时退回只按文字风格规范生成，并在界面上明确提示。
  references: {max: 3, max_mb: 5}
  # 生成的图片对照风格清单由非作者的成员判定；不通过就带着意见退回作者重画，最多这么多次。
  # 仍不通过时保留最后一版，标记"风格未通过"，汇总 / 合并时统筹可见。
  style_retries: 2
  gate_reviewers: 1

# 风格规范提取（style 步骤，讨论 / 协同两种模式共用）：题目带风格参考图又要画图时，放在流程最前面。
# 带 vision 标签的成员（最多 reviewers 位）各自看原图写风格描述，统筹合并成一份规范 + 一份可逐条检查的清单，
# 之后的每次调用都会带上它。没有 vision 成员时改用图片的文字版，并提示"可能不准"。
style:
  enabled: true
  reviewers: 2
  checklist_min: 6
  checklist_max: 10

# 服务端限制（Web 服务）：同时在后台执行的讨论数。等待你确认的讨论不占名额。
limits:
  max_running_sessions: 3

# token 用量的显示单位："大米"。1 粒 = 1000 token，1 勺 = 100 粒，1 碗 = 30 勺，
# 自动换算到合适的单位（85 粒、3 碗 12 勺）。只改变 token 数量的显示，所有金额仍用美元。
display:
  rice:
    grain_name: 粒
    spoon_name: 勺
    bowl_name: 碗
    grain_tokens: 1000
    spoon_grains: 100
    bowl_spoons: 30

# 革新例会（docs/evolution/README.md）：成员读同一叠资料卡（Claude 整理，成员看不到原文），
# 走头脑风暴提建议、匿名互评、投票，导出采纳单；Claude 只从采纳单里挑一条实现、开 PR，合并永远由你点。
# 资料卡放在数据目录的 evolution/收件箱/，采纳单导出到 evolution/采纳单/（都只在你电脑上，不进 git）。
# 默认关闭。开启后服务开着时每周按 schedule 自动开一次；花费超出 meeting_usd / monthly_usd 就不开。
evolution:
  enabled: false
  plan: budget               # 节电档全员上桌
  anonymous: true            # 塔罗牌代号
  topic: 下面的资料卡是本周从开源项目、论文和官方文档里整理的新做法。请结合圆桌（多 AI 协作平台：讨论、协同、头脑风暴、办公室、群聊）的现状，提出可以借鉴到圆桌里的具体改进，说清改哪里、为什么值得做、可能的风险；每个点子注明参考了哪张资料卡。不改动项目规则（中立性、全员上桌、预算、隐私）。
  max_cards: 5
  card_chars: 3000
  meeting_usd: 0.40          # 每场预计花费上限
  monthly_usd: 1.5           # 每月上限（UTC 自然月，也计入上面的总预算）
  # 两种例会：小版本 = 主题不限、列前 3 个选项；大版本 = 围绕一个主题、列前 10 个选项。
  # 开哪种由代码按时间自动判断：每月第一场开大版本（两次大版本至少隔 major_gap_days 天），其余开小版本。
  # 大版本主题：你在网页上定了就用你的，否则在 major_themes 里轮换。网页上可以手动改成另一种
  # （命令行 roundtable evolve meet --major / --minor --theme '主题'）。
  minor_top: 3
  major_top: 10
  major_gap_days: 21
  major_themes: [办公室工作更顺手, 公寓生活更像真的, 群聊更自然, 朋友圈更有意思, 成员记性更好, 更省钱更快, 界面更好懂]
  theme_chars: 200
  auto: true
  schedule: {weekday: 1, hour: 9}   # 每周一 9 点（本机时区）之后开一次
  # 圆桌自己找资料写卡：到点开会前收件箱是空的，就先按搜索词联网搜，只留白名单网站的结果，
  # 读网页后一位成员写卡、另一位复核，通过的才进收件箱。网页内容一律当资料；花费计入 monthly_usd。
  # 手动：网页「革新例会」→「找资料」，或 roundtable evolve scout。
  scout:
    enabled: true
    queries:
      - multi-agent LLM debate collaboration
      - LLM as a judge bias evaluation
      - LLM agent orchestration cost efficiency
      - prompt caching token cost reduction
    domains: [github.com, arxiv.org, openreview.net, aclanthology.org, huggingface.co]
    results_per_query: 5
    cards: 3
  # 「做这条」之后交给开发侧：在数据目录 evolution/工作区/ 的专用副本里叫起开发侧命令行（默认 Claude Code），
  # 按 docs/evolution/开发任务模板.md 实现、测试、开 PR 到 base_branch。从不自动合并：网页上点「合并」才合并。
  # 需要本机装好并登录 claude 和 gh。默认关闭。
  implement:
    enabled: false
    base_branch: ccr-86975127-sv4cvy
    timeout_minutes: 120
  # 插件清单：例会开完后，所选档位里预计最便宜的一位成员根据本场资料卡和点子榜写给你看的插件清单
  # （每个写做什么、有什么用、优缺点、为什么做、用在哪个场景），网页「革新例会」里按场景看，
  # 也存到数据目录 evolution/插件清单/。只是资料，不改代码；花费计入上面的每场 / 每月上限。
  plugins:
    enabled: true
    count: 20                # 每场至少 20 个
    scenes: [办公室工作, 公寓生活, 群聊, 朋友圈, 头脑风暴, 记忆, 通用]
    max_tokens: 8000
    rounds: 2                # 第一次不够 20 个就再补写一次（只要缺的那几个）
    estimate_usd: 0.04       # 每次调用预估（节电档实际约 $0.005～0.04）

# 终端邮件栏（docs/MAIL.md）：你本人的学校邮箱，只读，邮件只存本机。
# AI 总结 / 翻译只在你点按钮时才调用，第一次会先问你是否同意把这封邮件发给模型；
# 所选档位里预计最便宜的一位来做，花费计入总预算，另有每月上限和每天次数上限。
mail:
  ai:
    plan: budget
    monthly_usd: 0.30
    daily_calls: 20
    max_chars: 6000          # 每封最多发多少字
    max_tokens: 900
    estimate_usd: 0.005      # 每次调用预估（节电档实际约 $0.0005～0.003）
    digest_mails: 10
    language: 简体中文

# 办公室的资料浏览器（docs/CLIPPER.md）：打开网页由圆桌直接抓取正文（不调用模型、不花钱），
# 不能打开本机和内网地址；搜索走联网搜索（有花费，计入总预算）。
# 存下来的资料只在本机，提问时勾选附上（和附件一样）。
clipper:
  enabled: true
  timeout_s: 15
  max_page_kb: 3072          # 网页原始大小上限
  max_page_chars: 60000      # 提取后的正文最多显示多少字
  max_clip_chars: 20000      # 一份资料最多存多少字（省 token）
  max_clips: 200             # 资料夹最多存几份，超出时删最旧的
  search_results: 8
  search_estimate_usd: 0.01

# 成员感官（docs/PERCEPTION.md）：聊天 / 私聊里你发的图片、语音、视频，先整理成「感知卡」，成员读卡回应。
# 快速（默认）：图缩小、视频取 8 帧拼成 2 张宫格图、声音转写；你在消息里写「仔细看」等词时用精细：
# 图更大、卡更长；有带 video_in 标签的模型时整段视频连声音交给它，否则多取帧不拼图。
# 转写稿和感知卡按文件内容缓存，同一个文件不重复花钱；精细直接复用快速时的转写稿。
# 模型只按标签和价格挑最便宜的。花费计入聊天月预算和总预算，另有感官自己的月上限。
perception:
  enabled: true
  monthly_usd: 1.5
  fast:  {image_side: 768,  video_frames: 8,  frame_side: 512, grid: true,  max_tokens: 600,  estimate_usd: 0.002}
  fine:  {image_side: 1536, video_frames: 24, frame_side: 768, native_video: true, max_tokens: 2000, estimate_usd: 0.03}
  fine_words: [仔细看, 细看, 看清楚, 看仔细, 仔细听, 听清楚]
  max_audio_s: 600           # 语音 / 视频声音最多转写多长（秒）
  native_max_mb: 20          # 整段视频交给模型的大小上限
  card_chars: 800            # 每张感知卡最多保留多少字
