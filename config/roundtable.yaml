          title: 审查论证与准确性
          requirements: 对照题目要求检查论证是否成立、数据和引用是否准确、章节之间是否衔接，指出问题。
          acceptance: 逐条给出问题位置和修改建议
          depends_on: [{id: T2, gives: 章节草稿}, {id: T1, gives: 提纲与论点}]
          split: true
          split_by: 按章节划分，每人审查不同的部分
        - id: T4
