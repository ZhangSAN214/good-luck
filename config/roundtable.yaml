        forget_days: 30
        keep: 4
        slang: [笑死, 绝了, 离谱, 好家伙, 啊这, 蚌埠住了, 破防了, 救命, 草, 摆烂, 上头, 下头, 压力, "6"]   # 10-31 删了老梗（yyds、绝绝子、尊嘟假嘟……，见 memes.stale）
      metaphor: 打比方时爱拿{things}打比方
      formal:                      # 书面词 → 口语（发出前直接换）
        非常: 超
        十分: 挺
        是否: 是不是
        然而: 不过
        令人: 让人
        极其: 超级
        颇为: 挺
        甚是: 挺
        感到十分: 觉得超
        的确: 确实
        因此: 所以
        并且: 而且
        倘若: 要是
        尚未: 还没
        无法: 没法
      explain:                     # 解释句（发出前能删就删；删光了就留原话）
        - 好笑的是
        - 有趣的是
        - 搞笑的是
        - 之所以
        - 原因是
        - 让人(忍不住|感到|觉得)
        - 令人(忍不住|感到|觉得)
        - 这(个|段|条)(视频|图|链接|文章)(展示|讲述|描述|记录|讲)了
        - 因为.{1,20}所以
        - (真的|实在)是太(有趣|好笑|搞笑)了
      recap_chars: 8
      cadence:                     # 连着几条的分寸（docs/BRAIN.md，2026-11-01 你批）：格式、句式、露底、跨条冷却；全程序，只看她自己最近说过的话
        enabled: true
        plain: true                # 聊天里不发列表、加粗、表格、代码框、分隔线；破折号换逗号（小克炒股私聊）
        not_but: true              # 「不是 X，而是 Y」→「不是 X，是 Y」
        window: 8                  # 看她最近 8 条（各个会话合起来）
        face_max: 2                # 同一个 emoji / 颜文字最近 8 条里用过 2 次，这条就不贴（34 条里 ☕ 10 次）
        particles: [呢]            # 最近三成多的话都「……呢」收尾，这条句尾的「呢」去掉（问句不动）
        particle_share: 0.35
        fillers: [不过说实话, 说实话, 说真的, 讲真, 不得不说, 老实讲, 坦白说]   # 最近 8 条说过就这条不说
        ask_streak: 2              # 最近连着 2 条都在反问，这条末尾的「你呢？」去掉
        ask_back:
          - 你呢[？?]
          - 你(?:有|是|在|会|也|平时|最近)?(?:什么|啥|特别)?(?:喜欢|爱|想|觉得|打算)[^，,。！!？?]{0,14}(?:吗|呢|没)?[？?]$
          - (?:是吧|对吧|对不对|你说呢|你觉得呢)[？?]?$
          - ^\s*(?:有|也有)?(?:什么|啥|特别)(?:喜欢|爱)[^，,。！!？?]{0,10}(?:吗|呢|没)?[？?]$
        leaks:                     # 露底的小句删掉：助手话、读订阅摘要、程序原句（被认真问是不是 AI 时的承认不在这里）
          - 数据(?:只)?(?:更新|截止)(?:到|于)
          - 训练数据
          - 知识(?:库)?截止
          - (?:我|这边)(?:没法|无法|不能|查不了)(?:联网|上网|检索|搜索|实时)
          - 我(?:能|可以)快速处理信息
          - (?:真实|实时|最新)[^，,。]{0,8}数据[^，,。]{0,6}(?:查不了|查不到|没法查|拿不到)
          - 作为(?:一个)?(?:语言模型|助手|人工智能助手)
          - 摘要
          - 新闻源
          - 订阅源
          - (?:正文|细节)(?:还没|没)(?:展开|看到|瞧明白|细看)
          - 琢磨「[^」]{1,24}」     # 程序里的目标原句连引号一起说了出来（生活群：「最近在琢磨「有人站得住」」）
        swap:
          "用户(?!体验|量|群|名|协议|数|画像)": 你   # 第 4 次真跑：「关于用户」的抬头被说了出来
        openers:                   # 开口前组织语言的过渡词（11-01 你说的）：每人分到 3 个，较长的话 25% 放在开头，最近 8 条用过就不放
          pool: [怎么说呢, 就是, 不是我说, 算了吧, 可以啊, 嗯……, 那个, 等下, 害, 说起来, 你别说, 好吧, emmm, 讲道理]
          each: 3
          chance: 0.25
          min_chars: 14
    voice:                         # P5 表达：照人物卡「说话风格」说话（docs/MEMBER_ENGINE.md「说话风格」）；只用于生活群和私聊
      enabled: true
      budget_chars: 420            # 说话习惯段最多多少字（8 位相同；10-30 加了说话的样子：标点、笑法、短回复、颜文字）
      samples: 2                   # 每次带几句她自己的示范（轮换着带，只学语气不照抄）
      lengths: {短: 25, 中: 45, 长: 80}   # 人物卡写的句子长短 → 一条大约多少字以内
      quiet_max: 2                 # 外向 ≤2 话少，≥4 话多，其余平常（借 dsh maid 的说话模式档位）
      chatty_min: 4
      modes:
        quiet:  {label: 话少, max_segments: 2, gap_scale: 1.6, reply: 话少，群里没点到你、没什么非说不可的就不接；接也只一两句}
        normal: {label: 平常, max_segments: 3, gap_scale: 1.0, reply: 有想法才接，别人说过的不重复}
        chatty: {label: 话多, max_segments: 4, gap_scale: 0.7, reply: 爱接话，可以连发几条短的，但别抢别人的话、别重复}
      sticker_habits: [不太爱发表情包，心情起伏大时才发一个, 常发表情包和颜文字，四五条里有一条，别连着发同一个, 爱发表情包和颜文字，两三条就有一条，每次挑不一样的]
      check:                       # 说出口前自查：程序查，不花钱；查出问题才改写一次
        enabled: true
        repeat_similarity: 0.6     # 和自己最近 5 条太像
        echo_similarity: 0.5       # 和别人这一轮说的太像（群里没点名时直接不发）
        agree_patterns: ["^(说得对|说的对|确实|没错|对对|对啊|同意|太对了|是的是的|\\+1|附议|赞同|我也觉得|我也这么觉得|我也是这么想|有道理|我也是|我也|同上|一样)[，,！!。~～ ]*"]
        memory_patterns: ["(上次|那次|之前|以前|上回)(我们|咱们|咱俩|我俩|你和我|跟你)", "记得你(上次|之前|以前)?(说过|讲过|提过)", "我们(一起|那时候)(去|吃|看|玩)过"]
        monthly_usd: 0.05          # 改写每月最多花 $0.05（超了就发原文）
    state:                         # 心情和精力（P3）：全由程序按事件算，快慢两层，会回到基线；模型不写情绪
      mood: {fast_half_life_hours: 2, slow_half_life_hours: 48, slow_share: 0.2}
