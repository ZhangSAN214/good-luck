          depends_on: [{id: T2, gives: 草稿}, {id: T3, gives: 审查意见}]

# 渠道模式：
#   openrouter —— 只走聚合平台
#   direct     —— 只走官方直连（及本地）
#   auto       —— 按每个模型 routes 的顺序，直连与 OpenRouter 都可用
# 没有 key 的渠道自动跳过。
channel_mode: auto

# 同一成员有几条渠道时先走哪条（只决定走哪条路，不影响谁上桌）：
#   auto   —— 按每个模型 routes 的顺序
#   custom —— 按 order 列出的渠道先后，没列出的排在后面
# 两种方式下，models.yaml 里填了 monthly_credit_usd（每月附送额度）的渠道，本月按本机账本没用完时最先走，
# 用完排到最后。「余额与用量」面板里可以改，改过的存本机设置，优先于这里。
channel_priority:
  strategy: auto
  order: []

request:
  timeout_s: 120
  failover_rounds: 2          # 所有渠道都失败后从头再试的轮数（含第一轮）
  backoff_s: 2.0              # 两轮之间的等待
  cooldown_rate_limit_s: 30   # 渠道被限流后，冷却期内排到最后
  cooldown_quota_s: 600       # 渠道额度用尽 / key 无效后，冷却期内排到最后
  max_concurrent: 6           # 每个渠道同时在途的请求数上限（全员并发调用时避免触发限流），超过的排队
  requests_per_minute: null   # 每个渠道每分钟请求数上限；null 不限，达到时排队等待

# 文件上传（附件）：类型同时按扩展名和文件头判断；文件按内容哈希存放，文件名只用于显示
uploads:
  max_files: 5              # 每道题最多几个附件
  max_file_mb: 20           # 单个文件大小上限
  max_pdf_pages: 50
  max_text_chars: 60000     # 每个附件提取出的文字最多保留的字数（超出截断并注明）
  scanned_chars_per_page: 20  # PDF 平均每页少于这么多字时提示"可能是扫描件"（不做文字识别）
  describe_max_tokens: 3000   # 图片文字版的输出上限
  transcribe_max_tokens: 8000 # 音频转写的输出上限
  storage_dir: data/uploads

# 工具：成员在作答过程中可以运行代码、写文件、生成图片（文字协议，见 prompts/tools）
# 同一步骤所有成员可用的工具、限额和说明完全相同
tools:
  enabled: true
  max_rounds: 6               # 每次作答最多几轮工具调用
  by_step:
    answer: [python, write_file, generate_image, search, fetch]
    # 修订、互评、交叉审查不再联网（2026-10-22，见项目资料「超预算与慢笨原因」）：查资料在作答 / 子任务时做，
    # 之后的步骤用 python 核算即可；原来每人每步都按搜索计费，占讨论模式预估的大头，也是慢的主要原因
    revise: [python, write_file, generate_image]
    work: [python, write_file, generate_image, search, fetch]
    rework: [python, write_file, generate_image, search, fetch]
    review: [python]   # 互评 / 交叉审查：用来核算
    cross_review: [python]
    merge: [python, write_file]   # 统筹整理交付文件
    # 办公室模式：员工办理与修改；search / fetch 只在经理判断需要查资料时提供
    handle: [python, write_file, generate_image, search, fetch]
    fix: [python, write_file, generate_image, search, fetch]
  python:
    backend: auto             # wasm（Deno + Pyodide，python scripts/setup_sandbox.py 安装）/ docker / auto / off
    timeout_s: 60             # 每次运行的时限（含加载 numpy 等包）
    memory_mb: 1024
    max_runs: 3               # 每位成员每步最多运行几次（出错重跑也算）
    max_runs_by_step: {handle: 5, fix: 4}   # 办公室模式一个人办完全部（算、画图、改完重跑），多给几次
    max_output_chars: 8000    # 回传给成员的输出最多多少字
  files:
    max_file_mb: 10
    max_session_mb: 100
    max_files_per_step: 20
    share_text_chars: 3000    # 转交给其他成员时，每个文本文件最多附上多少字
  image:
    max_per_step: 2           # 每位成员每步最多生成几张图（需要带 image_gen 标签的模型）
  search:                     # 联网搜索（需要 models.yaml 的 search_providers 中有可用服务）
    max_per_step: 2           # 每位成员每步最多搜索几次
    max_fetch_per_step: 3     # 每步最多读取几个网页（只能读本人搜索结果中的链接）
    max_results: 5
    fetch_max_chars: 8000
    require_citations: true   # 用过搜索的答案要用 [S1] 标注来源；编造来源或一条都不引用 → 打回重做

# 媒体生成（图片 / 语音 / 视频）：媒体模型是工具（models.yaml 中 seat: false），按标签 + 档位选择，同档内随机。
# 讨论模式提问时选择输出类型：成员先讨论并写出生成提示词 → 生成 → 带 vision 标签的成员评审结果
# （图片、视频截帧真正发给他们）→ 不满意就改提示词重新生成，最多 max_rounds 轮。
# 协同模式：拆分时可把子任务标为 image / speech / video，由负责人写提示词并生成，再交叉审查。
media:
  enabled: true
  default_tier: budget       # 提问时可改选 flagship（高质量档）
  max_rounds: 3              # 生成 → 评审 → 重新生成，最多几轮（含第一次生成）
  reviewers: 3               # 每轮最多几位评审者（需带 vision 标签）
  confirm_video: true        # 视频每次生成前都先问你；图片、语音、音乐只在超过单题门槛或创作月上限时才问
  images_per_round: 1
  monthly_usd: 5.0           # 创作输出（图片 / 语音 / 视频 / 音乐）每月合计上限；本月快超时先问你，0 = 不限
  speech: {voice: alloy, format: mp3, max_chars: 4000}
  music: {format: mp3, max_chars: 1500}   # 音乐：按「风格、情绪、乐器、时长、有无人声 / 歌词」描述生成一段，不评审
  stickers:                  # 成员专属表情包（形象卡和表情清单在 personas.yaml 的 sticker_cards）
    enabled: true
    tier: budget             # 节电档带 image_edit 的绘图模型，按参考图画
    prefer_tags: [zh, vision]  # 带这些标签越多越先试：中文配文写得准、看参考图更像（样张实测）
    monthly_usd: 3.0         # 表情包单独的每月上限，同时算在上面的 monthly_usd 里
    size: 360                # 存下来的边长（像素）
    check: true              # 画完用最便宜的识图模型核对配文和形象
    check_max_tokens: 1200   # 核对的输出上限（含思考；300 时会被思考全部用掉，正文为空）
    max_attempts: 2          # 核对不合格时换一个模型重画一次
    review: true             # 新画的先进「待审」，你点「可以」后成员才会用
  video:
    audio: true              # 视频同时生成声音（环境声、对白；模型不支持时忽略）
    duration_s: 5
    resolution: 720p
    aspect_ratio: "16:9"
    poll_interval_s: 10      # 轮询间隔
    timeout_s: 900           # 提交后最多等多久；超时记为失败
    submit_retries: 1        # 提交失败 / 任务失败后再试几次
    frames: 4                # 发给评审者的截帧数
    max_mb: 100
  expected_rounds: 1.5       # 花费预估：平均生成几轮
  review_tokens: 500
  refine_tokens: 600
  prompt_max_chars: 2000
  # 风格参考图：上传的图片默认作为风格参考。生成图片时优先选带 image_edit 标签（支持参考图）的模型，
  # 把参考图一并传给它；没有这样的模型时退回只按文字风格规范生成，并在界面上明确提示。
  references: {max: 3, max_mb: 5}
  # 生成的图片对照风格清单由非作者的成员判定；不通过就带着意见退回作者重画，最多这么多次。
  # 仍不通过时保留最后一版，标记"风格未通过"，汇总 / 合并时统筹可见。
  style_retries: 2
  gate_reviewers: 1

# 风格规范提取（style 步骤，讨论 / 协同两种模式共用）：题目带风格参考图又要画图时，放在流程最前面。
# 带 vision 标签的成员（最多 reviewers 位）各自看原图写风格描述，统筹合并成一份规范 + 一份可逐条检查的清单，
# 之后的每次调用都会带上它。没有 vision 成员时改用图片的文字版，并提示"可能不准"。
style:
  enabled: true
  reviewers: 2
  checklist_min: 6
  checklist_max: 10

# 服务端限制（Web 服务）：同时在后台执行的讨论数。等待你确认的讨论不占名额。
limits:
  max_running_sessions: 3

# token 用量的显示单位："大米"。1 粒 = 1000 token，1 勺 = 100 粒，1 碗 = 30 勺，
# 自动换算到合适的单位（85 粒、3 碗 12 勺）。只改变 token 数量的显示，所有金额仍用美元。
display:
  rice:
    grain_name: 粒
    spoon_name: 勺
    bowl_name: 碗
    grain_tokens: 1000
    spoon_grains: 100
    bowl_spoons: 30

# 革新例会（docs/evolution/README.md）：成员读同一叠资料卡（Claude 整理，成员看不到原文），
# 走头脑风暴提建议、匿名互评、投票，导出采纳单；Claude 只从采纳单里挑一条实现、开 PR，合并永远由你点。
# 资料卡放在数据目录的 evolution/收件箱/，采纳单导出到 evolution/采纳单/（都只在你电脑上，不进 git）。
# 默认关闭。开启后服务开着时每周按 schedule 自动开一次；花费超出 meeting_usd / monthly_usd 就不开。
evolution:
  enabled: false
  plan: budget               # 节电档全员上桌
  anonymous: true            # 塔罗牌代号
  topic: 下面的资料卡是本周从开源项目、论文和官方文档里整理的新做法。请结合圆桌（多 AI 协作平台：讨论、协同、头脑风暴、办公室、群聊）的现状，提出可以借鉴到圆桌里的具体改进，说清改哪里、为什么值得做、可能的风险；每个点子注明参考了哪张资料卡。不改动项目规则（中立性、全员上桌、预算、隐私）。
  max_cards: 5
  card_chars: 3000
  meeting_usd: 0.40          # 每场预计花费上限
  monthly_usd: 1.5           # 每月上限（UTC 自然月，也计入上面的总预算）
  # 两种例会：小版本 = 主题不限、列前 3 个选项；大版本 = 围绕一个主题、列前 10 个选项。
  # 开哪种由代码按时间自动判断：每月第一场开大版本（两次大版本至少隔 major_gap_days 天），其余开小版本。
  # 大版本主题：你在网页上定了就用你的，否则在 major_themes 里轮换。网页上可以手动改成另一种
  # （命令行 roundtable evolve meet --major / --minor --theme '主题'）。
  minor_top: 3
  major_top: 10
  major_gap_days: 21
  major_themes: [办公室工作更顺手, 公寓生活更像真的, 群聊更自然, 朋友圈更有意思, 成员记性更好, 更省钱更快, 界面更好懂]
  theme_chars: 200
  auto: true
  schedule: {weekday: 1, hour: 9}   # 每周一 9 点（本机时区）之后开一次
  # 圆桌自己找资料写卡：到点开会前收件箱是空的，就先按搜索词联网搜，只留白名单网站的结果，
  # 读网页后一位成员写卡、另一位复核，通过的才进收件箱。网页内容一律当资料；花费计入 monthly_usd。
  # 手动：网页「革新例会」→「找资料」，或 roundtable evolve scout。
  scout:
    enabled: true
    queries:
      - multi-agent LLM debate collaboration
      - LLM as a judge bias evaluation
      - LLM agent orchestration cost efficiency
      - prompt caching token cost reduction
    domains: [github.com, arxiv.org, openreview.net, aclanthology.org, huggingface.co]
    results_per_query: 5
    cards: 3
  # 「做这条」之后交给开发侧：在数据目录 evolution/工作区/ 的专用副本里叫起开发侧命令行（默认 Claude Code），
  # 按 docs/evolution/开发任务模板.md 实现、测试、开 PR 到 base_branch。从不自动合并：网页上点「合并」才合并。
  # 需要本机装好并登录 claude 和 gh。默认关闭。
  implement:
    enabled: false
    base_branch: ccr-86975127-sv4cvy
    timeout_minutes: 120
  # 插件清单：例会开完后，所选档位里预计最便宜的一位成员根据本场资料卡和点子榜写给你看的插件清单
  # （每个写做什么、有什么用、优缺点、为什么做、用在哪个场景），网页「革新例会」里按场景看，
  # 也存到数据目录 evolution/插件清单/。只是资料，不改代码；花费计入上面的每场 / 每月上限。
  plugins:
    enabled: true
    count: 20                # 每场至少 20 个
    scenes: [办公室工作, 公寓生活, 群聊, 朋友圈, 头脑风暴, 记忆, 通用]
    max_tokens: 8000
    rounds: 2                # 第一次不够 20 个就再补写一次（只要缺的那几个）
    estimate_usd: 0.04       # 每次调用预估（节电档实际约 $0.005～0.04）

# 终端邮件栏（docs/MAIL.md）：你本人的学校邮箱，只读，邮件只存本机。
# AI 总结 / 翻译只在你点按钮时才调用，第一次会先问你是否同意把这封邮件发给模型；
# 所选档位里预计最便宜的一位来做，花费计入总预算，另有每月上限和每天次数上限。
mail:
  ai:
    plan: budget
    monthly_usd: 0.30
    daily_calls: 20
    max_chars: 6000          # 每封最多发多少字
    max_tokens: 900
    estimate_usd: 0.005      # 每次调用预估（节电档实际约 $0.0005～0.003）
    digest_mails: 10
    language: 简体中文

# 办公室的资料浏览器（docs/CLIPPER.md）：打开网页由圆桌直接抓取正文（不调用模型、不花钱），
# 不能打开本机和内网地址；搜索走联网搜索（有花费，计入总预算）。
# 存下来的资料只在本机，提问时勾选附上（和附件一样）。
clipper:
  enabled: true
  timeout_s: 15
  max_page_kb: 3072          # 网页原始大小上限
  max_page_chars: 60000      # 提取后的正文最多显示多少字
  max_clip_chars: 20000      # 一份资料最多存多少字（省 token）
  max_clips: 200             # 资料夹最多存几份，超出时删最旧的
  search_results: 8
  search_estimate_usd: 0.01

# 成员感官（docs/PERCEPTION.md）：聊天 / 私聊里你发的图片、语音、视频，先整理成「感知卡」，成员读卡回应。
# 快速（默认）：图缩小、视频取 8 帧拼成 2 张宫格图、声音转写；你在消息里写「仔细看」等词时用精细：
# 图更大、卡更长；有带 video_in 标签的模型时整段视频连声音交给它，否则多取帧不拼图。
# 转写稿和感知卡按文件内容缓存，同一个文件不重复花钱；精细直接复用快速时的转写稿。
# 模型只按标签和价格挑最便宜的。花费计入聊天月预算和总预算，另有感官自己的月上限。
perception:
  enabled: true
  monthly_usd: 1.5
  fast:  {image_side: 768,  video_frames: 8,  frame_side: 512, grid: true,  max_tokens: 600,  estimate_usd: 0.002}
  fine:  {image_side: 1536, video_frames: 24, frame_side: 768, native_video: true, max_tokens: 2000, estimate_usd: 0.03}
  fine_words: [仔细看, 细看, 看清楚, 看仔细, 仔细听, 听清楚]
  max_audio_s: 600           # 语音 / 视频声音最多转写多长（秒）
  native_max_mb: 20          # 整段视频交给模型的大小上限
  card_chars: 800            # 每张感知卡最多保留多少字

dsh:                             # dsh 工作台（docs/DSH.md）：圆桌在本机管一个 dsh 进程当边车，dsh 插件在里面跑
  enabled: true
  autostart: false               # 圆桌启动时不顺带启动 dsh，用时在「工作台」里点启动
  port: 3080                     # dsh 网页只监听本机 127.0.0.1
  key_env: DEEPSEEK_API_KEY      # dsh 调模型用的 key（只放 .env；用户在官网充值，不经过 OpenRouter）
  balance_url: https://api.deepseek.com/user/balance   # 查余额，用差值估算工作台花了多少
  shared_channels: []            # 圆桌自己也用这个 key 的渠道名（models.yaml），这部分花费从差值里扣掉
  monthly_usd: 3.0               # 工作台每月花费上限：超过就提醒并停掉 dsh（查余额有间隔，可能多花几毛）
  balance_check_minutes: 5
  usd_rates: {CNY: 7.2}          # 余额是人民币时按这个汇率折成美元
  permission_mode: read-only     # dsh 默认只读；要让它改文件改成 workspace-write（只能改 data/dsh/work/）
  job_permission_mode: workspace-write   # 超级电脑派给 dsh 的活：只能写那件活的共享工作文件夹

# 超级电脑（docs/SUPERCOMPUTER.md）：几位编程助手平级、没有固定主管，只在你交活时干活。
# 派活只看下面的数字：分数 = 擅长 × skill + 今天剩余次数比例 × quota − 手上的活 × busy；
# 拆分（split）和合并（merge）也按分数挑人。撞到订阅限额的歇 cooldown_minutes 分钟，活换给下一位。
# 每天次数（daily_limit）在「工作台 → 超级电脑」里也能改。任务正文从标准输入交给命令行，不放进参数。
supercomputer:
  enabled: true
  kinds: [code, frontend, test, docs, research, review]
  max_subtasks: 6
  weights: {skill: 0.6, quota: 0.3, busy: 0.2}
  workers:
    - id: dsh
      label: dsh
      via: dsh                   # 用圆桌的 dsh 工作台（headless 方式），花费计入 dsh.monthly_usd
      skills: {research: 0.85, docs: 0.7, code: 0.6, test: 0.55, review: 0.6, frontend: 0.5, split: 0.6, merge: 0.6}
      daily_limit: 20
      max_parallel: 2
    - id: codex
      label: Codex
      argv: [codex, exec, --skip-git-repo-check, --sandbox, workspace-write, "-"]
      skills: {code: 0.9, test: 0.85, review: 0.75, frontend: 0.7, docs: 0.6, research: 0.5, split: 0.7, merge: 0.7}
      daily_limit: 20
    - id: claude
      label: Claude Code
      argv: [claude, -p, --permission-mode, acceptEdits, --output-format, text]
      skills: {code: 0.85, frontend: 0.85, review: 0.9, docs: 0.85, test: 0.75, research: 0.6, split: 0.85, merge: 0.85}
      daily_limit: 20

# 工作台生成器（docs/KIT.md）：一句话 → 拆需求 → 按零件库拼窗口 → 自动质检 + 截图评审 → 返工。
# 活交给上面的超级电脑（花的是订阅次数）；评审永远不分给窗口的作者本人；做满 max_rounds 轮还不过线就停下来问你。
bench:
  enabled: true
  max_windows: 8
  max_rounds: 3
  pass_avg: 8.0      # 评审各项平均分过线
  pass_min: 6.0      # 每一项都不能低于它
  plan_kind: split
  window_kind: frontend
  review_kind: review
  ask_kind: research   # 成品里的对话窗：问题交给谁答（走订阅次数）
  ask_max_chars: 1000
  rubric: [视觉层次, 信息密度, 一致性, 交互完整, 空状态与边界, 文案, 商业感]
  # 底线标准：来自用户给的参考资料（DSH 工作台的 7 个成品），每个台都要做到，评审逐条判；改这里就改标准
  baseline:
    - 有一个主视觉窗口占大半屏（真实地图、3D、图纸、照片这类真素材），列表和详情围在它旁边
    - 不让助手自己用几何图形画插图、示意图；地图、图片、模型用现成的真素材，找不到就用图标和文字
    - 点一下能联动：点列表里的一项，主视觉定位或高亮，详情跟着换
    - 有自己的主色和标题风格，一眼看得出是什么产品，不是通用后台
    - 数据有真实来源；需要时效的信息联网获取，联不上时标明「参考」和日期
    - 能按用户自己的情况用：换成自己的输入（目的地、日期、人数、场景等），内容跟着变，不是一份写死的样品
    - 手机上能顺手用：首屏先给最重要的内容，按钮够大，不横向溢出
  max_requirements: 12
  # 成品能联网取的公开数据（2026-10-30 用户批：只用免费、公开、不要 key 的）。会把地名、经纬度发给这些网站。
  # 删掉一项，成品就取不到那项，沙箱也会拦下它；全删掉 = 成品完全离线
  net:
    - name: tiles
      use: 真实地图底图（瓦片图），地图零件 mapFrame 会自动用上
      url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      source: © OpenStreetMap 贡献者
      kind: tiles
      ttl_min: 0
    - name: geocode
      use: 地名查经纬度，参数 q（地名）
      url: https://geocoding-api.open-meteo.com/v1/search?name={q}&count=5&language=zh&format=json
      source: Open-Meteo
      ttl_min: 10080
    - name: weather
      use: 未来 7 天每日天气（天气代码、最高最低温、降水概率），参数 lat、lng
      url: https://api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto
      source: Open-Meteo
      ttl_min: 60
    - name: fx
      use: 汇率（欧洲央行每日参考价），参数 from、to（货币代码，如 CNY、JPY）
      url: https://api.frankfurter.dev/v1/latest?base={from}&symbols={to}
      source: 欧洲央行（Frankfurter）
      ttl_min: 720
    - name: wiki
      use: 地点、景点的简介和配图（维基百科摘要，返回 extract、thumbnail.source），参数 q（词条名）
      url: https://zh.wikipedia.org/api/rest_v1/page/summary/{q}
      source: 维基百科
      also: [https://upload.wikimedia.org/]
      ttl_min: 10080
  scout: true       # 找插件：按拆需求写下的缺口去 dsh 插件集市和 GitHub 找（用户 10-29 拍板「全自动，事后看清单」）
  min_stars: 100    # GitHub 星数够这个、许可证宽松才直接搬；不够只借思路
  max_repo_mb: 20   # 仓库太大只借思路
  max_adopt: 3      # 一个工作台最多搬几个

# 日历底座（docs/CALENDAR.md）：只算「今天是什么日子」，每天发事件给成员系统（怎么过节由生活引擎决定）。
# 全部离线计算：法定假日用开源库 holidays，农历和节气查预先算好的表；不调模型、不联网、不花钱。
# 只影响生活（聊天、朋友圈、生活）；工作模式不挂载。你加的纪念日只存本机。
calendar:
  enabled: true
  # 成员的休息日按这里的法定假日算（成员住曼彻斯特）
  rest: {country: GB, subdiv: ENG, label: 英国}
  # 也过、但成员不放假的国家（想加别的国家写 ISO 代码，如 KR、FR、DE）
  cultures:
    - {country: CN, label: 中国, language: zh_CN}
    - {country: US, label: 美国}
    - {country: JP, label: 日本, language: en_US}
  upcoming_days: 3     # 提前几天发「快到了」
  board_days: 7        # 公告栏显示未来几天
  solar_terms: true    # 二十四节气
  lunar_festivals:
    - {name: 春节, lunar: "01-01"}
    - {name: 元宵节, lunar: "01-15"}
    - {name: 龙抬头, lunar: "02-02"}
    - {name: 端午节, lunar: "05-05"}
    - {name: 七夕, lunar: "07-07"}
    - {name: 中元节, lunar: "07-15"}
    - {name: 中秋节, lunar: "08-15"}
    - {name: 重阳节, lunar: "09-09"}
    - {name: 腊八节, lunar: "12-08"}
    - {name: 小年, lunar: "12-23"}
    - {name: 除夕, lunar: "12-last"}
  # 不放假的节日。rule：MM-DD；easter-21（复活节前 21 天）；2-sun-05（5 月第 2 个周日）；last-sun-10
