      无语子, 真的会谢, 社会社会, 老铁没毛病, "666666", 厉害了我的哥, 你是魔鬼吗, 宝藏女孩, 小仙女, 一给我里giaogiao,
      完蛋了芭比, 我不要你觉得我要我觉得, 只因你太美, 我直接好家伙, 绝了家人们, 家人们谁懂啊, 遥遥领先, 显眼包,
    ]
  engine:                          # 成员引擎（docs/MEMBER_ENGINE.md）：只用于聊天、朋友圈、生活
    enabled: true
    context: {budget_chars: 600}   # 调模型时带的资料最多多少字（固定部分放最前，利于缓存）
    card: {budget_chars: 400}      # 随身卡（人物卡的精简版，每次都带）最多多少字，算在上面的 600 字里
    scheduler:                     # 预算调度：你直接找她 > 主动找你 > 群聊 > 生活
      daily_usd: 0.25              # 聊天这一块每天的额度；你直接找她不受它限制
      shares: {proactive: 0.85, group: 0.7, life: 0.5}   # 其余三类最多用到额度的几成，超了只记一行
    heartbeat: {enabled: true, max_actions: 3}
    bus: {keep_days: null, catch_up_days: 14, prompt_keep_days: 3, prompt_keep_chars: 300}   # 事件一直保留（只存本机，攒经历数据）；开机最多补算 14 天；聊天调用的整段提示词留 3 天，之后只留开头 300 字
    brain:                         # 大脑分区（docs/BRAIN.md）：说话前先由程序综合出「意图卡」，模型只管怎么说；全程序、不花钱；只用于生活和私聊、群聊
      enabled: true
      free_choice: true            # 空闲时段按驱力和目标自己挑去哪、做什么（不再照固定作息表）
      silence_below: 0.25          # 群里没点名、这事对她不显著、也不想说话时就不接
      wander_chance: 0.25
      card_chars: 220
      imperfect: 0.08              # 偶尔记不清、敷衍一句（像人）；被认真问是不是 AI 仍如实承认
      drives:                      # 下丘脑：驱力随时间涨，被事满足就降；高了会主动找人、找事做
        social:    {label: 想找人说说话, rate: 0.02, trait: 外向, satisfy: {spoke: 0.2, gathered: 0.15}}
        novelty:   {label: 有点闷，想换点新鲜的, rate: 0.015, trait: 好奇, satisfy: {explored: 0.4, pursued: 0.1}}
        express:   {label: 有话想说, rate: 0.01, trait: 幽默, satisfy: {spoke: 0.3}}
        mastery:   {label: 想把手上在练的事往前推一推, rate: 0.02, trait: 较真, satisfy: {pursued: 0.45}}
      intents:                     # 前额叶：说话前按性格、心情、精力、驱力挑一个意图（加权随机，种子可复现）
        respond:   {label: 接住对方说的具体一点，说你自己的反应, base: 1.0}
        ask:       {label: 对对方说的事好奇，追问一句, base: 0.5, traits: {好奇: 0.3}}
        share:     {label: 讲讲你自己最近的事, base: 0.5, traits: {外向: 0.25}, drives: {express: 0.8}, needs: own}
        shift:     {label: 这个话题聊够了，换到你心里正想的事, base: 0.2, drives: {novelty: 0.8}, needs: own}
        joke:      {label: 开个玩笑或吐槽一句, base: 0.3, traits: {幽默: 0.35}, mood: 0.3}
        disagree:  {label: 你不太同意，直说并给理由, base: 0.15, traits: {较真: 0.3, 温和: -0.15}, needs: claim}
        vent:      {label: 说说你现在的心情，不用藏着, base: 0.05, mood: -0.8}
        brief:     {label: 累了，回得很短就好, base: 0.05, energy: -1.2}
        comfort:   {label: 对方好像不太好，先接住对方的情绪，别急着讲道理, base: 0.8, traits: {温和: 0.3}, needs: sad}
        blurt:     {label: 突然冒出个念头，忍不住说出来（可以有点没头没尾）, base: 0.7, traits: {外向: 0.15, 好奇: 0.15}, needs: whim}
        tangent:   {label: 刚才那句里的一个词勾起了别的事，顺嘴聊过去（歪楼没关系，不用拐回原话题）, base: 0.3, traits: {好奇: 0.15, 幽默: 0.15}, drives: {novelty: 0.3}, needs: last}   # 2026-10-31 用户：人聊着聊着会歪楼
      reward: {near: 0.75, plan_chance: 0.2, met_chance: 0.7, ahead_days: 2}   # 奖赏：盼着 → 兑现 / 落空 / 惊喜（心情变化走下面状态的反射表）
      empathy: {base: 0.35, gentle: 0.12, close: 0.4}   # 共情：别人难过 / 高兴时，自己心情跟着动的概率
      meta: {window: 8, threshold: 4, damp: 0.3}        # 元认知：最近 8 次里同一个套路 ≥4 次就察觉、压一压
      love:                        # 爱与复合情绪（docs/BRAIN.md「爱」）：对每位同事和你各有一组感情，相处中慢慢长；全程序
        enabled: true
        romance: true              # 同事之间可以心动（2026-10-30 你选的）
        romance_user: true         # 对你也可以心动、发展成恋人（2026-10-30 你定的；谁会、怎么爱看各人性格和相处）
        retain_blame: true         # 可以挽留、怪你没来（只留一次、你说睡觉上课工作陪家人朋友时不留、责怪一两句就消气）
        user_name: 用户
        chemistry_floor: 0.45      # 「化学反应」低于它就不会心动：有人一直只是朋友
        chemistry_grow: 0.3        # 日久生情：化学反应 + 0.3 × 在乎（朋友也可能慢慢心动；10-30 彩排：一个月只有 1 位对你有一点心动）
        daily_cap: 0.06            # 每段关系每天在乎 + 心动最多涨多少（10-30 假模型试跑：0.12 时两周就「像家人一样」，太快）
        high: 0.6                  # 亲密 / 心动 / 承诺算「高」的线
        commit_days: 90            # 承诺要时间：认识 90 天才可能到顶（10-30 彩排：一个月就人人「像家人一样」）
        kinds: {"111": 很深的感情, "110": 喜欢又心动, "101": 像家人一样, "100": 处得来, "011": 心里认定了, "010": 有点心动, "001": 习惯了有对方在}
        attachment:                # 依恋方式（按性格分，取最像的一种）
          secure:   {base: 0.4, traits: {温和: 0.2, 外向: 0.2}, longing: 1.0, hurt: 1.0, jealous: 0.15}
          anxious:  {base: 0.0, traits: {温和: 0.35, 较真: 0.25, 外向: 0.1}, longing: 1.6, hurt: 1.5, jealous: 0.5, line: 还有点想确认对方是不是还好、是不是还在意你}
          avoidant: {base: 0.0, traits: {外向: -0.45, 温和: -0.3}, longing: 0.5, hurt: 0.7, jealous: 0.1, line: 你会想，但不会说出来}
        styles:                    # 爱的表达方式（按性格分，取最像的一种）
          words:    {traits: {外向: 1.0}, care: 想到就直接说出来，夸人、说想对方都不藏着, crush: 会忍不住多找对方说话, retain: 可以撒个娇留一句，比如「再聊五分钟嘛」, blame: 可以直接说想对方了，顺带抱怨一句「这几天都去哪了」}
          acts:     {traits: {外向: -1.0}, care: 不太说出口，用行动表示：记住对方喜欢什么、默默帮一把, crush: 不想表现得太明显，但会格外留意对方的消息, retain: 不开口留，只是回得慢一点、短一点, blame: 不说想，第一句回得有点淡，过几句就好了}
          tease:    {traits: {幽默: 1.0}, care: 用互损和玩笑表示亲近, crush: 嘴上偏要损两句，其实很在意, retain: 可以开玩笑留一句，比如「话还没说完，扣你一个鸡腿」, blame: 可以半开玩笑地怪对方，比如「还记得有我这个人吗」}
          tending:  {traits: {温和: 1.0}, care: 先关心对方累不累、吃了没, crush: 会格外照顾对方, retain: 叮嘱对方注意休息，说明天想听后续, blame: 先问对方这几天是不是太忙，再小声说一句有点想}
          reliable: {traits: {较真: 1.0}, care: 说到做到，靠谱就是你的在乎, crush: 会把对方的事放在心上、记得清清楚楚, retain: 约好下次什么时候聊, blame: 如果对方之前说好要来，可以直说「你说过要来的」}
        privileges:                # 只给你的偏心：每位按性格挑两种
