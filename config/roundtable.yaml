          acceptance: 列出核对过的论断及结果，错误和无来源的论断被指出
          depends_on: [{id: T3, gives: 报告初稿}, {id: T1, gives: 收集到的资料}]
          split: true
          split_by: 按报告章节划分，每人核查不同的部分
        - id: T5
          kind: assemble
          title: 整合成最终报告
          requirements: 把各章节按核查意见改正后整合成完整报告文件。
          acceptance: 报告完整，核查指出的问题已处理
          depends_on: [{id: T3, gives: 报告初稿}, {id: T4, gives: 核查意见}]

    - name: report
      label: 报告 / 论文
      when:
        keywords: [报告, 论文, 作文, 议论文, 小论文, 论述, 实验报告, essay, report, thesis, paper, lab report]
      steps:
        - id: T1
          kind: analyze
          title: 分析题目，拟定提纲与论点
          requirements: 弄清题目和评分要求，确定中心论点或研究问题，列出章节提纲和每章要回答的问题。
          acceptance: 提纲覆盖题目的全部要求，论点明确，章节之间逻辑连贯
          split: true
          split_by: 按要点或材料划分，每人分析不同的部分
        - id: T2
          kind: write
          title: 撰写各章节
          requirements: 按提纲撰写完整章节，论述有依据，数据、公式和引用准确。
          acceptance: 章节完整，论证清楚，没有遗漏提纲中的问题
          depends_on: [{id: T1, gives: 提纲与论点}]
