# 圆桌运行参数

# 一张桌最多的组员座位数（各方案的组员数见 routing.yaml，不得超过此值）
seats: 4
# 组员少于此数时暂停问用户；开桌至少需要 min_members 个组员 + 1 个统筹
min_members: 2

budget:
  total_usd: 20.0      # 跨会话累计总预算
  warn_ratio: 0.8      # 累计达到该比例时提醒

# 单步预估 token 超过此值时询问用户
token_threshold: 20000

coordinator:
  # rotate: 在非组员的可用模型中按会话轮换；random: 随机；fixed: 固定为 fixed_id
  strategy: rotate
  fixed_id: null

revise_rounds: 1

# 各步骤使用的提示词版本（prompts/<role>/<version>.md）
prompts:
  planner: v1
  answer: v1
  review: v1
  revise: v1
  synthesize: v1

# 步骤顺序（插件名）
pipeline: [answer, review, revise, synthesize, reveal]

# 渠道模式：
#   openrouter —— 只走聚合平台
#   direct     —— 只走官方直连（及本地）
#   auto       —— 按每个模型 routes 的顺序，直连与 OpenRouter 都可用
# 没有 key 的渠道自动跳过。
channel_mode: auto

request:
  timeout_s: 120
  failover_rounds: 2          # 所有渠道都失败后从头再试的轮数（含第一轮）
  backoff_s: 2.0              # 两轮之间的等待
  cooldown_rate_limit_s: 30   # 渠道被限流后，冷却期内排到最后
  cooldown_quota_s: 600       # 渠道额度用尽 / key 无效后，冷却期内排到最后
