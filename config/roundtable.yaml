    search_per_day: 2              # 找新梗 1 次 + 查一个还不知道意思的经典梗
    fresh_days: 14                 # 两周没再上榜就下架（你说的：禁止老梗）
    max_age_days: 90               # 火起来超过 3 个月的不收
    know_traits: {幽默: 0.08, 外向: 0.08, 好奇: 0.06}   # 谁懂得多只看性格分：爱玩爱聊的懂得多、跟得快
    use_chance: 0.12               # 偶尔提一句「最近在玩的梗」，用不用她自己看场合（10-31 第 3 次试跑：新东西用过头反而像 AI）
    quick_chance: 0.5              # 别人说了上句（如「康神开播了」），懂的人一半时候直接接下句（「真的假的？！」），不调模型
    classics:                      # 经典梗：永远不下架、不算老梗；意思空着的会在联网时补上，网页里能改
      - {phrase: 虾爹, aliases: [NiKo, niko, Niko]}
      - {phrase: 我chovey, aliases: [chovey, Chovey]}
