      when:
        tools: [python]
        keywords: [代码, 编程, 程序, 脚本, 算法, 数据分析, 数据处理, 统计, 计算, 实现, 函数, 爬虫, 可视化, 图表, 报表, python, code, script, dataset, csv, excel]
