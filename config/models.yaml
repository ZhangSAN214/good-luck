# 模型注册表。加模型只改这里，代码不针对具体模型写分支。
#
# model: OpenRouter 上的模型 ID —— 写入前请运行 `python scripts/check_models.py` 核对
# price: 美元 / 每百万 token，只用于事前预估；实际费用以 OpenRouter 返回为准
# tags:  能力标签，必须属于下方 tag_vocabulary
#
# ⚠️ 以下 model ID 和价格来自网页搜索，尚未用 OpenRouter API 核对。

tag_vocabulary:
  # 领域类
  - math
  - derivation
  - science
  - writing
  - code
  - research
  - design
  - long_context
  # 媒体类（v1 不使用，预留）
  - vision
  - image_gen
  - tts
  - transcribe
  - video_gen

models:
  - id: gpt-6-sol
    provider: openrouter
    model: openai/gpt-6-sol
    vendor: OpenAI
    price: {input: 2.00, output: 10.00}
    tags: [math, writing, code, research, vision]
    enabled: true

  - id: claude-sonnet-5.5
    provider: openrouter
    model: anthropic/claude-sonnet-5.5
    vendor: Anthropic
    price: {input: 2.00, output: 10.00}
    tags: [writing, code, research, long_context, vision]
    enabled: true

  - id: gemini-3.8-flash
    provider: openrouter
    model: google/gemini-3.8-flash
    vendor: Google
    price: {input: 0.75, output: 3.75}
    tags: [design, research, long_context, vision]
    enabled: true

  - id: qwen3.8-max
    provider: openrouter
    model: qwen/qwen3.8-max
    vendor: Alibaba
    price: {input: 2.00, output: 6.00}
    tags: [math, derivation, science, code]
    enabled: true

  - id: grok-4.7
    provider: openrouter
    model: x-ai/grok-4.7
    vendor: xAI
    price: {input: 2.00, output: 6.00}
    tags: [math, code, research]
    enabled: true

  - id: deepseek-v4.1-flash
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash
    vendor: DeepSeek
    # 分时段计价（闲时 0.15/0.60）；这里按高峰价保守预估
    price: {input: 0.30, output: 1.20}
    tags: [math, derivation, code]
    enabled: true
