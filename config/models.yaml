# 模型注册表。加模型 / 加渠道只改这里，代码不针对具体模型或厂商写分支。
#
# ⚠️ 以下模型 ID 与价格来自网页搜索，尚未用官方 API 核对。
#    OpenRouter 部分可运行 `python scripts/check_models.py` 核对。

tag_vocabulary:
  # 领域类
  - math
  - derivation
  - science
  - writing
  - code
  - research
  - design
  - long_context
  - zh              # 擅长中文（语音合成按脚本语言选择时使用）
  # 媒体类
  - vision          # 能看图（图片、视频截帧）
  - video_in        # 能直接看整段视频（画面连声音，作为消息附件发送）
  - transcribe      # 能直接接收音频的对话模型（旧的转写方式；有 stt 模型时优先用 stt）
  - image_gen       # 图像生成
  - image_edit      # 支持以参考图为输入的图像生成 / 编辑（风格参考图用）
  - tts             # 文字转语音
  - stt             # 语音转文字（Whisper 系列）
  - video_gen       # 视频生成（异步）
  - music_gen       # 音乐生成（配乐、片头、整首歌；同步返回音频）

# 调用渠道。key 只从 .env 读取，这里只写环境变量名。
#   adapter: 适配器实现（openai_compat / anthropic / gemini）
#   kind:    aggregator（聚合平台）| direct（官方直连）| local（本地）
#   monthly_credit_usd: 每月附送的额度（美元，如会员送的 API 额度），没用完时优先走这个渠道（可选，
#            也可在「余额与用量」面板里填）
#   param_aliases: 该渠道的参数改名（统一参数名 → 渠道要求的参数名）
#            roundtable.yaml 的 channel_mode 据此筛选渠道
channels:
  openrouter:
    adapter: openai_compat
    kind: aggregator
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    extra_body:
      usage: {include: true}   # 让 OpenRouter 返回实际费用
    balance: credits           # 余额与用量面板：查账户余额与这个 key 的已用（只读）
  openai:
    adapter: openai_compat
    kind: direct
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    param_aliases:
      max_tokens: max_completion_tokens   # OpenAI 新模型不接受 max_tokens
  anthropic:
    adapter: anthropic
    kind: direct
    base_url: https://api.anthropic.com
    key_env: ANTHROPIC_API_KEY
  google:
    adapter: gemini
    kind: direct
    base_url: https://generativelanguage.googleapis.com/v1beta
    key_env: GEMINI_API_KEY
  xai:
    adapter: openai_compat
    kind: direct
    base_url: https://api.x.ai/v1
    key_env: XAI_API_KEY
  deepseek:
    adapter: openai_compat
    kind: direct
    base_url: https://api.deepseek.com/v1
    key_env: DEEPSEEK_API_KEY
  # 本地 ComfyUI（只出图，不花钱，不需要 key）：装好后在 config/models.local.yaml 写
  #   model_switches: {comfyui-local: true}
  # 就能打开下面的 comfyui-local 模型（步骤见 docs/COMFYUI.md）
  comfyui:
    adapter: comfyui
    kind: local
    base_url: http://127.0.0.1:8188
    key_env: null
  # 本地模型示例（OpenAI 兼容端点，不需要 key）：
  # local:
  #   adapter: openai_compat
  #   kind: local
  #   base_url: http://localhost:11434/v1
  #   key_env: null

# tier: flagship（高价高能力）/ budget（便宜档）。成本优先路由（config/routing.yaml）
#       只看档位和能力标签；启用的模型必须填写档位。
# aliases: 别称，会在转发给其他模型前被遮蔽，防止暴露身份。
# routes 按优先顺序排列：前一个渠道遇到 429、额度用尽、网络错误等时切换到下一个。
# price: 美元 / 每百万 token，只用于事前预估；实际费用以渠道返回为准（有则用）。
