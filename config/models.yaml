# 模型注册表。加模型 / 加渠道只改这里，代码不针对具体模型或厂商写分支。
#
# ⚠️ 以下模型 ID 与价格来自网页搜索，尚未用官方 API 核对。
#    OpenRouter 部分可运行 `python scripts/check_models.py` 核对。

tag_vocabulary:
  # 领域类
  - math
  - derivation
  - science
  - writing
  - code
  - research
  - design
  - long_context
  # 媒体类（v1 不使用，预留）
  - vision
  - image_gen
  - tts
  - transcribe
  - video_gen

# 调用渠道。key 只从 .env 读取，这里只写环境变量名。
#   adapter: 适配器实现（openai_compat / anthropic / gemini）
#   kind:    aggregator（聚合平台）| direct（官方直连）| local（本地）
#            roundtable.yaml 的 channel_mode 据此筛选渠道
channels:
  openrouter:
    adapter: openai_compat
    kind: aggregator
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    extra_body:
      usage: {include: true}   # 让 OpenRouter 返回实际费用
  openai:
    adapter: openai_compat
    kind: direct
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
  anthropic:
    adapter: anthropic
    kind: direct
    base_url: https://api.anthropic.com
    key_env: ANTHROPIC_API_KEY
  google:
    adapter: gemini
    kind: direct
    base_url: https://generativelanguage.googleapis.com/v1beta
    key_env: GEMINI_API_KEY
  xai:
    adapter: openai_compat
    kind: direct
    base_url: https://api.x.ai/v1
    key_env: XAI_API_KEY
  deepseek:
    adapter: openai_compat
    kind: direct
    base_url: https://api.deepseek.com/v1
    key_env: DEEPSEEK_API_KEY
  # 本地模型示例（OpenAI 兼容端点，不需要 key）：
  # local:
  #   adapter: openai_compat
  #   kind: local
  #   base_url: http://localhost:11434/v1
  #   key_env: null

# tier: flagship（高价高能力）/ budget（便宜档）。成本优先路由（config/routing.yaml）
#       只看档位和能力标签；启用的模型必须填写档位。
# aliases: 别称，会在转发给其他模型前被遮蔽，防止暴露身份。
# routes 按优先顺序排列：前一个渠道遇到 429、额度用尽、网络错误等时切换到下一个。
# price: 美元 / 每百万 token，只用于事前预估；实际费用以渠道返回为准（有则用）。
models:
  - id: gpt-6-sol
    vendor: OpenAI
    tier: flagship
    aliases: [ChatGPT, GPT]
    price: {input: 2.00, output: 10.00}
    tags: [math, writing, code, research, vision]
    enabled: true
    routes:
      - {channel: openai, model: gpt-6-sol}
      - {channel: openrouter, model: openai/gpt-6-sol}

  - id: claude-sonnet-5.5
    vendor: Anthropic
    tier: flagship
    aliases: [Claude]
    price: {input: 2.00, output: 10.00, cached_input: 0.20}
    tags: [writing, code, research, long_context, vision]
    enabled: true
    routes:
      - {channel: anthropic, model: claude-sonnet-5-5}
      - {channel: openrouter, model: anthropic/claude-sonnet-5.5}

  - id: gemini-3.1-pro
    vendor: Google
    aliases: [Gemini, Bard, DeepMind]
    tier: flagship
    # 搜索结果中最新的 Pro 为 3.1 Pro Preview（未找到 3.8 Pro）；待核对
    price: {input: 2.00, output: 12.00, cached_input: 0.20}
    tags: [math, derivation, science, research, long_context, vision]
    enabled: true
    routes:
      - {channel: google, model: gemini-3.1-pro-preview}
      - {channel: openrouter, model: google/gemini-3.1-pro-preview}

  - id: gemini-3.8-flash
    vendor: Google
    aliases: [Gemini, Bard, DeepMind]
    tier: budget
    price: {input: 0.75, output: 3.75}
    tags: [design, research, long_context, vision]
    enabled: true
    routes:
      - {channel: google, model: gemini-3.8-flash}
      - {channel: openrouter, model: google/gemini-3.8-flash}

  - id: qwen3.8-max
    vendor: Alibaba
    aliases: [Qwen, 通义千问, 千问, 通义, 阿里巴巴, 阿里云]
    tier: flagship
    price: {input: 2.00, output: 6.00}   # 已由用户核对
    tags: [math, derivation, science, code]
    enabled: true
    routes:
      - {channel: openrouter, model: qwen/qwen3.8-max-0902}

  # OpenRouter 上的固定版本为 qwen/qwen3.8-flash-20260826；
  # 这里用不带日期的别名，会跟随 OpenRouter 指向最新版本
  - id: qwen3.8-flash
    vendor: Alibaba
    aliases: [Qwen, 通义千问, 千问, 通义, 阿里巴巴, 阿里云]
    tier: budget
    price: {input: 0.15, output: 0.47}
    tags: [math, code, long_context, vision]
    enabled: true
    routes:
      - {channel: openrouter, model: qwen/qwen3.8-flash}

  - id: grok-4.7
    vendor: xAI
    tier: flagship
    aliases: [Grok]
    price: {input: 2.00, output: 6.00}
    tags: [math, code, research]
    enabled: true
    routes:
      - {channel: xai, model: grok-4.7}
      - {channel: openrouter, model: x-ai/grok-4.7}

  - id: deepseek-v4-pro
    vendor: DeepSeek
    aliases: [深度求索]
    tier: flagship
    # 搜索结果中的旗舰为 V4 Pro（未找到 V4.1 旗舰版）。OpenRouter 价格取 8 月 GA 版本；待核对
    price: {input: 0.66, output: 1.98}
    tags: [math, derivation, code, research, long_context]
    enabled: true
    routes:
      # 官方直连价格来源不一致，按较高的标价保守预估；待核对
      - {channel: deepseek, model: deepseek-v4-pro, price: {input: 1.74, output: 3.48}}
      - {channel: openrouter, model: deepseek/deepseek-v4-pro}

  - id: deepseek-v4.1-flash
    vendor: DeepSeek
    aliases: [深度求索]
    tier: budget
    # 分时段计价（闲时 0.15/0.60）；这里按高峰价保守预估
    price: {input: 0.30, output: 1.20}
    tags: [math, derivation, code]
    enabled: true
    routes:
      - {channel: deepseek, model: deepseek-v4.1-flash}
      - {channel: openrouter, model: deepseek/deepseek-v4.1-flash}
