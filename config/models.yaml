  # （media.moment_photos.local_only: true 时不换，只发文字）。
  # 路由的 model 是 config/comfyui/ 下的工作流模板文件名（ComfyUI 里「导出 API 格式」的 JSON）。
  # image_edit：模板里接了 IPAdapter，用成员设定图做参考；没有参考图时换 workflow_without_refs 模板。
  # image_prompt: tags：SDXL 二次元底模吃标签，朋友圈配图用 moment_photo_tags 提示词。
  - id: comfyui-local
