name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Playwright browser (frontend end-to-end tests)
        run: playwright install --with-deps chromium
      # 不联网、不需要任何 key；代码沙箱相关的越权测试在没有 Deno 时自动跳过
      - run: pytest -q
