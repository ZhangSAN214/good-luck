    candidates:
      - {model: minimax-speech-2.8-hd, voice: lovely_girl, params: {}, note: 萌萌少女：最高最亮的一档}
      - {model: minimax-speech-2.8-hd, voice: tianxin_xiaoling, params: {speed: 1.1}, note: 甜心小玲，语速加快}
      - {model: minimax-speech-2.8-hd, voice: qiaopi_mengmei, params: {speed: 1.1}, note: 俏皮萌妹，语速加快}
      - {model: minimax-speech-2.8-hd, voice: diadia_xuemei, params: {}, note: 嗲嗲学妹（wav 版，方便量音高）}
      - {model: minimax-speech-2.8-hd, voice: "Chinese (Mandarin)_Crisp_Girl", params: {speed: 1.1}, note: 清脆少女，语速加快}
      - {model: minimax-speech-2.8-hd, voice: tianxin_xiaoling, params: {pitch: 3}, note: 甜心小玲，音高 +3（试 pitch 参数）}
