# 成员试音候选（scripts/voice_audition.py 读这个文件）。只用语音模型自带的合成音色，不克隆、不模仿真人。
#
# 每位成员（键是 models.yaml 的 vendor）：
#   line        试音台词：同一位成员的所有候选念同一句，方便对比；照人物卡的口头禅写
#   candidates  候选列表：model 语音模型 id，voice 音色名，note 为什么选它（给人看的）；
#               style 可选：念之前先告诉语音模型用什么语气（只有能听懂语气描述的模型才写，
#               见下面 style_template），用来「用文字描述做出新声音」
#
# 2026-11-02 第一轮：全力档（MiniMax）每人 3 个，节电档（Gemini + 语气描述）每人 2 个。
# MiniMax 有几个音色名是按官方音色表写的，云端连不上没法核对，跑的时候不存在的会显示「失败」，不花钱。

# 带 style 的候选实际念的文字。{style} 换成语气描述，{line} 换成台词。
style_template: "用{style}的语气说：{line}"

members:
  OpenAI:
    name: ChatGPT（小白）
    persona: 二十四岁的傲娇龙娘，嘴上「本龙才不在乎」，被夸了尾巴藏不住；嗓门大、爱抢答
    line: 哼，本龙才不在乎你夸不夸呢……不过刚才那句，夸得还挺准的。书签要借吗？先说好，要还的哦。
    candidates:
      - {model: minimax-speech-2.8-hd, voice: "Chinese (Mandarin)_Crisp_Girl", note: 清脆少女：亮、利落，适合嘴硬}
      - {model: minimax-speech-2.8-hd, voice: qiaopi_mengmei, note: 俏皮萌妹：得意时那股劲}
      - {model: minimax-speech-2.8-hd, voice: "Chinese (Mandarin)_Warm_Bestie", note: 温暖闺蜜：嘴硬心软偏软的一版}
      - {model: gemini-3.8-flash-tts, voice: Autonoe, style: 傲娇、嘴硬又有点得意，声音明亮有劲, note: 明亮音色 + 傲娇语气}
      - {model: gemini-3.8-flash-tts, voice: Laomedeia, style: 傲娇、嘴硬又有点得意，声音明亮有劲, note: 活泼音色 + 傲娇语气}
