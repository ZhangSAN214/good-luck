# 成员试音候选（scripts/voice_audition.py 读这个文件）。只用语音模型自带的合成音色，不克隆、不模仿真人。
#
# 每位成员（键是 models.yaml 的 vendor）：
#   line        试音台词：同一位成员的所有候选念同一句，方便对比；照人物卡的口头禅写
#               （候选里也可以写 line，念它自己的版本）
#   candidates  候选列表：model 语音模型 id，voice 音色名，note 为什么选它（给人看的）；
#               style 可选：念之前先告诉语音模型用什么语气（只有能听懂语气描述的模型才写，
#               见下面 style_template），用来「用文字描述做出新声音」
#
# 2026-11-02 第一轮：全力档（MiniMax）每人 3 个，节电档（Gemini + 语气描述）每人 2 个；
# 4～5 号的语气描述取自 /mnt/project-files/成员音色/配音导演本_11-02.md 的「一句话导演提示」。
# 6 号是「带感情」对比版：1 号音色念加了语气词、停顿 <#秒#> 和 (laughs)/(sighs) 等标记的台词。
# MiniMax 有几个音色名是按官方音色表写的，云端连不上没法核对，跑的时候不存在的会显示「失败」，不花钱。

# 带 style 的候选实际念的文字。{style} 换成语气描述，{line} 换成台词。
style_template: "用{style}的语气说：{line}"

