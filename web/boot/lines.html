<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圆桌 · 开机</title>
<style>
  html{color-scheme:normal}
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
// 开机动画「线条汇聚 · 扫描睁眼」（圆桌原创，一镜到底，约 9 秒）。
// 镜头贴在今日轮值成员的脸上：发光的线从黑暗里一根根飞进来，勾出头发和五官（长线先到，带亮头）；
// 脸上罩一层网格线 → 扫描光扫过、人像显影（闭着眼）→ 睁眼 → 左侧标题「圆桌」和欢迎语打出来 →
// 镜头一路拉远，人正好落在终端首页立绘的位置和大小上，底色淡去就是真正的首页（无缝衔接）。
// - 节奏和画面语言学习自 dsh-boot-suite 里的「鲸鱼娘扫描睁眼」开机片（只学手法，不用它的视频和角色）；
//   人像、线稿、闭眼都来自圆桌自己的首页立绘和闭眼差分，线稿在浏览器里现场提取，不调用模型、不花钱。
// - 首页立绘的位置、图、脸的位置、闭眼差分向外层要：parent.roundtableLanding()（还在加载时 { pending: true }）。
//   没有立绘或不在首页时只放标题，然后淡出。以后成员有了 3D 模型，把人像这一层换成模型渲染即可。
// 消息：boot:bg（第一帧画好，外层可以把底色撤掉）、boot:sfx（音效）、boot:done（放完）。
(() => {
  const inFrame = window.parent !== window;
  const post = (m) => { if (inFrame) try { parent.postMessage(m, '*'); } catch (_) {} };
  const sfx = (name, arg) => post({ type: 'boot:sfx', name, arg });
  const cv = document.getElementById('c');
  const g = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
    cv.width = W; cv.height = H;
  }
  fit(); addEventListener('resize', fit);

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const eo = (t) => 1 - Math.pow(1 - t, 3);
  const eio = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  function rng(seed) { let s = seed >>> 0; return () => ((s = (Math.imul(s ^ (s >>> 15), 1 | s) + 0x6d2b79f5) | 0), ((s ^ (s >>> 7)) >>> 0) / 4294967296); }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LINE = '#8fdcff'; // 线条的冷青色（参考片的主色），标题下划线用成员主题色

  /* ── 线稿提取：缩到 ~300px → 灰度（透明处当黑）→ 模糊 → Sobel → 非极大值抑制 → 双阈值 → 沿边连成折线 ── */
  // crop：只提取图里这一块（0～1），结果坐标仍是整张图的 0～1；size：提取时长边缩到多少像素
  function trace(img, crop = { x: 0, y: 0, w: 1, h: 1 }, size = 300, keep = 420) {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if (!iw || !ih) return null;
    const sw = iw * crop.w, sh = ih * crop.h;
    const k = size / Math.max(sw, sh);
    const w = Math.max(8, Math.round(sw * k)), h = Math.max(8, Math.round(sh * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, iw * crop.x, ih * crop.y, sw, sh, 0, 0, w, h);
    const px = x.getImageData(0, 0, w, h).data;
    const N = w * h, gray = new Float32Array(N), alpha = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const a = px[i * 4 + 3] / 255;
      alpha[i] = a;
      gray[i] = (0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]) * a + 0 * (1 - a);
    }
    // 3×3 模糊两遍（像素画的台阶边会变顺）
    let a = gray, b = new Float32Array(N);
    for (let pass = 0; pass < 2; pass++) {
      for (let yy = 1; yy < h - 1; yy++) for (let xx = 1; xx < w - 1; xx++) {
        const i = yy * w + xx;
        b[i] = (a[i] * 4 + (a[i - 1] + a[i + 1] + a[i - w] + a[i + w]) * 2 + a[i - w - 1] + a[i - w + 1] + a[i + w - 1] + a[i + w + 1]) / 16;
      }
      [a, b] = [b, a];
    }
    const mag = new Float32Array(N), dir = new Uint8Array(N);
    for (let yy = 1; yy < h - 1; yy++) for (let xx = 1; xx < w - 1; xx++) {
      const i = yy * w + xx;
      const gx = -a[i - w - 1] - 2 * a[i - 1] - a[i + w - 1] + a[i - w + 1] + 2 * a[i + 1] + a[i + w + 1];
      const gy = -a[i - w - 1] - 2 * a[i - w] - a[i - w + 1] + a[i + w - 1] + 2 * a[i + w] + a[i + w + 1];
      // 轮廓（透明边）也算一条边
      const ax = alpha[i + 1] - alpha[i - 1], ay = alpha[i + w] - alpha[i - w];
      const m = Math.hypot(gx, gy) + Math.hypot(ax, ay) * 600;
      mag[i] = m;
      const ang = ((Math.atan2(gy || ay, gx || ax) * 180) / Math.PI + 180) % 180;
      dir[i] = ang < 22.5 || ang >= 157.5 ? 0 : ang < 67.5 ? 1 : ang < 112.5 ? 2 : 3;
    }
    const OFF = [[1, 0], [1, 1], [0, 1], [-1, 1]];
    const HI = 150, LO = 70;
    const edge = new Uint8Array(N);
    for (let yy = 2; yy < h - 2; yy++) for (let xx = 2; xx < w - 2; xx++) {
      const i = yy * w + xx, m = mag[i];
      if (m < LO) continue;
      const [dx, dy] = OFF[dir[i]];
      if (m < mag[i + dy * w + dx] || m < mag[i - dy * w - dx]) continue;
      edge[i] = m >= HI ? 2 : 1;
    }
    // 弱边只在连着强边时保留
    const stack = [];
    for (let i = 0; i < N; i++) if (edge[i] === 2) stack.push(i);
    while (stack.length) {
      const i = stack.pop();
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const j = i + dy * w + dx;
        if (edge[j] === 1) { edge[j] = 2; stack.push(j); }
      }
    }
    // 连线：从端点出发沿着边走，优先保持方向
    const seen = new Uint8Array(N), strokes = [];
    const nb = (i) => { const out = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue; const j = i + dy * w + dx; if (edge[j] === 2 && !seen[j]) out.push(j); } return out; };
    const walk = (s) => {
      const pts = [s]; seen[s] = 1; let cur = s, pdx = 0, pdy = 0;
      for (;;) {
        const n = nb(cur); if (!n.length) break;
        let best = n[0], bs = -9;
        for (const j of n) { const dx = (j % w) - (cur % w), dy = ((j / w) | 0) - ((cur / w) | 0); const sc = dx * pdx + dy * pdy - (Math.abs(dx) + Math.abs(dy)) * 0.1; if (sc > bs) { bs = sc; best = j; } }
        pdx = (best % w) - (cur % w); pdy = ((best / w) | 0) - ((cur / w) | 0);
        seen[best] = 1; pts.push(best); cur = best;
      }
      return pts;
    };
    const order = [];
    for (let i = 0; i < N; i++) if (edge[i] === 2) order.push(i);
    // 先从端点（只有一个邻居）开始，线更完整
    const deg = (i) => { let d = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if ((dx || dy) && edge[i + dy * w + dx] === 2) d++; return d; };
    order.sort((p, q) => deg(p) - deg(q));
    for (const s of order) {
      if (seen[s]) continue;
      const pts = walk(s);
      if (pts.length < 10) continue;
      // 抽稀：每隔两三个点留一个
      const out = [];
      const P = (i) => [crop.x + ((i % w) / w) * crop.w, crop.y + (((i / w) | 0) / h) * crop.h];
      for (let k2 = 0; k2 < pts.length; k2 += 2) out.push(P(pts[k2]));
      out.push(P(pts[pts.length - 1]));
      strokes.push(out);
    }
    strokes.sort((p, q) => q.length - p.length);
    return { strokes: strokes.slice(0, keep), aspect: iw / ih };
  }

  /* ── 线条：排时序（长线先到），每条从画面外某个方向飞进来，同时按弧长生长 ── */
  function prepare(strokes, seed) {
    const r = rng(seed);
    const lines = strokes.map((raw) => {
      let p = raw;
      if (p.length > 3) { // Chaikin 平滑一遍
        const q = [p[0]];
        for (let k = 0; k < p.length - 1; k++) {
          const [ax, ay] = p[k], [bx, by] = p[k + 1];
          q.push([ax * 0.75 + bx * 0.25, ay * 0.75 + by * 0.25], [ax * 0.25 + bx * 0.75, ay * 0.25 + by * 0.75]);
        }
        q.push(p[p.length - 1]); p = q;
      }
      const len = [0];
      for (let k = 1; k < p.length; k++) len.push(len[k - 1] + Math.hypot(p[k][0] - p[k - 1][0], p[k][1] - p[k - 1][1]));
      return { p, len, L: len[len.length - 1] };
    });
    lines.sort((a, b) => b.L - a.L);
    const maxL = lines.length ? lines[0].L : 1;
    lines.forEach((st, rank) => {
      const u = rank / Math.max(1, lines.length - 1);
      st.start = 0.2 + 2.3 * Math.pow(u, 0.85) + r() * 0.15;
      st.dur = 0.45 + 0.5 * Math.min(1, st.L / maxL) + r() * 0.15;
      // 飞来的方向：大多从左上 / 右下斜着进来，像发丝被风吹进画面
      const base = r() < 0.6 ? -2.4 : 0.75;
      const ang = base + (r() - 0.5) * 0.9, dist = 0.08 + r() * 0.22;
      st.ox = Math.cos(ang) * dist; st.oy = Math.sin(ang) * dist;
    });
    return lines;
  }

  // 相机：图里 (u, v) → 屏幕。k=0 贴脸特写，k=1 落在首页立绘上（恒等）
  let cam = null;
  function setCam(R, head, k, push) {
    const hx = R.x + (R.flip ? 1 - head[0] : head[0]) * R.w, hy = R.y + head[1] * R.h;
    const zClose = (0.74 * H) / (0.2 * R.h) * push;
    const Z = Math.exp(lerp(Math.log(zClose), 0, k));
    const ox = lerp(W * 0.64, hx, k), oy = lerp(H * 0.47, hy, k);
    cam = { R, Z, hx, hy, ox, oy };
  }
  const SX = (u) => { const { R, Z, hx, ox } = cam; return (R.x + (R.flip ? 1 - u : u) * R.w - hx) * Z + ox; };
  const SY = (v) => { const { R, Z, hy, oy } = cam; return (R.y + v * R.h - hy) * Z + oy; };

  function drawLines(lines, t, a) {
    if (a <= 0.003) return;
    const live = [];
    for (const st of lines) { const q = clamp((t - st.start) / st.dur); if (q > 0) live.push([st, q, eo(q)]); }
    if (!live.length) return;
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round'; g.lineJoin = 'round';
    const path = (st, a0, b0, e) => {
      const f = (1 - e) * (1 - e), ox = st.ox * f, oy = st.oy * f, { p, len } = st;
      let on = false;
      for (let k = 0; k < p.length; k++) {
        if (len[k] < a0) continue;
        if (len[k] > b0) {
          if (on) { const tt = (b0 - len[k - 1]) / Math.max(1e-9, len[k] - len[k - 1]); g.lineTo(SX(lerp(p[k - 1][0], p[k][0], tt) + ox), SY(lerp(p[k - 1][1], p[k][1], tt) + oy)); }
          break;
        }
        const X = SX(p[k][0] + ox), Y = SY(p[k][1] + oy);
        if (!on) { g.moveTo(X, Y); on = true; } else g.lineTo(X, Y);
      }
    };
    g.strokeStyle = LINE;
    for (const [lw, al] of [[5.5, 0.06], [2.2, 0.16], [1.1, 0.85]]) {
      g.lineWidth = lw * DPR; g.globalAlpha = al * a; g.beginPath();
      for (const [st, , e] of live) path(st, 0, st.L * e, e);
      g.stroke();
    }
    // 生长头：一段更亮的尾迹 + 光点
    g.strokeStyle = '#ffffff'; g.lineWidth = 1.6 * DPR; g.globalAlpha = 0.9 * a; g.beginPath();
    const heads = [];
    for (const [st, q, e] of live) {
      if (q >= 1) continue;
      const hd = st.L * e; path(st, Math.max(0, hd - st.L * 0.22), hd, e); heads.push([st, hd, e]);
    }
    g.stroke();
    for (const [st, hd, e] of heads) {
      let k = 1; while (k < st.p.length - 1 && st.len[k] < hd) k++;
      const f = (1 - e) * (1 - e), X = SX(st.p[k][0] + st.ox * f), Y = SY(st.p[k][1] + st.oy * f), R = 9 * DPR;
      const gr = g.createRadialGradient(X, Y, 0, X, Y, R);
      gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(0.3, 'rgba(143,220,255,.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.globalAlpha = a; g.fillStyle = gr; g.fillRect(X - R, Y - R, 2 * R, 2 * R);
    }
    g.restore();
  }

  /* ── 脸部网格：一只略微转向的球面经纬网，只画在人物身上 ── */
  const meshCv = document.createElement('canvas');
  function drawMesh(fig, t, a) {
    if (a <= 0.003) return;
    const p = eo(seg(t, 2.5, 4.0));
    if (p <= 0) return;
    meshCv.width = W; meshCv.height = H;
    const m = meshCv.getContext('2d');
    const [hu, hv] = fig.head;
    const cx = SX(hu), cy = SY(hv + 0.01), rx = Math.abs(SX(hu + 0.13) - cx), ry = Math.abs(SY(hv + 0.1) - SY(hv));
    m.strokeStyle = LINE; m.lineWidth = 0.9 * DPR; m.globalAlpha = 0.55;
    const yaw = -0.35, pitch = 0.12;
    const P = (lat, lon) => {
      const x = Math.cos(lat) * Math.sin(lon), y = Math.sin(lat), z = Math.cos(lat) * Math.cos(lon);
      const x1 = x * Math.cos(yaw) + z * Math.sin(yaw), z1 = -x * Math.sin(yaw) + z * Math.cos(yaw);
      const y2 = y * Math.cos(pitch) - z1 * Math.sin(pitch), z2 = y * Math.sin(pitch) + z1 * Math.cos(pitch);
      return [cx + x1 * rx, cy + y2 * ry, z2];
    };
    m.beginPath();
    const N = 14;
    for (let i = 1; i < N; i++) { // 纬线
      const lat = -Math.PI / 2 + (i / N) * Math.PI;
      let on = false;
      for (let j = 0; j <= 48 * p; j++) {
        const [x, y, z] = P(lat, -Math.PI / 2 + (j / 48) * Math.PI);
        if (z < 0) { on = false; continue; }
        if (!on) { m.moveTo(x, y); on = true; } else m.lineTo(x, y);
      }
    }
    for (let i = 0; i <= N; i++) { // 经线
      const lon = -Math.PI / 2 + (i / N) * Math.PI;
      let on = false;
      for (let j = 0; j <= 40 * p; j++) {
        const [x, y, z] = P(-Math.PI / 2 + (j / 40) * Math.PI, lon);
        if (z < 0) { on = false; continue; }
        if (!on) { m.moveTo(x, y); on = true; } else m.lineTo(x, y);
      }
    }
    m.stroke();
    // 节点上的小亮点
    m.fillStyle = '#e8f8ff'; m.globalAlpha = 0.7;
    for (let i = 2; i < N - 1; i += 2) for (let j = 1; j < N; j += 2) {
      const [x, y, z] = P(-Math.PI / 2 + (i / N) * Math.PI, -Math.PI / 2 + (j / N) * Math.PI);
      if (z > 0.2 && (i + j) / (2 * N) < p) m.fillRect(x - DPR, y - DPR, 2 * DPR, 2 * DPR);
    }
    // 只留在人物身上，往外渐淡
    m.globalCompositeOperation = 'destination-in'; m.globalAlpha = 1;
    drawFigureTo(m, fig.closed);
    m.globalCompositeOperation = 'destination-in';
    const gr = m.createRadialGradient(cx, cy, Math.min(rx, ry) * 0.5, cx, cy, Math.max(rx, ry) * 1.1);
    gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    m.fillStyle = gr; m.fillRect(0, 0, W, H);
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a; g.drawImage(meshCv, 0, 0); g.restore();
  }

  function drawFigureTo(ctx, img) {
    const x0 = SX(0), x1 = SX(1), y0 = SY(0), y1 = SY(1);
    ctx.save();
    if (x1 < x0) { ctx.translate(x0 + x1, 0); ctx.scale(-1, 1); ctx.drawImage(img, x1, y0, x0 - x1, y1 - y0); }
    else ctx.drawImage(img, x0, y0, x1 - x0, y1 - y0);
    ctx.restore();
  }

  /* ── 显影：扫描光从上往下扫过，扫过的地方人像出现（先是闭眼的，睁眼时换回原图） ── */
  const revCv = document.createElement('canvas');
  function drawPortrait(fig, t) {
    const rv = seg(t, 3.3, 4.9);
    if (rv <= 0) return;
    const open = eio(seg(t, 5.1, 5.55));
    revCv.width = W; revCv.height = H;
    const o = revCv.getContext('2d');
    if (open < 1) { o.globalAlpha = 1; drawFigureTo(o, fig.closed); }
    if (open > 0) { o.globalAlpha = open; drawFigureTo(o, fig.img); o.globalAlpha = 1; }
    const top = SY(fig.head[1] - 0.2), bot = SY(fig.head[1] + 0.3);
    const scanY = lerp(top, bot, eio(rv));
    if (rv < 1) {
      o.globalCompositeOperation = 'destination-in';
      const gr = o.createLinearGradient(0, scanY - H * 0.25, 0, scanY);
      gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      o.fillStyle = gr; o.fillRect(0, 0, W, H);
      o.globalCompositeOperation = 'source-over';
    }
    g.drawImage(revCv, 0, 0);
    if (rv < 1) { // 扫描线
      g.save(); g.globalCompositeOperation = 'lighter';
      const gr = g.createLinearGradient(0, scanY - 30 * DPR, 0, scanY + 4 * DPR);
      gr.addColorStop(0, 'rgba(143,220,255,0)'); gr.addColorStop(0.85, 'rgba(190,240,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, scanY - 30 * DPR, W, 34 * DPR);
      g.restore();
    }
    // 睁眼那一下：一道横向的光掠过眼睛
    const gl = seg(t, 5.15, 5.9);
    if (gl > 0 && gl < 1) {
      const ey = SY(fig.head[1] + 0.012), ex = lerp(SX(fig.head[0] - 0.2), SX(fig.head[0] + 0.2), eo(gl));
      g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = Math.sin(gl * Math.PI) * 0.8;
      const gr = g.createRadialGradient(ex, ey, 0, ex, ey, 160 * DPR);
      gr.addColorStop(0, 'rgba(220,250,255,.9)'); gr.addColorStop(0.2, 'rgba(143,220,255,.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.setTransform(1, 0, 0, 0.12, 0, ey * 0.88); g.fillStyle = gr; g.fillRect(ex - 160 * DPR, ey - 160 * DPR, 320 * DPR, 320 * DPR);
      g.restore();
    }
  }

  /* ── 画面四周的细界面：品牌、刻度、角标、左下的启动日志 ── */
  const MONO = 'ui-monospace,Consolas,"Cascadia Mono",monospace';
  const SANS = '"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif';
  function hud(t, a) {
    if (a <= 0.003) return;
    const p = eo(seg(t, 0.1, 1.1)), u = H / 720;
    g.save(); g.globalAlpha = a; g.fillStyle = 'rgba(214,236,255,.85)'; g.strokeStyle = 'rgba(160,210,255,.35)'; g.lineWidth = DPR;
    const m = 26 * u;
    g.font = `600 ${11 * u}px ${MONO}`; g.textBaseline = 'top';
    g.globalAlpha = a * p; g.fillText('ROUNDTABLE', m, m);
    g.font = `${8.5 * u}px ${MONO}`; g.fillStyle = 'rgba(170,200,230,.6)';
    g.fillText('EIGHT SEATS · ONE TABLE', m, m + 15 * u);
    g.beginPath(); g.moveTo(m + 92 * u, m + 6 * u); g.lineTo(m + 92 * u + 220 * u * p, m + 6 * u); g.stroke();
    g.textAlign = 'right'; g.fillText('RT-OS · BOOT', W - m, m); g.fillText(new Date().toISOString().slice(0, 10), W - m, m + 13 * u);
    g.textAlign = 'left';
    // 左侧竖排小字
    const tags = ['SYNC', 'MEMORY', 'OFFICE', 'APARTMENT', 'CHAT'];
    tags.forEach((s, i) => { g.globalAlpha = a * seg(t, 0.5 + i * 0.12, 0.9 + i * 0.12) * 0.7; g.fillText(s, m, H * 0.3 + i * 13 * u); });
    // 四角刻度
    g.globalAlpha = a * p; const c = 10 * u;
    for (const [x, y, sx, sy] of [[m, H - m, 1, -1], [W - m, H - m, -1, -1]]) { g.beginPath(); g.moveTo(x, y + sy * c); g.lineTo(x, y); g.lineTo(x + sx * c, y); g.stroke(); }
    g.beginPath(); g.moveTo(m, H * 0.26); g.lineTo(m, H * 0.26 + 40 * u * p); g.stroke();
    // 底边的进度刻度
    for (let i = 0; i < 9; i++) { g.globalAlpha = a * (seg(t, 0.4, 7) * 9 > i ? 0.7 : 0.18); g.fillRect(m + 30 * u + i * 6 * u, H - m - 3 * u, 3 * u, 3 * u); }
    g.restore();
  }

  function title(t, a, name, accent) {
    if (a <= 0.003) return;
    const u = H / 720, x = W * 0.075, y = H * 0.4;
    g.save(); g.globalAlpha = a; g.textBaseline = 'alphabetic';
    // 大字「圆桌」：从左往右擦出来，带一点色散
    const w1 = seg(t, 4.7, 5.6);
    if (w1 > 0) {
      g.font = `900 ${76 * u}px ${SANS}`;
      const tw = g.measureText('圆桌').width;
      g.save(); g.beginPath(); g.rect(x - 4 * u, y - 80 * u, (tw + 8 * u) * eo(w1), 100 * u); g.clip();
      const sh = (1 - w1) * 6 * u;
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = 'rgba(255,70,90,.55)'; g.fillText('圆桌', x - sh, y);
      g.fillStyle = 'rgba(60,170,255,.55)'; g.fillText('圆桌', x + sh, y);
      g.globalCompositeOperation = 'source-over';
      const gr = g.createLinearGradient(0, y - 70 * u, 0, y);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#bcd8f0');
      g.fillStyle = gr; g.fillText('圆桌', x, y);
      g.restore();
      // ROUNDTABLE 跟在后面
      g.font = `600 ${15 * u}px ${MONO}`; g.fillStyle = 'rgba(220,236,255,.9)';
      const word = 'ROUNDTABLE'; const n = Math.round(word.length * seg(t, 5.2, 5.9));
      g.fillText(word.slice(0, n).split('').join(' '), x + tw + 18 * u, y - 8 * u);
    }
    // 下划线（成员主题色）+ 欢迎语
    const w2 = seg(t, 5.6, 6.3);
    if (w2 > 0) {
      g.fillStyle = accent; g.fillRect(x, y + 14 * u, 64 * u * eo(w2), 2.5 * u);
      g.fillStyle = 'rgba(150,200,255,.6)'; g.fillRect(x + 70 * u, y + 15 * u, 150 * u * eo(w2), 1 * u);
      g.globalAlpha = a * w2;
      g.font = `600 ${17 * u}px ${SANS}`; g.fillStyle = '#eaf4ff';
      g.fillText(name ? `欢迎回来 · 今天由${name}值班` : '欢迎回来', x, y + 44 * u);
      g.font = `${9.5 * u}px ${MONO}`; g.fillStyle = 'rgba(170,200,230,.7)';
      g.fillText('W E L C O M E   B A C K', x, y + 62 * u);
    }
    // 启动日志：一行行打出来
    const logs = ['> 8 位成员已就位', '> 记忆同步完成', '> 办公室已开门'];
    g.font = `${10.5 * u}px ${MONO}`;
    logs.forEach((s, i) => {
      const q = seg(t, 5.9 + i * 0.3, 6.3 + i * 0.3); if (q <= 0) return;
      g.globalAlpha = a; g.fillStyle = i === logs.length - 1 && q < 1 ? '#8fdcff' : 'rgba(150,230,190,.85)';
      g.fillText(s.slice(0, Math.ceil(s.length * q)), x, y + 100 * u + i * 16 * u);
    });
    g.restore();
  }

  function backdrop(t, a) {
    g.clearRect(0, 0, W, H);
    if (a <= 0) return;
    g.save(); g.globalAlpha = a;
    g.fillStyle = '#03060c'; g.fillRect(0, 0, W, H);
    const gr = g.createRadialGradient(W * 0.62, H * 0.45, 0, W * 0.62, H * 0.45, Math.max(W, H) * 0.65);
    gr.addColorStop(0, 'rgba(30,60,110,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // 远处的光斑
    const r = rng(11); g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 26; i++) {
      const x = r() * W, y = r() * H, R = (6 + r() * 30) * DPR, f = 0.5 + 0.5 * Math.sin(t * (0.4 + r()) + i);
      const b = g.createRadialGradient(x, y, 0, x, y, R);
      b.addColorStop(0, `rgba(110,170,255,${0.05 + 0.06 * f})`); b.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = b; g.fillRect(x - R, y - R, 2 * R, 2 * R);
    }
    g.restore();
  }

  const landing = () => {
    if (!inFrame) return null;
    try { return typeof parent.roundtableLanding === 'function' ? parent.roundtableLanding() : { pending: true }; } catch (_) { return null; }
  };
  const getJson = async (url) => { try { const r = await fetch(url, { credentials: 'same-origin' }); return r.ok ? await r.json() : null; } catch (_) { return null; } };
  const soft = (hex) => (/^#?[0-9a-f]{6}$/i.test(hex || '') ? (hex[0] === '#' ? hex : '#' + hex) : null);

  /** 首页立绘 → 人像素材：原图、闭眼图（贴上闭眼差分）、脸部线稿 */
  function makeFigure(L) {
    const img = L.image, iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    const closed = document.createElement('canvas'); closed.width = iw; closed.height = ih;
    const c = closed.getContext('2d'); c.drawImage(img, 0, 0);
    if (L.blink && L.blink.image) {
      const b = L.blink.box;
      if (b) c.drawImage(L.blink.image, b[0] * iw, b[1] * ih, b[2] * iw, b[3] * ih);
      else c.drawImage(L.blink.image, 0, 0, iw, ih);
    }
    const head = Array.isArray(L.head) && L.head.length === 2 ? L.head : [0.47, 0.18];
    const crop = { x: clamp(head[0] - 0.3, 0, 0.4), y: clamp(head[1] - 0.15, 0, 0.6), w: 0.6, h: 0.4 };
    crop.w = Math.min(crop.w, 1 - crop.x); crop.h = Math.min(crop.h, 1 - crop.y);
    const tr = trace(closed, crop, 640, 900) || { strokes: [] };
    return { img, closed, head, lines: prepare(tr.strokes, 4242) };
  }

  let fig = null, R = null, T0 = 0, finished = false, name = '', accent = '#e8833a';
  const DUR = 9.2; // 系统开了「减少动态」时 2 倍速
  const done = () => { if (!finished) { finished = true; post('boot:done'); } };

  function frame(now) {
    if (finished) return;
    const t = ((now - T0) / 1000) * (reduce ? 2 : 1);
    if (!fig) { // 没有立绘：只放界面和标题
      backdrop(t, 1 - seg(t, 3.2, 4));
      hud(t, 1 - seg(t, 3, 3.8));
      title(t + 4.5, 1 - seg(t, 3, 3.8), name, accent);
      if (t >= 4) return done();
      return requestAnimationFrame(frame);
    }
    if (t > 6.6 && !R.remeasured) { // 拉远之前再量一次首页立绘（窗口可能改过大小）
      R.remeasured = true;
      const L = landing();
      if (L && L.rect) Object.assign(R, { x: L.rect.x * DPR, y: L.rect.y * DPR, w: L.rect.w * DPR, h: L.rect.h * DPR });
    }
    const pull = eio(seg(t, 6.9, 8.9));
    setCam(R, fig.head, pull, lerp(0.92, 1.0, eo(seg(t, 0, 6.9))));
    backdrop(t, 1 - eio(seg(t, 7.6, 8.9)));
    hud(t, 1 - seg(t, 6.8, 7.6));
    drawLines(fig.lines, t, 1 - 0.85 * seg(t, 3.6, 5.0) - 0.15 * seg(t, 6.6, 7.4));
    drawMesh(fig, t, 1 - seg(t, 4.6, 5.6));
    drawPortrait(fig, t);
    title(t, 1 - seg(t, 6.8, 7.5), name, accent);
    if (!fig.cue1 && t > 3.3) { fig.cue1 = true; sfx('whoosh'); }
    if (!fig.cue2 && t > 5.1) { fig.cue2 = true; sfx('confirm'); }
    if (!fig.cue3 && t > 6.9) { fig.cue3 = true; sfx('sunrise'); }
    if (t >= DUR) return done();
    requestAnimationFrame(frame);
  }

  async function start() {
    backdrop(0, 1); // 先铺上底色，等素材的这一两秒也是黑底
    const [art, sd] = await Promise.all([getJson('/api/members'), getJson('/api/standee')]);
    // 首页立绘还在加载：最多等 2.5 秒（期间是黑底，不会露出首页）
    for (let i = 0; i < 25 && landing() && landing().pending; i++) await new Promise((r) => setTimeout(r, 100));
    const L = landing();
    if (L && L.rect && L.image) {
      R = { x: L.rect.x * DPR, y: L.rect.y * DPR, w: L.rect.w * DPR, h: L.rect.h * DPR, flip: !!L.flip };
      try { fig = makeFigure(L); } catch (_) { fig = null; }
      name = L.name || '';
    } else if (sd && sd.available) name = sd.name || '';
    const members = (art && art.available && art.members) || [];
    const me = members.find((m) => name && [m.name, m.nickname, m.display, m.id].includes(name));
    accent = soft(me && me.theme_color) || accent;
    backdrop(0, 1);
    post({ type: 'boot:bg', clear: true });
    sfx('power');
    T0 = performance.now();
    requestAnimationFrame(frame);
  }
  window.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') done(); });
  start();
})();
</script>
</body>
</html>
