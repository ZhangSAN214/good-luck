<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圆桌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/agent.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/ideas.css">
</head>
<body>
<script src="js/boot.js"></script>
<div class="app">
  <header class="top">
    <div class="brand"><h1>圆桌</h1><button type="button" class="link bt-open" id="bootcfg" title="开机动画设置">片头</button></div>
    <nav class="seg entries" id="entries" aria-label="入口（Alt+1 / 2 / 3）">
      <button type="button" data-m="work" aria-pressed="true">办公室</button>
      <button type="button" data-m="home" aria-pressed="false">公寓楼</button>
      <button type="button" data-m="chat" aria-pressed="false">群聊</button>
    </nav>
    <div class="ctrls" id="workctrls">
      <button class="btn" id="new" type="button">新题目</button>
      <button class="btn" id="evolve" type="button" title="成员读资料卡、提建议、投票">革新例会</button>
      <button class="btn gold" id="reveal" type="button" disabled title="讨论结束后可以揭晓">揭晓身份</button>
      <button class="btn" id="toggle" type="button" aria-expanded="true">收起面板</button>
    </div>
    <span class="meter" id="meter">本场 $0.0000</span>
  </header>

  <section class="home view" id="home" hidden aria-label="公寓楼"></section>
  <section class="gchat view" id="gchat" hidden aria-label="群聊"></section>

  <div class="main" id="main">
    <div class="stagecol">
      <div class="stage" id="stage" aria-label="圆桌座位图"></div>
      <div class="legend" id="legend"></div>
    </div>

    <section class="chat" id="chat" aria-label="讨论过程">
      <div class="q" id="question" hidden></div>
      <div class="feed" id="feed" aria-live="polite">
        <div class="feed-list" id="feed-list"></div>
        <div class="typing" id="typing" hidden></div>
      </div>
      <form class="noteform" id="noteform" autocomplete="off" hidden>
        <input type="text" id="note" maxlength="1000" placeholder="中途补充意见（下一个步骤开始时带给大家）" aria-label="中途补充">
        <button class="btn" type="submit" id="notesend">补充</button>
        <span class="hint" id="noteerr" role="alert"></span>
      </form>
      <form class="composer" id="composer" autocomplete="off">
        <div class="row">
          <div class="seg" id="workflow" aria-label="模式"></div>
          <div class="seg" id="tier" aria-label="成员档位"></div>
          <div class="seg" id="media" aria-label="输出类型" title="讨论模式：商定生成提示词后生成图片 / 语音 / 视频"></div>
          <div class="seg" id="mediatier" aria-label="媒体质量" hidden></div>
          <label class="hint switch"><input type="checkbox" id="anonymous"> 匿名</label>
          <span class="hint" id="mode-hint"></span>
        </div>
        <div class="row" id="manual" hidden>
          <div class="picks" id="picks"></div>
          <label class="hint">统筹
            <select id="coordinator" aria-label="统筹"><option value="">自动选择</option></select>
          </label>
        </div>
        <div class="row">
          <textarea id="ask" placeholder="输入题目：Enter 提交，Shift+Enter 换行；可以把文件拖到这里（按 / 随时回到这里）" aria-label="题目"></textarea>
          <div class="side">
            <button class="btn" type="button" id="attach" title="上传图片、PDF、Word、文本或音频">添加附件</button>
            <button class="btn primary" type="submit" id="submit">提交</button>
          </div>
          <input type="file" id="file" multiple hidden>
        </div>
        <div class="files" id="attachments" hidden></div>
        <div class="estimate" id="estimate" hidden aria-label="提交前预估"></div>
        <div class="formerr" id="formerr" hidden></div>
      </form>
    </section>

    <aside class="panel" aria-label="统筹面板">
      <div class="phd"><h2>统筹面板</h2><span id="pstate">空闲</span></div>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-t="flow" aria-selected="true">流程</button>
        <button role="tab" data-t="split" aria-selected="false">分工</button>
        <button role="tab" data-t="reviews" aria-selected="false">互评</button>
        <button role="tab" data-t="tools" aria-selected="false">工具</button>
        <button role="tab" data-t="media" aria-selected="false">媒体</button>
        <button role="tab" data-t="contrib" aria-selected="false">贡献</button>
        <button role="tab" data-t="usage" aria-selected="false">用量</button>
        <button role="tab" data-t="channels" aria-selected="false">渠道</button>
        <button role="tab" data-t="history" aria-selected="false">历史</button>
        <button role="tab" data-t="cast" aria-selected="false">名册</button>
        <button role="tab" data-t="office" aria-selected="false">员工</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
</div>
<dialog class="viewer" id="viewer" aria-label="文件预览"></dialog>
<dialog class="viewer" id="people" aria-label="成员设定与记忆"></dialog>
<dialog class="viewer" id="feeds" aria-label="上网"></dialog>
<dialog class="viewer" id="moments" aria-label="朋友圈"></dialog>
<dialog class="viewer" id="bootdlg" aria-label="开机动画"></dialog>
<dialog class="viewer" id="evolvedlg" aria-label="革新例会"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
