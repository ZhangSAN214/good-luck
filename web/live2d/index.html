<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live2D 样机</title>
<style>
  :root { --bg: #f3eee8; --fg: #2b2622; --muted: #7a6f66; --btn: #fffaf5; --line: #d9cfc5; --accent: #c8642a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1a18; --fg: #efe7df; --muted: #a89c91; --btn: #2a2522; --line: #3b3430; --accent: #e08a4f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  #wrap { position: fixed; inset: 0 0 64px 0; }
  #stage { width: 100%; height: 100%; display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; min-height: 64px; padding: 8px 16px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; border-top: 1px solid var(--line); }
  #emotions { display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: var(--btn); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  label { display: inline-flex; align-items: center; gap: 4px; }
  #info { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
</style>
<!-- Cubism Core 是 Live2D 的专有运行时，不进仓库，每次从官方地址加载 -->
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="../vendor/pixi/pixi.min.js"></script>
</head>
<body>
<div id="wrap"><canvas id="stage" aria-label="Live2D 模型"></canvas></div>
<div id="bar">
  <div id="emotions" aria-label="情绪"></div>
  <label><input type="checkbox" id="follow" checked> 视线跟随鼠标</label>
  <label><input type="checkbox" id="talk"> 说话（随机音节）</label>
  <label>音频对口型 <input type="file" id="audio" accept="audio/*"></label>
  <div id="info"><div id="status">准备中……</div><div id="missing"></div></div>
</div>
<script type="module" src="player.js"></script>
</body>
</html>
