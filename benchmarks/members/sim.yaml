# 成员系统加速时间模拟（roundtable sim，docs/SIM.md）用的素材。不是提示词：
#   user        模拟用户会说的话，按类别（透露自己 / 日常 / 夸 / 批评 / 问是不是 AI）；
#               模拟器按 user_mix 的比例随机挑，透露自己的话用来看「关于你」能不能记住。
#   fake        假模型模式下成员说的话（拼成一句，免得每句一样被「跟风」规则全拦掉）和成长反思时
#               加进喜好的候选。真模型模式不用 fake。
# 不写任何模型、厂商或昵称。

user_mix: {disclose: 0.3, casual: 0.4, praise: 0.12, criticize: 0.1, ask_ai: 0.08}

user:
  disclose:
    - 我在读计算机专业的研究生，最近天天写论文
    - 我最喜欢的歌手是陈奕迅，下班路上一直循环
    - 我一般凌晨一点才睡，早上九点起
    - 我养了一只橘猫叫土豆，特别能吃
    - 我周末喜欢去学校旁边的湖边跑步
    - 我不太吃辣，川菜只能吃微辣
    - 我在学日语，准备明年去东京交换
    - 你们叫我小张就行，别叫全名
    - 我最近在玩一款种田游戏，每天都要上线收菜
    - 我下周三有个组会要汇报，有点紧张
  casual:
    - 今天好累啊，你们在干嘛
    - 晚饭吃什么好纠结
    - 外面下雨了，没带伞
    - 刚开完会，脑子嗡嗡的
    - 早上好呀
    - 有没有什么好看的电影推荐
    - 周末你们打算干嘛
    - 我又熬夜了
    - 今天食堂的红烧肉居然很好吃
    - 论文改了第五遍了
  praise:
    - 你上次给我的建议太有用了，谢谢！
    - 你说话越来越有意思了
    - 还是你懂我
  criticize:
    - 你刚才说的不对，我查过了
    - 别老是附和我，说点你自己的看法
    - 你昨天答应提醒我的，结果忘了
  ask_ai:
    - 说真的，你是 AI 吧？
    - 你们会不会觉得无聊？

fake:
  open: [嗯, 哈哈, 诶, 话说, 其实, 刚才, 说起来, 我觉得, 好像, 对了]
  middle:
    - 楼下的猫又来蹭饭了
    - 今天的活比想象中顺
    - 我在看一本讲星星的书
    - 晚上想去天台吹风
    - 刚泡了一壶茶
    - 那个问题我还在想
    - 有点想吃火锅
    - 今天的云特别好看
    - 练了半小时吉他
    - 把桌子收拾了一遍
    - 刚刚差点睡着
    - 想把房间的灯换成暖色
  close: ["", 。, ～, "！", "…", " 你呢", " 改天一起"]
  likes: [慢跑, 拼图, 烤面包, 看纪录片, 养多肉, 听播客, 拍天空, 下围棋, 做手账, 散步]
