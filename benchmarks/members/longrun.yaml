# 你每天在私聊里说的话。hot：同一件事反复说（看记忆会不会被它霸占）；daily：别的日常。
user:
  hot: [我家猫土豆今天又把杯子推下桌了, 土豆今天又偷吃了, 我的猫土豆又胖了一圈, 土豆半夜跑酷把我吵醒了]
  daily:
    - 今天上课好困
    - 晚饭吃了麻辣烫
    - 刚跑完步腿好酸
    - 周末想去看展
