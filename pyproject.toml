[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roundtable"
version = "0.1.0"
description = "多个 AI 匿名协作完成作业的圆桌平台"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anthropic>=1.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # 附件：PDF / Word 文字提取、文本文件编码识别
    "pypdf>=4.0",
    "python-docx>=1.1",
    "charset-normalizer>=3.3",
    # 成员生成的表格预览；代码运行时监视子进程内存
    "openpyxl>=3.1",
    "psutil>=5.9",
    # 局域网访问：在电脑上显示给平板扫的二维码（纯 Python，无其他依赖）
    "segno>=1.5",
    # 主时区（zoneinfo）：Windows 自带没有时区数据库
    "tzdata>=2024.1; sys_platform == 'win32'",
    # 日历：各国法定假日（离线计算，纯 Python）
    "holidays>=0.60",
]

[project.scripts]
roundtable = "roundtable.cli:main"

[project.optional-dependencies]
# 视频生成结果的截帧（发给评审者）；没有安装时视频评审只看文字说明
media = [
    "av>=12",
    "pillow>=10",
]
# 音乐卡片连 QQ 音乐等桌面播放器：读 Windows 系统媒体控制（只在 Windows 上装）
windows = [
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]
# 桌面版的应用窗口（Windows 用 Edge WebView2，macOS 用系统 WebKit）；没装时改用 Edge / Chrome 应用窗口
desktop = [
    "pywebview>=5.3",
]
dev = [
    "av>=12",
    "pillow>=10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    # anthropic SDK 1.x 基于 httpx2；测试直接用它的 MockTransport
    "httpx2>=2.0",
    "ruff>=0.5",
    # 前端端到端测试（tests/web）；还需要 `playwright install chromium`，没有浏览器时自动跳过
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 沙箱的 Deno 启动脚本
"roundtable.core.tools" = ["runner.mjs"]
# 日历的农历与节气表（scripts/build_lunar_table.py 生成）
"roundtable.core.almanac" = ["lunar_table.json"]
# 工作台质检在页面里跑的测量脚本
"roundtable.core.benchkit" = ["probe.js", "shell.html", "card.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
